<script type="text/x-dc-logic" id="dc-logic">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.timers = [];
  }
  later(fn, ms) { this.timers.push(setTimeout(fn, ms)); }
  componentWillUnmount() { clearInterval(this.loop); this.timers.forEach((t) => clearTimeout(t)); }
  tap(n) { try { if (navigator && navigator.vibrate) navigator.vibrate(n || 12); } catch (e) {} }
  stopRest() { clearInterval(this.loop); }
  startRest(secs) {
    this.stopRest();
    this.setState({ rest: secs, restTotal: secs, restOver: false });
    const unit = window.GSD_BETA ? 1000 : 100, end = Date.now() + secs * unit;   // the demo runs rest 10x faster
    if (typeof GSN !== 'undefined') GSN.keepAwake();
    this.loop = setInterval(() => {
      const left = Math.ceil((end - Date.now()) / unit);
      if (left <= 0) {
        this.stopRest();
        this.tap([40, 60, 40]);
        this.setState({ rest: 0, restOver: true });
        if (typeof GSN !== 'undefined') GSN.tap('go', 'GO AGAIN!', 'Rest’s over: next set', 'rest');
      } else if (left !== (this.state || {}).rest) {
        this.setState({ rest: left });
      }
    }, 250);
  }

  openW(e, x) {
    if (x.bw || this._wL) return;
    const SUG = {"GOBLET SQUAT": [8, 12, 16, 2, "one dumbbell, held at your chest"], "ROMANIAN DEADLIFT": [20, 30, 40, 2.5, "the whole bar, plates included"], "WALKING LUNGE": [4, 6, 10, 1, "in each hand"], "LEG PRESS": [30, 50, 80, 5, "on the machine"], "LAT PULLDOWN": [20, 30, 40, 2.5, "on the stack"], "SEATED ROW": [20, 30, 40, 2.5, "on the stack"], "DUMBBELL ROW": [8, 12, 18, 2, "one dumbbell"], "FACE PULL": [7.5, 10, 15, 2.5, "on the cable"], "HAMMER CURL": [4, 6, 10, 1, "in each hand"], "BENCH PRESS": [20, 30, 45, 2.5, "the whole bar: an empty Olympic bar is 20 kg"], "OVERHEAD PRESS": [15, 20, 30, 2.5, "the whole bar"], "BARBELL CURL": [10, 15, 20, 2.5, "the whole bar"], "LATERAL RAISE": [2, 4, 6, 1, "in each hand"]}, PLAN = 'leg', sug = SUG[x.name];
    const ls = (k) => { try { return localStorage.getItem(k); } catch (er) { return null; } };
    let WT = {}; try { WT = JSON.parse(ls('gsd.weights') || '{}'); } catch (er) {}
    let P = null; try { P = JSON.parse(ls('gsd.progress') || 'null'); } catch (er) {}
    const tip = !!(x.first && P && P.gym && P.gym[PLAN] && P.gym[PLAN].tip && WT[x.name] != null);
    const lv = ls('gsd.fitLevel') || 'new', LVN = { new: 'just starting', back: 'getting back into it', regular: 'pretty regular' };
    const step = sug ? sug[3] : 2.5;
    const L = document.createElement('div'); L.className = 'wt-layer'; L.setAttribute('role', 'dialog'); L.setAttribute('aria-modal', 'true'); L.setAttribute('aria-label', 'Your weight for ' + x.name.toLowerCase());
    L.innerHTML = '<div class="wt-scrim"></div><div class="wt-card"><span class="wt-tape"></span><span class="wt-t title-die">' + x.name + '</span><span class="wt-s">your working weight · ' + x.reps + '</span>'
      + (tip ? '<button type="button" class="wt-tip">⬆ READY FOR MORE: +2.5 KG</button>' : '')
      + '<div class="wt-row"><button type="button" class="wt-pm" data-d="-1" aria-label="Less">−</button><label class="wt-box"><input class="wt-in" type="text" inputmode="decimal" aria-label="Weight in kilograms" placeholder="?"><span>kg</span></label><button type="button" class="wt-pm" data-d="1" aria-label="More">+</button></div>'
      + (sug ? '<button type="button" class="wt-sug">SUGGEST A WEIGHT</button><span class="wt-why" aria-live="polite"></span>' : '')
      + '<button type="button" class="wt-save">SAVE</button><button type="button" class="wt-x">cancel</button></div>';
    document.body.appendChild(L); this._wL = L;
    const card = L.querySelector('.wt-card'), inp = L.querySelector('.wt-in');
    const stage = document.getElementById('dc-stage') || document.querySelector('[data-dc-root]') || document.body, R = stage.getBoundingClientRect(), k = Math.min(1.4, (R.width || innerWidth) / 390);
    card.style.transform = 'translate(-50%, -50%) scale(' + k + ') rotate(-1deg)';
    const cur = () => { const v = parseFloat(String(inp.value).replace(',', '.')); return isFinite(v) && v >= 0 ? v : null; };
    const set = (v) => { inp.value = v == null ? '' : String(Math.round(v * 10) / 10); };
    set(WT[x.name]);
    const buzz = (p) => { try { if (ls('gsd.haptics') !== '0' && navigator.vibrate) navigator.vibrate(p); } catch (er) {} };
    L.querySelectorAll('.wt-pm').forEach((b) => b.addEventListener('click', () => { const v = cur(); set(Math.max(0, (v == null ? (sug ? sug[{ new: 0, back: 1, regular: 2 }[lv] || 0] : 0) : v + step * +b.dataset.d))); buzz(6); }));
    const sb = L.querySelector('.wt-sug'); if (sb) sb.addEventListener('click', () => {
      const v = sug[{ new: 0, back: 1, regular: 2 }[lv] || 0]; set(v); buzz(10);
      L.querySelector('.wt-why').textContent = 'For someone ' + (LVN[lv] || 'just starting') + ': start around ' + v + ' kg (' + sug[4] + '). Do one test set. If the last 2 reps feel easy, go up ' + step + ' kg. If your form slips, go down. Everyone’s different, so trust how it feels.';
    });
    const tb = L.querySelector('.wt-tip'); if (tb) tb.addEventListener('click', () => { set((cur() || 0) + 2.5); buzz([10, 40, 16]); tb.textContent = 'NICE. SAVE TO KEEP IT'; tb.disabled = true; this._wTip = true; });
    const close = () => { if (!this._wL) return; this._wL.remove(); this._wL = null; document.removeEventListener('keydown', onKey); };
    const onKey = (ev) => { if (ev.key === 'Escape') close(); if (ev.key === 'Enter') save(); };
    const save = () => {
      const v = cur(); if (v == null) delete WT[x.name]; else WT[x.name] = v;
      try { localStorage.setItem('gsd.weights', JSON.stringify(WT)); localStorage.setItem('gsd.seenWeightHint', '1');
        if (this._wTip && P && P.gym && P.gym[PLAN]) { P.gym[PLAN].tip = false; localStorage.setItem('gsd.progress', JSON.stringify(P)); } } catch (er) {}
      this._wTip = false; buzz(10); close(); this.setState({ wv: Date.now() });
    };
    document.addEventListener('keydown', onKey);
    L.querySelector('.wt-save').addEventListener('click', save); L.querySelector('.wt-x').addEventListener('click', close); L.querySelector('.wt-scrim').addEventListener('click', close);
    setTimeout(() => inp.focus(), 50);
  }
  renderVals() {
    if (!this._wk) { this._wk = 1; try { if (!localStorage.getItem('gsd.workout')) localStorage.setItem('gsd.workout', JSON.stringify({ type: 'gym', plan: 'LegDay', title: 'LEG DAY', page: 'LegDay' })); } catch (e) {} }
    const st = this.state || {};
    const ex = [
      { name: 'GOBLET SQUAT', meta: '16 kg · 3 × 10', bg: '#FFFFFF', rot: '-0.6deg', guide: 'GuideSquat.html?v=1793373502' },
      { name: 'ROMANIAN DEADLIFT', meta: '40 kg · 3 × 8', bg: '#FFFDF6', rot: '0.5deg' },
      { name: 'WALKING LUNGE', meta: '10 kg · 3 × 12', bg: '#FFFFFF', rot: '-0.4deg' },
      { name: 'LEG PRESS', meta: '80 kg · 3 × 10', bg: '#FFFDF6', rot: '0.6deg' },
      { name: 'CALF RAISE', meta: 'bodyweight · 3 × 15', bg: '#FFFFFF', rot: '-0.5deg' }
    ];
    const WT = (() => { try { return JSON.parse(localStorage.getItem('gsd.weights') || '{}'); } catch (e) { return {}; } })();
    let PRG = null; try { PRG = JSON.parse(localStorage.getItem('gsd.progress') || 'null'); } catch (e) {}
    const wTip = !!(PRG && PRG.gym && PRG.gym['leg'] && PRG.gym['leg'].tip);
    let firstW = true;
    ex.forEach((x) => { const m = x.meta.split(' · '); x.reps = m[1]; x.bw = m[0] === 'bodyweight'; const v = WT[x.name];
      x.hasW = v != null; x.first = !x.bw && firstW; if (!x.bw) firstW = false;
      x.meta = x.bw ? x.meta : (x.hasW ? v + ' kg' + (x.first && wTip ? ' ⬆' : '') + ' · ' + x.reps : '+ kg · ' + x.reps); });
    const done = st.done || ex.map(() => [false, false, false]);
    const total = ex.length * 3;
    const doneSets = done.reduce((n, r) => n + r.filter(Boolean).length, 0);
    const allDone = doneSets === total;
    const stage = st.stage || 'none';
    const count = st.count == null ? 7 : st.count;
    const current = done.findIndex((r) => !r.every(Boolean));
    const nextLabel = () => {
      const d = st.done || done;
      for (let e = 0; e < ex.length; e++) for (let k = 0; k < 3; k++) if (!d[e][k]) return ex[e].name.toLowerCase() + ', set ' + (k + 1);
      return 'all done!';
    };
    const toggle = (e, k) => {
      const cur = this.state || {};
      const nd = (cur.done || done).map((r) => r.slice());
      nd[e][k] = !nd[e][k]; try { localStorage.setItem('gsd.seenSetHint', '1'); localStorage.setItem('gsd.seenWeightHint', '1'); } catch (e) {}
      this.setState({ done: nd });
      if (nd[e][k]) {
        this.tap(12);
        const left = nd.reduce((n, r) => n + r.filter((x) => !x).length, 0);
        if (left > 0) this.startRest(90);
        else { this.stopRest(); this.setState({ rest: null }); }
      }
    };
    const collect = () => {
      const cur = this.state || {};
      if (cur.stage !== 'landed') return;
      this.tap(12);
      this.setState({ stage: 'fly' });
      this.later(() => this.setState({ stage: 'stored', count: ((this.state && this.state.count) == null ? 7 : this.state.count) + 1, bump: true }), 420);
      this.later(() => this.setState({ bump: false }), 620);
      this.later(() => { try { localStorage.setItem('gsd.pendingLog', JSON.stringify({ type: 'gym', plan: 'leg', title: 'LEG DAY', mins: 45, at: Date.now() })); localStorage.setItem('gsd.lastWorkout', JSON.stringify({ type: 'gym', title: 'LEG DAY', at: Date.now() })); localStorage.removeItem('gsd.workout'); localStorage.setItem('gsd.newStickers', String((+localStorage.getItem('gsd.newStickers') || 0) + 1)); } catch (e) {} const a = document.getElementById('gym-toHub'); if (a) a.click(); }, 1400);
    };
    const finish = () => {
      if ((this.state || {}).stage && (this.state || {}).stage !== 'none') return;
      this.tap(12);
      this.setState({ stage: 'drop' });
      this.later(() => this.setState({ stage: 'landed' }), 40);
    };
    const restOn = st.rest != null && !allDone;
    const fmt = (t) => Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0');
    const pct = restOn && st.restTotal ? (st.rest / st.restTotal) * 100 : 0;
    const transforms = { drop: 'scale(1.6) rotate(-22deg)', landed: 'scale(1) rotate(-6deg)', fly: 'translate(157px, -367px) scale(0.12) rotate(30deg)' };
    const transitions = { drop: 'none', landed: 'transform 0.3s cubic-bezier(.3,1.6,.5,1), opacity 0.15s ease', fly: 'transform 0.42s cubic-bezier(.55,0,.75,.35), opacity 0.42s ease-in' };
    const seenHint = (() => { try { return localStorage.getItem('gsd.seenSetHint') === '1'; } catch (e) { return false; } })();
    return {
      wHint: doneSets === 0 && !ex.some((x) => x.hasW) && (() => { try { return localStorage.getItem('gsd.seenWeightHint') !== '1'; } catch (e) { return false; } })(),
      setHint: !seenHint && doneSets === 0 && !(doneSets === 0 && !ex.some((x) => x.hasW) && (() => { try { return localStorage.getItem('gsd.seenWeightHint') !== '1'; } catch (e) { return false; } })()),
      count,
      bookTransform: st.bump ? 'scale(1.25)' : 'scale(1)',
      doneSets,
      rows: ex.map((x, e) => ({
        guide: x.guide || '#',
        name: x.name, meta: x.meta, bg: x.bg, rot: x.rot,
        editW: () => this.openW(e, x), wCls: x.bw ? 'w-bw' : x.hasW ? 'w-has' : 'w-none',
        wAria: x.bw ? x.name.toLowerCase() + ': bodyweight' : x.hasW ? x.name.toLowerCase() + ': ' + x.meta + '. Tap to change the weight' : x.name.toLowerCase() + ': add your weight',
        hl: e === current ? '#C6FF4D' : 'transparent',
        current: e === current,
        sets: [0, 1, 2].map((k) => ({
          toggle: () => toggle(e, k),
          pressed: done[e][k] ? 'true' : 'false',
          aria: x.name.toLowerCase() + ' set ' + (k + 1) + (done[e][k] ? ', done' : ''),
          fill: done[e][k] ? '#C6FF4D' : '#FFFFFF',
          rot: (k === 1 ? 6 : -5) + 'deg',
          mark: done[e][k] ? '✓' : String(k + 1)
        }))
      })),
      showRest: restOn,
      restTime: restOn ? (st.restOver ? 'GO!' : fmt(st.rest)) : '',
      restRing: st.restOver ? '#FF6FB0' : '#C6FF4D',
      restPct: pct.toFixed(1),
      restTitle: st.restOver ? 'BACK TO IT' : 'REST',
      restNext: 'next: ' + nextLabel() + ' · on your watch too',
      addRest: () => { const cur = this.state || {}; if (cur.restOver) return; this.setState({ rest: (cur.rest || 0) + 30, restTotal: (cur.restTotal || 90) + 30 }); },
      skipRest: () => { this.stopRest(); this.setState({ rest: null, restOver: false }); },
      skipLabel: st.restOver ? 'OK' : 'SKIP',
      skipAria: st.restOver ? 'Dismiss rest timer' : 'Skip rest',
      showFinish: stage === 'none' && !restOn,
      showIdleHint: !restOn && !allDone,
      finish,
      showSlap: stage === 'drop' || stage === 'landed' || stage === 'fly',
      slapTransform: transforms[stage] || 'none',
      slapOpacity: stage === 'drop' ? 0 : stage === 'fly' ? 0.2 : 1,
      slapTransition: transitions[stage] || 'none',
      collect,
      changeText: st.chArm && Date.now() - st.chArm < 3000 ? 'tap again to pick another' : '‹ change workout',
      changeW: () => { const cur = this.state || {};
        if (!cur.chArm || Date.now() - cur.chArm >= 3000) { this.tap(6); this.setState({ chArm: Date.now() }); this.later(() => this.setState({ chArm: 0 }), 3000); return; }
        try { localStorage.removeItem('gsd.workout'); } catch (e) {} const a = document.getElementById('gym-toHub'); if (a) a.click(); }
    };
  }
}
