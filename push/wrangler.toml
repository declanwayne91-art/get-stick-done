# Get St*ck Done! nudge worker. Deployed by .github/workflows/push-worker.yml (setup.mjs fills in the KV id).
name = "gsd-push"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

[triggers]
crons = ["*/15 * * * *"]

[[kv_namespaces]]
binding = "SUBS"
id = "__KV_ID__"

[[d1_databases]]
binding = "DB"
database_name = "gsd-friends"
database_id = "__D1_ID__"

# the usage dashboard key, as a SHA-256 hash (the key itself is only with Dex)
[vars]
STATS_HASH = "d4e62956a0bfac05acd28b53f538fb26e8044584fdb441f709e3cc1b6f615615"
