      hasMore: moreN > 0, moreText: 'show me ' + moreN + ' more', showMore: () => { s.pickShow = showN + 3; this.buzz(6); this.re(); },
      allShown: moreN <= 0 && showN > 3,
      shopSub: (left ? left + ' to get · from ' + meals + (meals === 1 ? ' meal' : ' meals') : 'all done'),
      toPlan: () => { s.view = 'plan'; this.re(); },
      ...(() => {   // pin "Go shopping" to My List (and so to Today); its OPEN LIST chip brings you back to this list
        let L = []; try { L = window.GST ? GST.load() : []; } catch (e) {}
        const on = L.some((t) => t.link === 'shop' && !t.done), ticked = !on && L.some((t) => t.link === 'shop' && t.done);
        return { shopPinned: on || ticked ? 'true' : 'false', pinBg: on || ticked ? '#F6EFE1' : '#C6FF4D', pinText: ticked ? 'GO SHOPPING: TICKED OFF ✓' : on ? 'GO SHOPPING IS ON TODAY ✓' : 'PIN “GO SHOPPING” TO TODAY',
          pinShop: () => { if (on || ticked || !window.GST) return; const L2 = GST.load(); L2.unshift(GST.make('Go shopping', { pin: true, link: 'shop' })); GST.save(L2); this.buzz([8, 30, 12]); this.re(); } }; })(),
      groups: sh.groups.map((gr) => ({ label: gr.a.toUpperCase(), items: gr.list.map((x) => ({
        text: x.unscaled ? x.g[2] : this.fq(x.g, x.total), days: x.days.join(' · '),
        checked: !!s.have[x.key], box: s.have[x.key] ? '#C6FF4D' : '#FFFFFF', tick: s.have[x.key] ? '✓' : '',
        strike: s.have[x.key] ? 'line-through' : 'none', op: s.have[x.key] ? 0.5 : 1,
        toggle: () => { s.have[x.key] = !s.have[x.key]; this.buzz(8);
          if (s.have[x.key]) this.shopDone(sh);
          this.re(); }
      })) })),
      hasX: s.extra.length > 0,
      xitems: s.extra.map((x) => ({ text: x.t, checked: !!x.have, box: x.have ? '#C6FF4D' : '#FFFFFF', tick: x.have ? '✓' : '', strike: x.have ? 'line-through' : 'none', op: x.have ? 0.5 : 1,
        toggle: () => { x.have = !x.have; this.saveX(); this.buzz(8); if (x.have) this.shopDone(sh); this.re(); },
        delAria: 'Take ' + x.t + ' off the list', del: () => { s.extra = s.extra.filter((y) => y !== x); this.saveX(); this.buzz(6); this.re(); } })),
      sorted: () => { s.extra = s.extra.filter((x) => !x.have); this.saveX(); s.view = 'plan'; this.re(); },
      hasCup: sh.cup.length > 0, cupText: sh.cup.join(', '),
      done: meals > 0 && left === 0
    };
  }
}
