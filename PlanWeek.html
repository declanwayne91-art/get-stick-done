<style>
body{margin:0}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;outline:none;padding:0}
button:focus-visible{box-shadow:0 0 0 3px #FF6FB0}
.title-die{filter:url(#tdie) drop-shadow(0 6px 6px rgba(60,40,20,0.3))}
.bri{font-family:'Bricolage Grotesque',sans-serif;font-stretch:75%;font-weight:800;line-height:0.9}
.kal{font-family:'Kalam',cursive;font-weight:700}
.press{transition:transform 0.09s ease-out}
.press:active{transform:scale(0.92)}
.dot{width:34px;height:34px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:17px;color:#172038;border:3px solid #FFFFFF;box-shadow:0 0 0 2px #172038}
.chip{padding:5px 10px;border-radius:999px;background:#C6FF4D;border:2px solid #172038;font-weight:700;font-size:13px;color:#172038;white-space:nowrap}
.box{width:24px;height:24px;flex-shrink:0;border:2.5px solid #172038;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#172038;font-weight:900}
.tom{position:relative;width:60px;height:54px;border-radius:48% 48% 46% 46%;border:3px solid #FFFFFF;box-shadow:0 0 0 2px #2A1A10;display:flex;align-items:center;justify-content:center}
@keyframes ring{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.ringing{animation:ring 0.4s ease-in-out infinite}
@keyframes peelclip{0%{clip-path:inset(-20px -20px -20px -20px)}100%{clip-path:inset(-20px 100% -20px -20px)}}
@keyframes peelflap{0%{left:146px;opacity:0;transform:scaleX(0.4)}12%{opacity:1}85%{opacity:1}100%{left:-14px;opacity:0;transform:scaleX(1.1)}}
.face{display:block}
.flap{position:absolute;top:-3px;width:22px;height:56px;border-radius:14px 4px 4px 14px;background:linear-gradient(90deg,#FFFFFF,#F1ECE3 55%,#CFC6B6);border:2px solid #111;box-shadow:-5px 4px 6px rgba(0,0,0,0.28);display:none;pointer-events:none}
.peeling .face{animation:peelclip 0.6s cubic-bezier(.4,0,.55,1) forwards}
.peeling .flap{display:block;animation:peelflap 0.6s cubic-bezier(.4,0,.55,1) forwards}
.peeling{pointer-events:none}
@keyframes nextpop{0%{transform:scale(1.7) rotate(-34deg);opacity:0}65%{transform:scale(0.94) rotate(-8deg);opacity:1}100%{transform:scale(1) rotate(-12deg);opacity:1}}
.nextpop{animation:nextpop 0.34s cubic-bezier(.3,1.5,.5,1) both}
@keyframes bob{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-4px) scale(1.02)}}
.nextpop svg{animation:bob 2.2s ease-in-out 0.4s infinite}
.peeling{transform:rotate(-12deg)}

@keyframes slapin{0%{transform:scale(1.7) rotate(-22deg);opacity:0}60%{transform:scale(0.92) rotate(-4deg);opacity:1}100%{transform:scale(1) rotate(-6deg);opacity:1}}
.slap{animation:slapin 0.32s cubic-bezier(.3,1.5,.5,1) both}
.pic svg{height:100%;max-height:100%;width:auto;max-width:100%}
.prepmid>*{flex-shrink:0}
</style>
<style>
.row{display:flex;align-items:center;gap:8px;height:68px}
.day{width:46px;flex-shrink:0;padding:6px 0;text-align:center;border-radius:10px;background:#172038;color:#C6FF4D;font-size:17px}
.slot{flex:1;min-width:0;height:64px;border-radius:14px;display:flex;align-items:center;gap:8px;padding:0 8px 0 4px;box-sizing:border-box}
.mini{width:26px;height:26px;border-radius:999px;border:2px solid #172038;background:#FFFFFF;color:#172038;font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center}
.tab{flex:1;height:40px;border-radius:12px;border:2.5px solid #172038;font-size:17px;color:#172038}
.item{width:100%;display:flex;align-items:center;gap:10px;padding:5px 0;border:none;border-bottom:1.5px solid #E9D9C0;background:transparent;text-align:left}
.aisle{margin:12px 0 2px;font-size:14px;letter-spacing:1px;color:#FF6FB0}
@keyframes sheetup{from{transform:translateY(100%)}to{transform:none}}
.sheet{animation:sheetup 0.22s cubic-bezier(.2,.9,.3,1) both}
@keyframes toastin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.toast{animation:toastin 0.25s ease-out both}
.cookgo{background:#172038 !important;color:#C6FF4D !important;text-decoration:none;padding:0 8px !important}
.cooksoon{border-style:dashed !important;opacity:0.5;font-size:11px !important;white-space:nowrap}
.pill{flex-shrink:0;height:24px;padding:0 5px;border-radius:999px;border:2px solid #172038;background:#FFFFFF;color:#172038;font-size:13px;display:flex;align-items:center;gap:3px}
.lbadge{position:absolute;right:-12px;top:-14px;font-size:13px;line-height:1;padding:2px 3px;background:#FFFFFF;border:2px solid #172038;border-radius:8px;transform:rotate(10deg)}
.dchip{width:44px;height:40px;border-radius:12px;border:2.5px solid #172038;font-size:15px;color:#172038;display:flex;align-items:center;justify-content:center}
.qrow{display:flex;flex-direction:column;gap:6px}
.qlabel{font-size:16px;font-weight:700}
.qlabel b{font-weight:400;opacity:0.7}
</style>

="0 0 24 24" aria-hidden="true"><path d="M4 5 Q8 4 12 6 Q16 4 20 5 V19 Q16 18 12 20 Q8 18 4 19 Z M12 6 V20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"></path></svg><span>BOOK</span></a><a class="dcnav" href="Profile.html" aria-label="Me"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="9" r="4" fill="none" stroke="currentColor" stroke-width="2.4"></circle><path d="M4 21 Q12 12 20 21" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"></path></svg><span>ME</span></a></nav></div></div>
<script type="text/x-dc-template" id="dc-tpl">
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background-color: #FBF4E6; background-image: linear-gradient(rgba(139,94,52,0.08) 1px, transparent 1px), linear-gradient(90deg, rgba(139,94,52,0.08) 1px, transparent 1px); background-size: 20px 20px; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; color: #172038">
<svg aria-hidden="true" width="0" height="0" style="position: absolute; width: 0; height: 0; overflow: hidden"><defs><filter id="tdie" x="-30%" y="-60%" width="160%" height="220%" color-interpolation-filters="sRGB"><feMorphology in="SourceAlpha" operator="dilate" radius="5" result="grow"></feMorphology><feGaussianBlur in="grow" stdDeviation="2.5" result="soft"></feGaussianBlur><feComponentTransfer in="soft" result="white-mask"><feFuncA type="linear" slope="10" intercept="-4"></feFuncA></feComponentTransfer><feMorphology in="white-mask" operator="dilate" radius="3" result="key-grow"></feMorphology><feGaussianBlur in="key-grow" stdDeviation="1" result="key-soft"></feGaussianBlur><feComponentTransfer in="key-soft" result="key-mask"><feFuncA type="linear" slope="10" intercept="-4"></feFuncA></feComponentTransfer><feFlood flood-color="#111111"></feFlood><feComposite in2="key-mask" operator="in" result="key"></feComposite><feFlood flood-color="#FFFFFF"></feFlood><feComposite in2="white-mask" operator="in" result="white"></feComposite><feMerge><feMergeNode in="key"></feMergeNode><feMergeNode in="white"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge></filter></defs></svg>

<sc-if value="{{isPlan}}" hint-placeholder-val="{{ true }}">
  <div style="position: absolute; left: 16px; right: 16px; top: 18px; bottom: 16px; display: flex; flex-direction: column; gap: 6px">
    <span class="title-die bri" style="font-size: 40px; text-shadow: 3px 3px 0 #FF6FB0; transform: rotate(-2deg); transform-origin: left; white-space: nowrap">PLAN MY WEEK</span>
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 2px 0 6px">
      <span class="kal" style="font-size: 15px; line-height: 1.15">{{planSub}}</span>
      <button type="button" class="press bri" onClick="{{openAuto}}" style="flex-shrink: 0; padding: 8px 12px; border-radius: 14px; border: 3px solid #FFFFFF; background: #FF6FB0; color: #172038; font-size: 17px; box-shadow: 0 0 0 2px #172038, 3px 4px 0 2px #C6FF4D; transform: rotate(2deg); white-space: nowrap">🎲 CHOOSE FOR ME</button>
    </div>
    <sc-if value="{{useOn}}" hint-placeholder-val="{{ false }}"><div style="display: flex; align-items: center; gap: 8px; margin: -2px 0 4px; padding: 6px 6px 6px 12px; border-radius: 12px; background: #FFD23F; border: 2.5px solid #172038">
      <span class="bri" style="font-size: 13px; letter-spacing: 0.5px; flex: 1">{{useText}}</span>
      <button type="button" class="press" onClick="{{clearUse}}" aria-label="Stop using this up" style="width: 28px; height: 28px; border-radius: 28px; border: 2px solid #172038; background: #FFFFFF; font-size: 15px; color: #172038">×</button></div></sc-if>
    <sc-if value="{{showToast}}" hint-placeholder-val="{{ false }}"><span class="kal toast" style="position: absolute; left: 50%; margin-left: -150px; width: 300px; bottom: 96px; z-index: 4; text-align: center; padding: 6px 12px; background: #172038; color: #C6FF4D; border-radius: 999px; font-size: 15px">{{toast}}</span></sc-if>
    <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
      <div class="row">
        <span style="position: relative; flex-shrink: 0"><span class="day bri" style="display: block; transform: rotate({{d.rot}})">{{d.label}}</span><sc-if value="{{d.lunchFrom}}" hint-placeholder-val="{{ false }}"><span class="lbadge" role="img" aria-label="{{d.lunchAria}}">🍱</span></sc-if></span>
        <sc-if value="{{d.filled}}" hint-placeholder-val="{{ true }}">
          <div class="slot" style="background: #FFFFFF; box-shadow: 0 5px 8px -5px rgba(60,40,20,0.45)">
            <button type="button" class="press" onClick="{{d.pick}}" aria-label="{{d.aria}}" style="flex-shrink: 0; border: none; background: transparent; padding: 0"><img src="{{d.img}}" alt="" width="58" height="47" style="display: block"></button>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
              <button type="button" onClick="{{d.pick}}" tabindex="-1" class="bri" style="border: none; background: transparent; text-align: left; color: #172038; font-size: 16px; line-height: 0.95; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical">{{d.name}}</button>
              <span style="display: flex; gap: 4px; align-items: center">
                <span style="width: 9px; height: 9px; flex-shrink: 0; border-radius: 9px; background: {{d.moodCol}}; border: 1.5px solid #172038"></span><span style="font-size: 12px; font-weight: 700; white-space: nowrap">{{d.meta}}</span>
                <button type="button" class="pill press bri" onClick="{{d.cycle}}" aria-label="{{d.servesAria}}">×{{d.serves}}</button>
                <sc-if value="{{d.kidsShow}}" hint-placeholder-val="{{ false }}"><button type="button" class="pill press bri" onClick="{{d.kidsTap}}" aria-pressed="{{d.kidsOn}}" aria-label="{{d.kidsAria}}" style="background: {{d.kidsBg}}; border-style: {{d.kidsBs}}">🧸</button></sc-if>
                <button type="button" class="pill press bri" onClick="{{d.lunch}}" aria-pressed="{{d.lunchOn}}" aria-label="{{d.lunchAria2}}" style="background: {{d.lunchBg}}; border-style: {{d.lunchBs}}; opacity: {{d.lunchOp}}">🍱{{d.lunchText}}</button>
                <sc-if value="{{d.hasCook}}" hint-placeholder-val="{{ false }}"><a class="pill press bri cookgo" href="{{d.cookHref}}" aria-label="{{d.cookAria}}">COOK →</a></sc-if>
                <sc-if value="{{d.noCook}}" hint-placeholder-val="{{ false }}"><span class="pill kal cooksoon" title="Cooking mode for this one is coming soon" aria-label="Cooking mode coming soon">soon</span></sc-if>
              </span>
            </span>
            <button type="button" class="mini press" onClick="{{d.reroll}}" aria-label="Swap for another meal like this" style="flex-shrink: 0; background: #C6FF4D; font-size: 16px">↻</button>
            <button type="button" class="press" onClick="{{d.clear}}" aria-label="Remove this meal" style="flex-shrink: 0; border: none; background: transparent; color: #172038; font-size: 18px; font-weight: 900; padding: 0 2px">×</button>
          </div>
        </sc-if>
        <sc-if value="{{d.empty}}" hint-placeholder-val="{{ false }}">
          <button type="button" class="slot press kal" onClick="{{d.pick}}" aria-label="{{d.aria}}" style="border: 2.5px dashed #FF6FB0; background: rgba(255,255,255,0.5); color: #172038; font-size: 16px; justify-content: center">+ add a meal</button>
        </sc-if>
      </div>
    </sc-for>
    <button type="button" class="press bri" onClick="{{toShop}}" style="margin-top: auto; height: 62px; border-radius: 18px; border: 3px solid #172038; background: #C6FF4D; color: #172038; font-size: 23px; box-shadow: 4px 4px 0 #172038">{{shopBtn}}</button>
  </div>
</sc-if>

<sc-if value="{{isPick}}" hint-placeholder-val="{{ false }}">
  <div style="position: absolute; inset: 0; background: rgba(23,32,56,0.45)"></div>
  <div class="sheet" style="position: absolute; left: 0; right: 0; top: 120px; bottom: 0; background: #FBF4E6; border-radius: 26px 26px 0 0; border-top: 3px solid #172038; padding: 16px 16px 12px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <span class="bri" style="font-size: 28px">{{pickTitle}}</span>
      <button type="button" class="mini press" onClick="{{closePick}}" aria-label="Close" style="width: 34px; height: 34px; font-size: 20px">×</button>
    </div>
    <div style="display: flex; gap: 8px">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3"><button type="button" class="tab bri press" onClick="{{t.go}}" aria-pressed="{{t.on}}" style="background: {{t.bg}}; transform: rotate({{t.rot}})">{{t.label}}</button></sc-for>
    </div>
    <div style="flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 4px 2px">
      <sc-for list="{{choices}}" as="c" hint-placeholder-count="5">
        <button type="button" class="press" onClick="{{c.choose}}" aria-label="{{c.aria}}" style="display: flex; align-items: center; gap: 10px; padding: 6px 10px 6px 4px; border: none; border-radius: 14px; background: #FFFFFF; box-shadow: 0 5px 8px -5px rgba(60,40,20,0.45); text-align: left; color: #172038">
          <img src="{{c.img}}" alt="" width="74" height="60" style="flex-shrink: 0">
          <span style="display: flex; flex-direction: column; gap: 4px"><span class="bri" style="font-size: 19px; line-height: 0.95">{{c.name}}</span><span style="font-size: 13px; font-weight: 700">{{c.meta}}</span></span>
        </button>
      </sc-for>
      <sc-if value="{{hasMore}}" hint-placeholder-val="{{ true }}"><button type="button" class="press bri" onClick="{{showMore}}" style="align-self: center; margin-top: 4px; height: 44px; padding: 0 20px; border-radius: 999px; border: 2.5px dashed #172038; background: #FFFFFF; color: #172038; font-size: 15px">{{moreText}}</button></sc-if>
      <sc-if value="{{allShown}}" hint-placeholder-val="{{ false }}"><span class="kal" style="align-self: center; font-size: 14px; opacity: 0.6; margin-top: 4px">that’s everything for now</span></sc-if>
    </div>
  </div>
</sc-if>

<sc-if value="{{isAuto}}" hint-placeholder-val="{{ false }}">
  <div style="position: absolute; inset: 0; background: rgba(23,32,56,0.45)"></div>
  <div class="sheet" style="position: absolute; left: 0; right: 0; top: 110px; bottom: 0; background: #FBF4E6; border-radius: 26px 26px 0 0; border-top: 3px solid #172038; padding: 16px 16px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <span class="title-die bri" style="font-size: 32px; text-shadow: 3px 3px 0 #FF6FB0; transform: rotate(-2deg); transform-origin: left; white-space: nowrap">CHOOSE FOR ME</span>
      <button type="button" class="mini press" onClick="{{closeAuto}}" aria-label="Close" style="width: 34px; height: 34px; font-size: 20px">×</button>
    </div>
    <span class="kal" style="font-size: 16px; line-height: 1.2; margin-top: -6px">Tap the nights you’re cooking. Everything else is optional.</span>
    <sc-for list="{{qrows}}" as="q" hint-placeholder-count="4">
      <div class="qrow">
        <span class="qlabel">{{q.label}} <b>{{q.hint}}</b></span>
        <div style="display: flex; justify-content: space-between">
          <sc-for list="{{q.chips}}" as="c" hint-placeholder-count="7"><button type="button" class="dchip bri press" onClick="{{c.tap}}" aria-pressed="{{c.on}}" aria-label="{{c.aria}}" style="background: {{c.bg}}; color: {{c.fg}}; opacity: {{c.op}}; border-style: {{c.bs}}">{{c.text}}</button></sc-for>
        </div>
      </div>
    </sc-for>
    <span class="kal" style="font-size: 14px; opacity: 0.75; margin-top: -4px">{{autoNote}}</span>
    <button type="button" class="press bri" onClick="{{autoGo}}" style="margin-top: auto; height: 62px; border-radius: 18px; border: 3px solid #172038; background: #C6FF4D; color: #172038; font-size: 24px; box-shadow: 4px 4px 0 #172038">{{autoBtn}}</button>
  </div>
</sc-if>

<sc-if value="{{isShop}}" hint-placeholder-val="{{ false }}">
  <div style="position: absolute; left: 16px; right: 16px; top: 18px; bottom: 16px; display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <span class="title-die bri" style="font-size: 34px; text-shadow: 3px 3px 0 #FF6FB0; transform: rotate(-2deg); transform-origin: left; white-space: nowrap">SHOPPING LIST</span>
      <button type="button" class="press kal" onClick="{{toPlan}}" style="padding: 4px 12px; border-radius: 999px; border: 2.5px solid #172038; background: #FFFFFF; color: #172038; font-size: 15px; white-space: nowrap">← plan</button>
    </div>
    <span class="kal" style="font-size: 16px">{{shopSub}}</span>
    <div style="flex: 1; min-height: 0; overflow-y: auto; background: #FFFFFF; padding: 0 14px 10px 46px; box-shadow: 0 6px 10px -6px rgba(60,40,20,0.4); background-image: linear-gradient(90deg, transparent 32px, #F4A9A0 32px, #F4A9A0 34px, transparent 34px)">
      <sc-for list="{{groups}}" as="gr" hint-placeholder-count="5">
        <div class="aisle bri">{{gr.label}}</div>
        <sc-for list="{{gr.items}}" as="it" hint-placeholder-count="4">
          <button type="button" class="item" onClick="{{it.toggle}}" role="checkbox" aria-checked="{{it.checked}}">

      days,
      shopBtn: meals ? 'MAKE MY SHOPPING LIST →' : 'PICK A MEAL FIRST',
      toShop: () => { if (!meals) return; s.view = 'shop'; this.buzz(12); this.re(); },
      pickTitle: 'Pick for ' + ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'][s.pickDay],
      closePick: () => { s.view = 'plan'; this.re(); },
      tabs: this.MOODS.map((m, n) => ({ label: m[1], on: s.mood === m[0], bg: s.mood === m[0] ? m[2] : '#FFFFFF', rot: (n - 1) * 1.5 + 'deg', go: () => { s.mood = m[0]; s.pickShow = 3; this.re(); } })),
      choices,
      hasMore: moreN > 0, moreText: 'show me ' + moreN + ' more', showMore: () => { s.pickShow = showN + 3; this.buzz(6); this.re(); },
      allShown: moreN <= 0 && showN > 3,
      shopSub: (left ? left + ' to get · from ' + meals + (meals === 1 ? ' meal' : ' meals') : 'all done'),
      toPlan: () => { s.view = 'plan'; this.re(); },
      groups: sh.groups.map((gr) => ({ label: gr.a.toUpperCase(), items: gr.list.map((x) => ({
        text: x.unscaled ? x.g[2] : this.fq(x.g, x.total), days: x.days.join(' · '),
        checked: !!s.have[x.key], box: s.have[x.key] ? '#C6FF4D' : '#FFFFFF', tick: s.have[x.key] ? '✓' : '',
        strike: s.have[x.key] ? 'line-through' : 'none', op: s.have[x.key] ? 0.5 : 1,
        toggle: () => { s.have[x.key] = !s.have[x.key]; this.buzz(8); this.re(); }
      })) })),
      hasCup: sh.cup.length > 0, cupText: sh.cup.join(', '),
      done: meals > 0 && left === 0
    };
  }
}
