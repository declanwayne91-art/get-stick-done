    const paintDrops = () => { root.querySelectorAll('.hm-drop').forEach((d, i) => d.classList.toggle('on', i < glasses)); $('hm-glass').textContent = glasses >= GOAL ? 'GOAL HIT' : '+1 GLASS'; $('hm-glassN').textContent = glasses + ' of ' + GOAL; };
    $('hm-glass').addEventListener('click', () => { if (glasses >= GOAL) return; glasses++; paintDrops(); buzz(8); addXP(5); pop(root.querySelectorAll('.hm-drop')[glasses - 1]); if (glasses === GOAL) { buzz([10, 40, 14]); earned(); } });

    // tonight: planned -> cook it; nothing planned -> choose a mood and it picks
    let tonight = ls('gsd.tonight', '') || 'harissa-chicken-orzo', last = null;   // picked on "What have you got?" (board 65) lands here
    if (!RECIPES.some((x) => x.id === tonight)) tonight = 'harissa-chicken-orzo';
    const paintTonight = () => {
      const r = RECIPES.find((x) => x.id === tonight), has = !!r;
      $('hm-planned').style.display = has ? 'flex' : 'none'; $('hm-none').style.display = has ? 'none' : 'flex';
      if (has) { $('hm-tImg').src = IMG[r.dish]; $('hm-tName').textContent = r.name; $('hm-tMin').textContent = r.min + ' min'; $('hm-cook').setAttribute('href', r.board); }
    };
    root.querySelectorAll('[data-mood]').forEach((b) => b.addEventListener('click', () => {
      const pool = RECIPES.filter((x) => x.mood === b.dataset.mood && x.id !== last); const r = pool[Math.floor(Math.random() * pool.length)];
      tonight = r.id; last = r.id; paintTonight(); buzz([6, 30, 10]); pop($('hm-tImg'));
    }));
    $('hm-swap').addEventListener('click', () => { last = tonight; tonight = null; paintTonight(); buzz(5); });

    // one thing: tuck the rest away and show only what's next
    const one = $('hm-one');
    one.addEventListener('click', () => { const on = root.classList.toggle('hm-onething'); one.setAttribute('aria-pressed', on ? 'true' : 'false'); one.textContent = on ? 'show everything' : 'just one thing'; buzz(6); });

    paintWait(); paintDrops(); paintTonight(); paintXP();
    return true;
  }
}
