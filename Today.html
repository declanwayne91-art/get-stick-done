      if (id2) { spot2.style.display = 'block'; ring(spot2, $(id2)); } else spot2.style.display = 'none';
      $('hm-tTitle').textContent = title; $('hm-tText').textContent = text;
      const rb = $('hm-tRows'); rb.innerHTML = ''; rb.style.display = rows ? 'flex' : 'none';
      (rows || []).forEach(([k, name, what]) => { const r = document.createElement('div'); r.className = 'hm-trow';
        r.innerHTML = '<span class="ic" style="background:' + NAVCOL[k] + ';color:#172038;box-shadow:0 0 0 2px #FFFFFF;transform:rotate(-4deg)">' + NAVICON[k] + '</span><span><b class="bri"></b> <span class="w"></span></span>';
        r.querySelector('b').textContent = name; r.querySelector('.w').textContent = what; rb.appendChild(r); });
      $('hm-tFoot').textContent = foot || ''; $('hm-tFoot').style.display = foot ? 'block' : 'none';
      tnext.textContent = ti === TOUR.length - 1 ? 'GOT IT' : 'NEXT →';
      $('hm-tDots').innerHTML = TOUR.map((x, k) => '<span class="' + (k === ti ? 'on' : '') + '"></span>').join('');
      const ch = tcard.offsetHeight, below = r.t + r.h + 22;
      tcard.style.top = (el ? (below + ch < 830 ? below : Math.max(12, r.t - ch - 22)) : Math.round(422 - ch / 2)) + 'px';
    };
    const openTour = () => { ti = 0; tour.style.display = 'block'; showStep(); buzz(6); tnext.focus(); };
    const closeTour = () => { tour.style.display = 'none'; spot2.style.display = 'none'; try { localStorage.setItem('gsd.seenTodayTips', '1'); } catch (e) {} $('hm-info').focus(); };
    tnext.addEventListener('click', () => { if (ti < TOUR.length - 1) { ti++; showStep(); buzz(4); } else closeTour(); });
    $('hm-tSkip').addEventListener('click', closeTour);
    $('hm-info').addEventListener('click', openTour);
    tour.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeTour(); });
    if (ls('gsd.seenTodayTips', '') !== '1') setTimeout(() => { if (!this.dead) openTour(); }, 700);

    paintWait(); paintDrops(); paintTonight(); paintXP();
    return true;
  }
}
