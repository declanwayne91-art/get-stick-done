<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Get St*ck Done!</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,500..800&amp;family=Kalam:wght@400;700&amp;family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;outline:none;padding:0}
button:focus-visible{box-shadow:0 0 0 3px #FF6FB0}
.title-die{filter:url(#tdie) drop-shadow(0 6px 6px rgba(60,40,20,0.3))}
.bri{font-family:'Bricolage Grotesque',sans-serif;font-stretch:75%;font-weight:800;line-height:0.9}
.kal{font-family:'Kalam',cursive;font-weight:700}
.press{transition:transform 0.09s ease-out}
.press:active{transform:scale(0.92)}
.dot{width:34px;height:34px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:17px;color:#172038;border:3px solid #FFFFFF;box-shadow:0 0 0 2px #172038}
.chip{padding:5px 10px;border-radius:999px;background:#C6FF4D;border:2px solid #172038;font-weight:700;font-size:13px;color:#172038;white-space:nowrap}
.box{width:24px;height:24px;flex-shrink:0;border:2.5px solid #172038;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#172038;font-weight:900}
.tom{position:relative;width:60px;height:54px;border-radius:48% 48% 46% 46%;border:3px solid #FFFFFF;box-shadow:0 0 0 2px #2A1A10;display:flex;align-items:center;justify-content:center}
@keyframes ring{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.ringing{animation:ring 0.4s ease-in-out infinite}
@keyframes peelclip{0%{clip-path:inset(-20px -20px -20px -20px)}100%{clip-path:inset(-20px 100% -20px -20px)}}
@keyframes peelflap{0%{left:146px;opacity:0;transform:scaleX(0.4)}12%{opacity:1}85%{opacity:1}100%{left:-14px;opacity:0;transform:scaleX(1.1)}}
.face{display:block}
.flap{position:absolute;top:-3px;width:22px;height:56px;border-radius:14px 4px 4px 14px;background:linear-gradient(90deg,#FFFFFF,#F1ECE3 55%,#CFC6B6);border:2px solid #111;box-shadow:-5px 4px 6px rgba(0,0,0,0.28);display:none;pointer-events:none}
.peeling .face{animation:peelclip 0.6s cubic-bezier(.4,0,.55,1) forwards}
.peeling .flap{display:block;animation:peelflap 0.6s cubic-bezier(.4,0,.55,1) forwards}
.peeling{pointer-events:none}
@keyframes nextpop{0%{transform:scale(1.7) rotate(-34deg);opacity:0}65%{transform:scale(0.94) rotate(-8deg);opacity:1}100%{transform:scale(1) rotate(-12deg);opacity:1}}
.nextpop{animation:nextpop 0.34s cubic-bezier(.3,1.5,.5,1) both}
@keyframes bob{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-4px) scale(1.02)}}
.nextpop svg{animation:bob 2.2s ease-in-out 0.4s infinite}
.peeling{transform:rotate(-12deg)}

@keyframes slapin{0%{transform:scale(1.7) rotate(-22deg);opacity:0}60%{transform:scale(0.92) rotate(-4deg);opacity:1}100%{transform:scale(1) rotate(-6deg);opacity:1}}
.slap{animation:slapin 0.32s cubic-bezier(.3,1.5,.5,1) both}
.pic svg{height:100%;max-height:100%;width:auto;max-width:100%}
.prepmid>*{flex-shrink:0}
</style>
<style>

#sp-root .bri{font-family:'Bricolage Grotesque',sans-serif;font-stretch:75%;font-weight:800;line-height:0.9}
#sp-root .tt{font-family:'Bricolage Grotesque',sans-serif;font-stretch:100%;font-weight:800;line-height:0.9;color:#C6FF4D;text-shadow:5px 4px 0 #111111}
#sp-root .kal{font-family:Kalam,cursive;font-weight:700}
#sp-root .stack{display:flex;flex-direction:column;align-items:flex-start}
#sp-root .word{display:inline-flex;align-items:flex-start}
#sp-stk{touch-action:none;cursor:grab;outline:none}
#sp-stk:focus-visible{outline:4px solid #6EC8FF;outline-offset:8px;border-radius:24px}
#sp-flap .tt{color:#F2ECE2;text-shadow:none}
#sp-flap svg use{stroke:#F2ECE2}
#sp-hint svg{animation:sphint 1.4s ease-in-out infinite}
@keyframes sphint{0%,100%{transform:translate(0,0)}50%{transform:translate(4px,-4px)}}
#sp-root .sp-demo button{border:1.5px solid rgba(246,239,225,0.5);background:transparent;color:#F6EFE1;font-family:Kalam,cursive;font-weight:700;font-size:13px;padding:3px 10px;border-radius:999px;opacity:0.7}
#sp-root .sp-demo button.on{background:#F6EFE1;color:#172038;opacity:1}
@media (prefers-reduced-motion: reduce){#sp-hint svg{animation:none}}
</style>
