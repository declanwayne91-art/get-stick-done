<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Get St*ck Done!</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,500..800&amp;family=Kalam:wght@400;700&amp;family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;outline:none;padding:0}
button:focus-visible{box-shadow:0 0 0 3px #FF6FB0}
.title-die{filter:url(#tdie) drop-shadow(0 6px 6px rgba(60,40,20,0.3))}
.bri{font-family:'Bricolage Grotesque',sans-serif;font-stretch:75%;font-weight:800;line-height:0.9}
.kal{font-family:'Kalam',cursive;font-weight:700}
.press{transition:transform 0.09s ease-out}
.press:active{transform:scale(0.92)}
.dot{width:34px;height:34px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:17px;color:#172038;border:3px solid #FFFFFF;box-shadow:0 0 0 2px #172038}
.chip{padding:5px 10px;border-radius:999px;background:#C6FF4D;border:2px solid #172038;font-weight:700;font-size:13px;color:#172038;white-space:nowrap}
.box{width:24px;height:24px;flex-shrink:0;border:2.5px solid #172038;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#172038;font-weight:900}
.tom{position:relative;width:60px;height:54px;border-radius:48% 48% 46% 46%;border:3px solid #FFFFFF;box-shadow:0 0 0 2px #2A1A10;display:flex;align-items:center;justify-content:center}
@keyframes ring{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.ringing{animation:ring 0.4s ease-in-out infinite}
@keyframes peelclip{0%{clip-path:inset(-20px -20px -20px -20px)}100%{clip-path:inset(-20px 100% -20px -20px)}}
@keyframes peelflap{0%{left:146px;opacity:0;transform:scaleX(0.4)}12%{opacity:1}85%{opacity:1}100%{left:-14px;opacity:0;transform:scaleX(1.1)}}
.face{display:block}
.flap{position:absolute;top:-3px;width:22px;height:56px;border-radius:14px 4px 4px 14px;background:linear-gradient(90deg,#FFFFFF,#F1ECE3 55%,#CFC6B6);border:2px solid #111;box-shadow:-5px 4px 6px rgba(0,0,0,0.28);display:none;pointer-events:none}
.peeling .face{animation:peelclip 0.6s cubic-bezier(.4,0,.55,1) forwards}
.peeling .flap{display:block;animation:peelflap 0.6s cubic-bezier(.4,0,.55,1) forwards}
.peeling{pointer-events:none}
@keyframes nextpop{0%{transform:scale(1.7) rotate(-34deg);opacity:0}65%{transform:scale(0.94) rotate(-8deg);opacity:1}100%{transform:scale(1) rotate(-12deg);opacity:1}}
.nextpop{animation:nextpop 0.34s cubic-bezier(.3,1.5,.5,1) both}
@keyframes bob{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-4px) scale(1.02)}}
.nextpop svg{animation:bob 2.2s ease-in-out 0.4s infinite}
.peeling{transform:rotate(-12deg)}

@keyframes slapin{0%{transform:scale(1.7) rotate(-22deg);opacity:0}60%{transform:scale(0.92) rotate(-4deg);opacity:1}100%{transform:scale(1) rotate(-6deg);opacity:1}}
.slap{animation:slapin 0.32s cubic-bezier(.3,1.5,.5,1) both}
.pic svg{height:100%;max-height:100%;width:auto;max-width:100%}
.prepmid>*{flex-shrink:0}
</style>
<style>

#sp-root .bri{font-family:'Bricolage Grotesque',sans-serif;font-stretch:75%;font-weight:800;line-height:0.9}
#sp-root .tt{font-family:'Bricolage Grotesque',sans-serif;font-stretch:100%;font-weight:800;line-height:0.9;color:#C6FF4D;text-shadow:5px 4px 0 #111111}
#sp-root .kal{font-family:Kalam,cursive;font-weight:700}
#sp-root .stack{display:flex;flex-direction:column;align-items:flex-start}
#sp-root .word{display:inline-flex;align-items:flex-start}
#sp-stk{touch-action:none;cursor:grab;outline:none}
#sp-stk:focus-visible{outline:4px solid #6EC8FF;outline-offset:8px;border-radius:24px}
#sp-flap .tt{color:#F2ECE2;text-shadow:none}
#sp-flap svg use{stroke:#F2ECE2}
#sp-hint svg{animation:sphint 1.4s ease-in-out infinite}
@keyframes sphint{0%,100%{transform:translate(0,0)}50%{transform:translate(4px,-4px)}}
#sp-root .sp-demo button{border:1.5px solid rgba(246,239,225,0.5);background:transparent;color:#F6EFE1;font-family:Kalam,cursive;font-weight:700;font-size:13px;padding:3px 10px;border-radius:999px;opacity:0.7}
#sp-root .sp-demo button.on{background:#F6EFE1;color:#172038;opacity:1}
@media (prefers-reduced-motion: reduce){#sp-hint svg{animation:none}}
</style>

    const buzz = (p) => { if (!haptics) return; try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} };
    const AUTO_GO = true;   // real app: true (a returning visit goes straight to Today). Design canvas: false, so the board never navigates without a tap.

    const who = () => { try { const pf = JSON.parse(ls('gsd.profile', 'null')); if (pf && pf.bookName) { const m = pf.bookName.match(/^(.*?)[’']s Sticker Book$/i); return m ? m[1] : 'friend'; } } catch (e) {} return null; };
    const stk = $('sp-stk'), faceEl = $('sp-face'), flap = $('sp-flap'), flapWrap = $('sp-flapWrap'), hint = $('sp-hint'), tapBtn = $('sp-tap'), tape = $('sp-tape'), sticky = $('sp-sticky');
    let name = who(), mode = 'intro', gone = false, touched = false;

    // ---- the title sticker's own frame: unrotated box W x H (plus the die-cut border), turned by ANG around its centre
    const W = 368, H = 232, DIAG = Math.hypot(W, H), DETACH = 0.5 * DIAG, FULL = 2.1 * DIAG;
    stk.style.left = Math.round((390 - W) / 2) + 'px';   // centred whatever the font's final width
    const C = [86, 215.8];   // bottom-left of DONE!: the corner you pull (measured when the title image was rendered)
    const REST = [C[0] + 16, C[1] - 14];
    const outline = [[0, 0], [W, 0], [W, H], [0, H]];
    const poly = (pts) => 'polygon(' + pts.map((p) => p[0].toFixed(1) + 'px ' + p[1].toFixed(1) + 'px').join(', ') + ')';
    { const a = ANG * Math.PI / 180, x = C[0] - W / 2, y = C[1] - H / 2, cx = parseFloat(stk.style.left) + W / 2, cy = parseFloat(stk.style.top) + H / 2;
      $('sp-hint').style.left = Math.max(12, cx + x * Math.cos(a) - y * Math.sin(a) - 40) + 'px'; $('sp-hint').style.top = (cy + x * Math.sin(a) + y * Math.cos(a) + 2) + 'px'; }

    const paint = () => {
      const back = !!name;
      $('sp-tapeT').textContent = back ? 'WELCOME BACK!' : 'LET’S GET STARTED!';
      $('sp-tapeT').style.color = back ? '#FF6FB0' : '#C6FF4D';
      stk.setAttribute('aria-label', back ? 'Welcome back! Tap to go in.' : 'Get St*ck Done! Let’s get started: peel the title sticker from its bottom-left corner, or tap it to start.');
      tapBtn.style.display = back ? 'none' : 'block';
      $('sp-skip').style.display = back ? 'block' : 'none';
      $('sp-demoFirst').classList.toggle('on', !back); $('sp-demoBack').classList.toggle('on', back);
    };

    // ---- peel: fold line = perpendicular bisector of corner->finger. Face keeps one side; the flap is the title's mirrored silhouette
    let curP = null;
    const setPeel = (P) => {
      curP = P;
      if (!P) { faceEl.style.clipPath = 'none'; flapWrap.style.display = 'none'; return; }
      const dx = C[0] - P[0], dy = C[1] - P[1], d = Math.hypot(dx, dy);
      if (d < 0.5) { faceEl.style.clipPath = 'none'; flapWrap.style.display = 'none'; return; }
      const n = [dx / d, dy / d], M = [(C[0] + P[0]) / 2, (C[1] + P[1]) / 2];
      const side = (p) => (p[0] - M[0]) * n[0] + (p[1] - M[1]) * n[1];
      const keep = [], cut = [];
      for (let i = 0; i < outline.length; i++) {
        const a = outline[i], b = outline[(i + 1) % outline.length], sa = side(a), sb = side(b);
        if (sa <= 0) keep.push(a); else cut.push(a);
        if ((sa <= 0) !== (sb <= 0)) { const t = sa / (sa - sb), q = [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]; keep.push(q); cut.push(q); }
      }
      faceEl.style.clipPath = keep.length > 2 ? poly(keep) : 'polygon(0 0, 0 0, 0 0)';
      if (cut.length < 3) { flapWrap.style.display = 'none'; return; }
      flapWrap.style.display = 'block';
      flap.style.clipPath = poly(cut);
      const k = 2 * (M[0] * n[0] + M[1] * n[1]);   // reflection across the fold line as a CSS matrix
      flap.style.transform = 'matrix(' + [1 - 2 * n[0] * n[0], -2 * n[0] * n[1], -2 * n[0] * n[1], 1 - 2 * n[1] * n[1], k * n[0], k * n[1]].map((v) => v.toFixed(4)).join(',') + ')';
      faceEl.style.opacity = d > DIAG * 1.9 ? 0 : 1;
    };
    const animate = (from, to, ms, ease, step, end) => { const t0 = performance.now(); const f = (t) => { if (this.dead) return; const raw = Math.min(1, (t - t0) / ms); step(from.map((v, i) => v + (to[i] - v) * ease(raw))); if (raw < 1) this.raf = requestAnimationFrame(f); else end && end(); }; this.raf = requestAnimationFrame(f); };
    const out = (u) => 1 - Math.pow(1 - u, 3);
    const spring = (u) => { const c = 1.70158 * 1.2; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); };

    // ---- slap: a hard drop from above the glass, a squash on impact, a settle, a tiny screen shake and one haptic thump
    const slap = (el, ang, delay, thump) => {
      if (reduce || !el.animate) { el.style.opacity = 1; return; }
      el.animate([
        { transform: 'translateY(-70px) scale(1.55) rotate(' + (ang - 16) + 'deg)', opacity: 0 },
        { transform: 'translateY(-30px) scale(1.3) rotate(' + (ang - 9) + 'deg)', opacity: 1, offset: 0.35 },
        { transform: 'translateY(0) scale(0.93, 0.9) rotate(' + ang + 'deg)', offset: 0.62 },
        { transform: 'scale(1.03, 1.04) rotate(' + ang + 'deg)', offset: 0.8 },
        { transform: 'scale(1) rotate(' + ang + 'deg)', opacity: 1 }], { duration: 380, delay, easing: 'cubic-bezier(.55,0,.9,.45)', fill: 'backwards' });
      later(() => { buzz(thump); if (root.animate) root.animate([{ transform: 'translate(0,0)' }, { transform: 'translate(2px,5px)' }, { transform: 'translate(-2px,-2px)' }, { transform: 'none' }], { duration: 150 }); puff(el); }, delay + 235);
    };
    const puff = (el) => {   // little impact ticks around the edges
      const r = el.getBoundingClientRect(), rr = root.getBoundingClientRect(), k = rr.width / 390;
      const cx = (r.left + r.width / 2 - rr.left) / k, cy = (r.top + r.height / 2 - rr.top) / k, w = r.width / k / 2 + 6, h = r.height / k / 2 + 2;
      [[-1, -0.6, 205], [-1, 0.5, 160], [1, -0.5, -25], [1, 0.6, 20], [-0.4, 1, 120], [0.5, -1, -70]].forEach(([sx, sy, a]) => {
        const s = document.createElement('span'); s.setAttribute('aria-hidden', 'true');
        s.style.cssText = 'position:absolute;left:' + (cx + sx * w).toFixed(0) + 'px;top:' + (cy + sy * h).toFixed(0) + 'px;width:16px;height:4px;border-radius:4px;background:#F6EFE1;transform-origin:0 50%;transform:rotate(' + a + 'deg) scaleX(0.2);opacity:0.9;pointer-events:none;z-index:4;transition:transform 0.22s ease-out,opacity 0.25s ease 0.12s';
        root.appendChild(s); requestAnimationFrame(() => { s.style.transform = 'rotate(' + a + 'deg) translateX(10px) scaleX(1)'; s.style.opacity = 0; }); later(() => s.remove(), 500); });
    };

    // ---- leaving: peeled title floats away, a little burst, then on through an ordinary link
    const go = () => {
      if (gone) return; gone = true; mode = 'gone';
      root.style.transition = 'opacity 0.2s ease'; root.style.opacity = 0;
      later(() => { const a = $(name ? 'sp-toToday' : 'sp-toOnboard'); if (a) a.click(); }, 200);
      later(() => { if (!this.dead) { touched = false; paint(); intro(); } }, 900);   // still here (the canvas)? reset so it can be played again
    };
    const leaveOrWait = () => { if (!name || touched || AUTO_GO) go(); else mode = 'waiting'; };
    const flyAway = () => {
      hint.style.opacity = 0; buzz(10);   // stays peeled: you're holding it backing-side up as it goes
      if (reduce) { stk.style.opacity = 0; later(leaveOrWait, 150); return; }
      stk.style.transition = name ? 'transform 0.6s cubic-bezier(.4,0,.8,.6), opacity 0.4s ease 0.25s' : 'transform 0.45s cubic-bezier(.4,0,.8,.6), opacity 0.3s ease 0.2s';
      stk.style.transform = 'translate(40px, -620px) rotate(' + (ANG - 22) + 'deg) scale(0.9)'; stk.style.opacity = 0;
      burst(); later(leaveOrWait, name ? 560 : 480);
    };
    const finish = (P) => {
      mode = 'releasing'; buzz([6, 30, 10]);
      const dx = P[0] - C[0], dy = P[1] - C[1], d = Math.hypot(dx, dy) || 1;
      animate(P, [C[0] + dx / d * FULL, C[1] + dy / d * FULL], reduce ? 1 : (name ? 380 : 230), (u) => u * u, setPeel, flyAway);
    };
    const autoPeel = (ms) => {
      if (mode !== 'ready' && mode !== 'intro') return; mode = 'auto'; hint.style.opacity = 0;
      if (reduce) { flyAway(); return; }
      const end = [C[0] + DETACH * 0.8, C[1] - DETACH * 0.62];
      animate(curP || REST, end, ms || 360, out, setPeel, () => finish(end));
    };
    const burst = () => {
      const cols = ['#FF6FB0', '#C6FF4D', '#6EC8FF', '#FFD23F', '#A98BFF'], x = 195, y = 240;
      for (let i = 0; i < 12; i++) { const s = document.createElement('span'), a = (i / 12) * Math.PI * 2, r = 110 + Math.random() * 50;
        s.textContent = i % 3 === 0 ? '✦' : '●'; s.setAttribute('aria-hidden', 'true');
        s.style.cssText = 'position:absolute;left:' + x + 'px;top:' + y + 'px;color:' + cols[i % 5] + ';font-size:' + (i % 3 === 0 ? 24 : 13) + 'px;z-index:6;pointer-events:none;transition:transform 0.55s cubic-bezier(.2,.9,.3,1), opacity 0.5s ease 0.25s';
        root.appendChild(s); requestAnimationFrame(() => { s.style.transform = 'translate(' + (Math.cos(a) * r).toFixed(0) + 'px,' + (Math.sin(a) * r).toFixed(0) + 'px)'; s.style.opacity = 0; }); later(() => s.remove(), 900); }
    };

    // ---- intro (under a second): title slapped down, then St*cky slapped above it, then the tape and the lifted corner
    const intro = () => {
      gone = false; mode = 'intro'; root.style.transition = 'none'; root.style.opacity = 1;
      stk.style.transition = 'none'; stk.style.transform = 'rotate(' + ANG + 'deg)'; stk.style.opacity = 1; hint.style.opacity = 0; setPeel(null); faceEl.style.opacity = 1;
      tape.style.opacity = 0; tape.style.transform = 'rotate(-3deg) translateY(10px)';
      slap(stk, ANG, 60, 22); slap(sticky, SANG, 460, 12);
      later(() => { tape.style.transition = reduce ? 'none' : 'opacity 0.2s ease, transform 0.25s cubic-bezier(.3,1.4,.5,1)'; tape.style.opacity = 1; tape.style.transform = 'rotate(-3deg)'; }, reduce ? 0 : 780);
      if (name) later(() => autoPeel(820), reduce ? 1100 : 1700);
      else later(() => { mode = 'ready'; animate([C[0], C[1]], REST, reduce ? 1 : 260, spring, setPeel); hint.style.opacity = 1; }, reduce ? 0 : 900);
    };

    // ---- pointer: board coords -> the title's own (unrotated) frame
    const toStk = (e) => {
      const rr = root.getBoundingClientRect(), k = rr.width / 390, bx = (e.clientX - rr.left) / k, by = (e.clientY - rr.top) / k;
      const cx = parseFloat(stk.style.left) + W / 2, cy = parseFloat(stk.style.top) + H / 2, a = -ANG * Math.PI / 180, x = bx - cx, y = by - cy;
      return [x * Math.cos(a) - y * Math.sin(a) + W / 2, x * Math.sin(a) + y * Math.cos(a) + H / 2];
    };
    let down = null;
    stk.addEventListener('pointerdown', (e) => {
      if (name) { if (mode === 'waiting') go(); else autoPeel(260); return; }
      if (mode !== 'ready') return;

      const L = toStk(e); down = { t: performance.now(), L, moved: false, ticks: 0 };
      if (Math.hypot(C[0] - L[0], C[1] - L[1]) < 80) { mode = 'peeling'; down.grab = [C[0] - L[0], C[1] - L[1]]; hint.style.opacity = 0; buzz(4); }
    });
    stk.addEventListener('pointermove', (e) => {

      if (Math.hypot(L[0] - down.L[0], L[1] - down.L[1]) > 6) down.moved = true;
      const P = [L[0] + down.grab[0], L[1] + down.grab[1]], d = Math.hypot(C[0] - P[0], C[1] - P[1]);
      const kk = Math.floor(d / 30); if (kk > down.ticks) { down.ticks = kk; buzz(4); }

      if (quick) { mode = 'ready'; autoPeel(); return; }

    };
    stk.addEventListener('pointerup', up); stk.addEventListener('pointercancel', up);
    stk.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (mode === 'waiting') go(); else autoPeel(); } });
    tapBtn.addEventListener('click', () => autoPeel());
    tape.addEventListener('click', () => { if (mode === 'waiting') go(); else autoPeel(name ? 260 : undefined); });   // the message sticker starts things too
    $('sp-skip').addEventListener('click', () => go());
    root.addEventListener('pointerdown', () => { touched = true; }, true);
    root.addEventListener('pointerdown', (e) => { if (name && mode !== 'gone' && !e.target.closest('.sp-demo') && !stk.contains(e.target)) go(); });

    // ---- demo switches (canvas only)
    const demo = (back) => { this.tm.forEach(clearTimeout); this.tm = []; cancelAnimationFrame(this.raf);
      if (back) { if (!who()) try { localStorage.setItem('gsd.profile', JSON.stringify({ bookName: 'Dex’s Sticker Book', demo: true })); } catch (e) {} name = who() || 'Dex'; }
      else { try { const pf = JSON.parse(ls('gsd.profile', 'null')); if (pf && pf.demo) localStorage.removeItem('gsd.profile'); } catch (e) {} name = null; }
      paint(); $('sp-hintT').textContent = 'peel me from the corner'; intro(); };
    ['sp-demoFirst', 'sp-demoBack'].forEach((id, i) => { $(id).addEventListener('pointerdown', (e) => e.stopPropagation()); $(id).addEventListener('click', (e) => { e.stopPropagation(); demo(i === 1); }); });
    paint(); intro();
    return true;
  }
}
