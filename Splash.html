    const burst = () => {
      const cols = ['#FF6FB0', '#C6FF4D', '#6EC8FF', '#FFD23F', '#A98BFF'], x = 195, y = 240;
      for (let i = 0; i < 12; i++) { const s = document.createElement('span'), a = (i / 12) * Math.PI * 2, r = 110 + Math.random() * 50;
        s.textContent = i % 3 === 0 ? '✦' : '●'; s.setAttribute('aria-hidden', 'true');
        s.style.cssText = 'position:absolute;left:' + x + 'px;top:' + y + 'px;color:' + cols[i % 5] + ';font-size:' + (i % 3 === 0 ? 24 : 13) + 'px;z-index:6;pointer-events:none;transition:transform 0.55s cubic-bezier(.2,.9,.3,1), opacity 0.5s ease 0.25s';
        root.appendChild(s); requestAnimationFrame(() => { s.style.transform = 'translate(' + (Math.cos(a) * r).toFixed(0) + 'px,' + (Math.sin(a) * r).toFixed(0) + 'px)'; s.style.opacity = 0; }); later(() => s.remove(), 900); }
    };

    // ---- intro (under a second): title slapped down, then St*cky slapped above it, then the tape and the lifted corner
    const intro = () => {
      gone = false; mode = 'intro'; root.style.transition = 'none'; root.style.opacity = 1;
      stk.style.transition = 'none'; stk.style.transform = 'rotate(' + ANG + 'deg)'; stk.style.opacity = 1; hint.style.opacity = 0; setPeel(null); faceEl.style.opacity = 1;
      tape.style.opacity = 0; tape.style.transform = 'rotate(-3deg) translateY(10px)';
      slap(stk, ANG, 60, 22); slap(sticky, SANG, 460, 12);
      later(() => { tape.style.transition = reduce ? 'none' : 'opacity 0.2s ease, transform 0.25s cubic-bezier(.3,1.4,.5,1)'; tape.style.opacity = 1; tape.style.transform = 'rotate(-3deg)'; }, reduce ? 0 : 780);
      if (name) later(() => autoPeel(820), reduce ? 1100 : 1700);
      else later(() => { mode = 'ready'; animate([C[0], C[1]], REST, reduce ? 1 : 260, spring, setPeel); hint.style.opacity = 1; }, reduce ? 0 : 900);
    };

    // ---- pointer: board coords -> the title's own (unrotated) frame
    const toStk = (e) => {
      const rr = root.getBoundingClientRect(), k = rr.width / 390, bx = (e.clientX - rr.left) / k, by = (e.clientY - rr.top) / k;
      const cx = parseFloat(stk.style.left) + W / 2, cy = parseFloat(stk.style.top) + H / 2, a = -ANG * Math.PI / 180, x = bx - cx, y = by - cy;
      return [x * Math.cos(a) - y * Math.sin(a) + W / 2, x * Math.sin(a) + y * Math.cos(a) + H / 2];
    };
    let down = null;
    stk.addEventListener('pointerdown', (e) => {
      if (name) { if (mode === 'waiting') go(); else autoPeel(260); return; }
      if (mode !== 'ready') return;
      e.preventDefault(); try { stk.setPointerCapture(e.pointerId); } catch (x) {}
      const L = toStk(e); down = { t: performance.now(), L, moved: false, ticks: 0 };
      if (Math.hypot(C[0] - L[0], C[1] - L[1]) < 80) { mode = 'peeling'; down.grab = [C[0] - L[0], C[1] - L[1]]; hint.style.opacity = 0; buzz(4); }
    });
    stk.addEventListener('pointermove', (e) => {
      if (!down || mode !== 'peeling') return; const L = toStk(e);
      if (Math.hypot(L[0] - down.L[0], L[1] - down.L[1]) > 6) down.moved = true;
      const P = [L[0] + down.grab[0], L[1] + down.grab[1]], d = Math.hypot(C[0] - P[0], C[1] - P[1]);
      const kk = Math.floor(d / 30); if (kk > down.ticks) { down.ticks = kk; buzz(4); }
      if (d >= DETACH) { down = null; finish(P); } else setPeel(P);
    });
    const up = () => {
      if (!down) return; const quick = !down.moved && performance.now() - down.t < 300, wasPeel = mode === 'peeling'; down = null;
      if (quick) { mode = 'ready'; autoPeel(); return; }
      if (wasPeel) { mode = 'ready'; animate(curP || REST, REST, reduce ? 1 : 220, spring, setPeel); buzz(5); hint.style.opacity = 1; $('sp-hintT').textContent = 'keep going, it’ll lift off'; }
    };
    stk.addEventListener('pointerup', up); stk.addEventListener('pointercancel', up);
    stk.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (mode === 'waiting') go(); else autoPeel(); } });
    tapBtn.addEventListener('click', () => autoPeel());
    tape.addEventListener('click', () => { if (mode === 'waiting') go(); else autoPeel(name ? 260 : undefined); });   // the message sticker starts things too
    $('sp-skip').addEventListener('click', () => go());
    root.addEventListener('pointerdown', () => { touched = true; }, true);
    root.addEventListener('pointerdown', (e) => { if (name && mode !== 'gone' && !e.target.closest('.sp-demo') && !stk.contains(e.target)) go(); });

    // ---- demo switches (canvas only)
    const demo = (back) => { this.tm.forEach(clearTimeout); this.tm = []; cancelAnimationFrame(this.raf);
      if (back) { if (!who()) try { localStorage.setItem('gsd.profile', JSON.stringify({ bookName: 'Dex’s Sticker Book', demo: true })); } catch (e) {} name = who() || 'Dex'; }
      else { try { const pf = JSON.parse(ls('gsd.profile', 'null')); if (pf && pf.demo) localStorage.removeItem('gsd.profile'); } catch (e) {} name = null; }
      paint(); $('sp-hintT').textContent = 'peel me from the corner'; intro(); };
    ['sp-demoFirst', 'sp-demoBack'].forEach((id, i) => { $(id).addEventListener('pointerdown', (e) => e.stopPropagation()); $(id).addEventListener('click', (e) => { e.stopPropagation(); demo(i === 1); }); });
    paint(); intro();
    return true;
  }
}
