        + '<span class="kal" style="font-size:15px;margin-top:-6px">A tap on your wrist when a cooking timer rings, gym rest is over, or you earn a sticker.</span>'

          + '<div style="display:flex;gap:10px">' + chip('pf-hOn', 'YES, NUDGE ME', pf.hydroPush === true, '#6EC8FF') + chip('pf-hOff', 'OFF', pf.hydroPush !== true, '#FF6FB0') + '</div>'
          + (pf.hydroPush === true ? '<button type="button" id="pf-hTest" class="kal" style="align-self:flex-start;border:none;background:transparent;padding:0;color:#172038;font-size:15px;text-decoration:underline">send me a test nudge</button>' : '') : '')
        + '<span class="kal" style="font-size:14px;opacity:0.8">' + (msg || (on && perm === 'denied' ? 'Notifications are switched off for this app. Allow them in your phone’s settings and the taps will come through.' : on ? 'On. It works through your phone’s notifications, so there’s nothing to install on the watch.' : 'It works through your phone’s notifications, so there’s nothing to install on the watch.')) + '</span>');
      const save = (v) => { pf.watch = v; try { localStorage.setItem('gsd.profile', JSON.stringify(pf)); } catch (e) {} };
      $('pf-wOn').addEventListener('click', () => { save(true); try { navigator.vibrate && navigator.vibrate(8); } catch (e) {}
        if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission().then(() => watchSheet()); else watchSheet(); });
      $('pf-wOff').addEventListener('click', () => { save(false); watchSheet(); });
      const hp = (v) => { pf.hydroPush = v; if (v && !pf.hydro) pf.hydro = { every: 2, goal: 6, dayStart: 8, dayEnd: 21 }; try { localStorage.setItem('gsd.profile', JSON.stringify(pf)); } catch (e) {} };
      if ($('pf-hOn')) $('pf-hOn').addEventListener('click', () => { hp(true); GSN.nudges(true).then((r) => { if (r !== 'on') hp(false); watchSheet(r === 'denied' ? 'Notifications are switched off for this app. Allow them in your phone’s settings, then try again.' : r === 'on' ? 'Done. Homie will nudge you ' + hyd() + '.' : 'That didn’t work just now. Check you’re online and try again.'); }); });
      if ($('pf-hOff')) $('pf-hOff').addEventListener('click', () => { hp(false); GSN.nudges(false).then(() => watchSheet('Homie’s nudges are off.')); });
      if ($('pf-hTest')) $('pf-hTest').addEventListener('click', () => { GSN.testNudge().then((ok) => watchSheet(ok ? 'Sent! It should arrive in a few seconds.' : 'Couldn’t send it. Try switching nudges off and on again.')); });
    };
    $('pf-watch').addEventListener('click', () => watchSheet());
    // ---- MY TODAY PAGE: open Today's EDIT, or change WHAT I'M HERE FOR (an area switched on comes back to Today; if its setup
    // questions were skipped, SET IT UP asks just those: Onboard#only=<area>)
    const HERE = [['gym', 'next', 'GET MOVING'], ['kitchen', 'tonight', 'MAKE PLANNING MEALS EASIER'], ['water', 'hydro', 'DRINK MORE WATER'], ['list', 'list', 'GET THINGS DONE']];
    const todaySheet = (fresh) => {
      const rd = (k, d) => { try { return JSON.parse(localStorage.getItem(k) || 'null') || d; } catch (e) { return d; } };
      const L = rd('gsd.today', null), I = rd('gsd.interests', {});
      const hid = L && Array.isArray(L.hidden) ? L.hidden : [], on = (a) => !hid.includes(a[1]);
      const asked = Array.isArray(I.asked) ? I.asked : ['gym', 'kitchen', 'water'];   // set up before this existed: everything was asked
      const chip = (a) => '<button type="button" class="press bri pf-here" data-a="' + a[0] + '" aria-pressed="' + on(a) + '" style="height:42px;padding:0 14px;border-radius:999px;border:2.5px solid #172038;background:' + (on(a) ? '#C6FF4D' : '#FFFFFF') + ';color:#172038;font-size:15px">' + (on(a) ? '✓ ' : '') + a[2] + '</button>';
      const need = fresh && fresh !== 'list' && !asked.includes(fresh) && HERE.some((a) => a[0] === fresh && on(a));
      open('<span class="bri" style="font-size:28px;text-shadow:3px 3px 0 #FFD23F;margin-top:8px">MY TODAY PAGE</span>'
        + '<span class="kal" style="font-size:15px;margin-top:-6px">Move, hide or add things back.</span>'
        + '<a href="Today.html?v=1793450435#edit" class="press bri" style="height:50px;border-radius:999px;border:3px solid #172038;background:#FFD23F;color:#172038;font-size:18px;display:flex;align-items:center;justify-content:center;text-decoration:none">EDIT TODAY →</a>'
        + '<span class="bri" style="font-size:22px;text-shadow:2px 2px 0 #C6FF4D;margin-top:6px">WHAT I’M HERE FOR</span>'
        + '<div style="display:flex;flex-wrap:wrap;gap:8px">' + HERE.map(chip).join('') + '</div>'
        + (need ? '<span class="kal" style="font-size:15px">A few quick questions so it fits you.</span><a href="Onboard.html?v=1793450435#only=' + fresh + '" class="press bri" style="align-self:flex-start;height:44px;padding:0 16px;border-radius:999px;border:2.5px solid #172038;background:#FF6FB0;color:#172038;font-size:16px;display:flex;align-items:center;text-decoration:none">SET IT UP →</a>' : ''));
      $('pf-sheetBody').querySelectorAll('.pf-here').forEach((b) => b.addEventListener('click', () => {
        const a = HERE.find((x) => x[0] === b.dataset.a), now = !on(a), M = L && Array.isArray(L.order) ? L : { order: ['next', 'tonight', 'hydro', 'week', 'list', 'goal'], hidden: [] };
        M.hidden = (M.hidden || []).filter((k) => k !== a[1]); M.order = (M.order || []).filter((k) => k !== a[1]);
        if (now) { const D = ['next', 'tonight', 'hydro', 'week', 'list', 'goal'], after = D.slice(D.indexOf(a[1]) + 1), at = M.order.findIndex((k) => after.includes(k)); M.order.splice(at < 0 ? M.order.length : at, 0, a[1]); } else M.hidden.push(a[1]);   // back in its usual place
        const J = rd('gsd.interests', {}); J[a[0]] = now;
        try { localStorage.setItem('gsd.today', JSON.stringify(M)); localStorage.setItem('gsd.interests', JSON.stringify(J)); } catch (e) {}
        buzz(6); todaySheet(now ? a[0] : null); }));
    };
    $('pf-today').addEventListener('click', () => todaySheet());
    // ---- START FRESH: wipe everything on this phone and go back to setup. Behind a sheet and a 2-second hold, so it can't happen by accident.
    const freshSheet = () => {
      open('<span class="bri" style="font-size:28px;text-shadow:3px 3px 0 #FF6FB0;margin-top:8px">START FRESH?</span>'
        + '<span class="kal" style="font-size:15px;margin-top:-6px">This wipes everything on this phone and takes you back to setup:</span>'
        + '<span class="kal" style="font-size:14px;line-height:1.35;padding-left:6px">✗ your sticker book, cover and every sticker<br>✗ levels, pins and XP<br>✗ meal plans, cook log and workouts<br>✗ water, chores and settings</span>'
        + '<span class="bri" style="font-size:15px;color:#E8442E">There’s no undo.</span>'
        + '<button type="button" id="pf-keep" class="press bri" style="height:50px;border-radius:999px;border:3px solid #172038;background:#C6FF4D;color:#172038;font-size:18px">KEEP MY STUFF</button>'
        + '<button type="button" id="pf-wipe" class="bri" aria-describedby="pf-wipeHint" style="position:relative;overflow:hidden;height:46px;border-radius:999px;border:2.5px solid #E8442E;background:#FFFFFF;color:#E8442E;font-size:16px;touch-action:none">'
        + '<span id="pf-wipeFill" style="position:absolute;left:0;top:0;bottom:0;width:0;background:#FF6FB0"></span><span id="pf-wipeTxt" style="position:relative">HOLD TO WIPE EVERYTHING</span></button>'
        + '<span id="pf-wipeHint" class="kal" style="font-size:13px;opacity:0.75;text-align:center;margin-top:-4px">press and hold for 2 seconds</span>');
      $('pf-keep').addEventListener('click', () => { close(); say('Nothing changed'); });
      const btn = $('pf-wipe'), fill = $('pf-wipeFill'), HOLD = 2000; let t0 = 0, raf = 0, armed = false;
      const stop = () => { cancelAnimationFrame(raf); t0 = 0; fill.style.transition = 'width 0.2s'; fill.style.width = '0'; };
      const step = () => { const f = Math.min(1, (Date.now() - t0) / HOLD); fill.style.width = (f * 100) + '%';
        if (f >= 1) { t0 = 0; wipe(); } else { if (Math.floor(f * 4) !== Math.floor((f - 0.02) * 4)) buzz(8); raf = requestAnimationFrame(step); } };
      btn.addEventListener('pointerdown', (e) => { e.preventDefault(); fill.style.transition = 'none'; t0 = Date.now(); raf = requestAnimationFrame(step); });
      ['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => btn.addEventListener(ev, () => { if (t0) stop(); }));
      btn.addEventListener('contextmenu', (e) => e.preventDefault());
      btn.addEventListener('click', (e) => { if (e.detail !== 0) return;   // keyboard: press once to arm, again to wipe
        if (armed) wipe(); else { armed = true; $('pf-wipeTxt').textContent = 'PRESS AGAIN TO WIPE'; } });
    };
    const wipe = () => {
      $('pf-wipeTxt').textContent = 'WIPING…'; buzz(30);
      const P = 'gsd.', done = () => { try { Object.keys(localStorage).filter((k) => k.indexOf(P) === 0).forEach((k) => localStorage.removeItem(k)); sessionStorage.clear(); } catch (e) {}
        $('pf-fresh').click(); };
      const jobs = [];
      if (BETA && typeof GSN !== 'undefined') jobs.push(Promise.resolve(GSN.allOff ? GSN.allOff() : GSN.nudges(false)).catch(() => {}));   // Homie's nudges and friend alerts off for this phone too
      if (BETA) jobs.push(new Promise((ok) => { try { const r = indexedDB.deleteDatabase('gsd'); r.onsuccess = r.onerror = r.onblocked = () => ok(); } catch (e) { ok(); } }));
      Promise.race([Promise.all(jobs), new Promise((ok) => setTimeout(ok, 2500))]).then(done);
    };
    $('pf-freshBtn').addEventListener('click', freshSheet);
    if (lsGet('gsd.seenProfileTips', '0') !== '1') setTimeout(openTips, 450); else setTimeout(ready, 450);
    root.querySelectorAll('img[data-k]').forEach((im) => { if (!im.src) im.src = IMG[im.dataset.k]; });
    return true;
  }
}
