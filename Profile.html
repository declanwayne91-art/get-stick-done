    const paint = () => {
      const pl = PLATES.find((x) => x[0] === NP.plate) || PLATES[0]; $('pf-plate').style.background = pl[1];
      root.querySelectorAll('.pf-sw').forEach((b) => { const on = b.dataset.p === NP.plate; b.style.transform = on ? 'scale(1.15)' : 'none'; b.setAttribute('aria-pressed', on ? 'true' : 'false'); b.classList.toggle('pf-locked', !open1(b.dataset.p)); });
      $('pf-favImg').src = IMG[NP.sticker]; $('pf-fImg').src = IMG[NP.sticker];
      const pin = pinById[NP.pin]; $('pf-favPin').innerHTML = pin.plate; $('pf-fPin').innerHTML = pin.svg;
      $('pf-favLine').textContent = 'fave: ' + favName(NP.sticker).toLowerCase() + ' · ' + pin.name.toLowerCase();
      root.querySelectorAll('.pf-pin').forEach((b) => b.classList.toggle('pf-on', b.dataset.id === NP.pin));
    };

    // ---- sheets: pick a sticker, look at a pin
    const sheet = $('pf-sheet'), scrim = $('pf-scrim');
    const open = (html) => { $('pf-sheetBody').innerHTML = html; scrim.style.display = 'block'; sheet.style.display = 'flex';
      requestAnimationFrame(() => { scrim.style.opacity = 1; sheet.style.transform = 'none'; }); buzz(6); };
    const close = () => { scrim.style.opacity = 0; sheet.style.transform = 'translateY(105%)'; setTimeout(() => { scrim.style.display = 'none'; sheet.style.display = 'none'; }, reduce ? 0 : 260); };
    scrim.addEventListener('click', close); $('pf-sheetX').addEventListener('click', close);
    const pickSticker = () => {
      open('<span class="title-die bri" style="font-size:24px;text-shadow:3px 3px 0 #C6FF4D">YOUR FAVOURITE STICKER</span><span class="kal" style="font-size:14px;opacity:0.7">pick from the stickers in your book</span>'
        + '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:6px">' + FAVS.map(([k, n]) =>
          '<button type="button" class="pf-pick" data-k="' + k + '" aria-label="' + n + '" style="aspect-ratio:1;border-radius:16px;border:' + (k === NP.sticker ? '3px solid #172038;background:rgba(198,255,77,0.45)' : '2px dashed rgba(23,32,56,0.25);background:transparent') + ';padding:6px"><img alt="" src="' + IMG[k] + '" style="width:100%;height:100%;object-fit:contain"></button>').join('') + '</div>');
      $('pf-sheetBody').querySelectorAll('.pf-pick').forEach((b) => b.addEventListener('click', () => { NP.sticker = b.dataset.k; save(); paint(); close(); buzz(12); slap($('pf-favImg'), 7); say('Favourite sticker updated'); }));
    };
    const showPin = (id) => {
      const p = pinById[id];
      const prog = p.progress ? '<div style="width:100%;display:flex;flex-direction:column;gap:6px"><span style="height:12px;border-radius:12px;border:2px solid #172038;background:#FFFFFF;overflow:hidden"><span style="display:block;height:100%;width:' + Math.round(100 * p.progress[0] / p.progress[1]) + '%;background:#C6FF4D"></span></span><span class="kal" style="font-size:14px">' + p.progress[0] + ' of ' + p.progress[1] + '</span></div>' : '';
      open('<div style="align-self:center;filter:' + (p.earned ? 'drop-shadow(0 6px 6px rgba(20,15,10,0.35))' : 'brightness(0) opacity(0.2)') + '">' + p.big + '</div>'
        + '<span class="title-die bri" style="align-self:center;font-size:28px;text-shadow:3px 3px 0 #E2B544">' + p.name.toUpperCase() + '</span>'
        + '<span style="align-self:center;font-size:17px;font-weight:700;text-align:center">' + p.how + '</span>'
        + (p.earned ? '<span class="kal" style="align-self:center;font-size:14px;opacity:0.7">earned ' + p.date + '</span>'
          + (NP.pin === id ? '<span class="bri" style="align-self:center;padding:10px 16px;border-radius:14px;background:#172038;color:#C6FF4D;font-size:16px">ON YOUR NAME PLATE ✓</span>'
            : '<button type="button" id="pf-pinIt" class="press bri" style="height:54px;border-radius:16px;border:3px solid #172038;background:#C6FF4D;color:#172038;font-size:19px;box-shadow:3px 3px 0 #FF6FB0">PIN IT TO MY NAME PLATE</button>') : prog));
      const b = $('pf-pinIt'); if (b) b.addEventListener('click', () => { NP.pin = id; save(); paint(); close(); buzz([8, 30, 12]); slap($('pf-favPin'), -10); say('Pinned to your name plate'); });
    };
    // ---- how you're doing so far: this week and this month, any time before the wraps arrive
    const CATS = [['tick0', 'tasks'], ['curl', 'workouts'], ['gochunoodles', 'meals'], ['drop', 'water goals']];
    const total = (m) => STATS[m].days.reduce((a, b) => a + (b || 0), 0);
    const tiles = (m) => '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">' + STATS[m].cats.map((n, i) => '<div style="display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:14px;background:#FFFFFF;border:2.5px solid #172038">'
      + '<img alt="" src="' + IMG[CATS[i][0]] + '" style="width:36px;height:36px;object-fit:contain"><span class="bri" style="font-size:20px">' + n + '</span><span class="kal" style="font-size:12px;opacity:0.7">' + CATS[i][1] + '</span></div>').join('') + '</div>';
    const weekView = () => { const W = STATS.week, mx = Math.max.apply(null, W.days.map((d) => d || 0));
      return '<div style="display:flex;align-items:flex-end;justify-content:space-between;gap:6px;height:130px;padding:0 2px">' + W.days.map((d, i) => {
        const h = d == null ? 14 : Math.max(14, Math.round(104 * d / mx)), today = i === W.today;
        return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px"><span class="bri" style="font-size:13px;opacity:' + (d == null ? 0 : 1) + '">' + (d || '') + '</span>'
          + '<span style="width:100%;height:' + h + 'px;border-radius:8px;border:' + (d == null ? '2px dashed rgba(23,32,56,0.3)' : '2.5px solid #172038') + ';background:' + (d == null ? 'transparent' : today ? '#FF6FB0' : '#C6FF4D') + '"></span>'
          + '<span class="kal" style="font-size:13px;' + (today ? 'font-weight:700;text-decoration:underline' : 'opacity:0.7') + '">' + 'MTWTFSS'[i] + '</span></div>'; }).join('') + '</div>'; };
    const monthView = () => { const M = STATS.month; let cells = '';
      for (let i = 0; i < M.first; i++) cells += '<span></span>';
      for (let d = 1; d <= M.len; d++) { const n = M.days[d - 1], fut = d > M.today;
        const bg = fut ? 'transparent' : n >= 5 ? '#FF6FB0' : n >= 3 ? '#FFD23F' : n >= 1 ? '#C6FF4D' : '#FFFFFF';
        cells += '<span class="bri" style="aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;border:' + (fut ? '2px dashed rgba(23,32,56,0.25)' : d === M.today ? '3px solid #172038' : '2px solid #172038') + ';background:' + bg + ';opacity:' + (fut ? 0.55 : 1) + '">' + d + '</span>'; }
      return '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px">' + 'MTWTFSS'.split('').map((c) => '<span class="kal" style="text-align:center;font-size:12px;opacity:0.6">' + c + '</span>').join('') + cells + '</div>'; };
    const statsSheet = (m) => {
      const tab = (k, t) => '<button type="button" class="pf-stab bri" data-m="' + k + '" style="flex:1;height:38px;border-radius:12px;border:2.5px solid #172038;background:' + (k === m ? '#172038' : 'transparent') + ';color:' + (k === m ? '#C6FF4D' : '#172038') + ';font-size:15px">' + t + '</button>';
      open('<div style="display:flex;gap:8px;margin-top:14px">' + tab('week', 'THIS WEEK') + tab('month', 'THIS MONTH') + '</div>'
        + '<div style="display:flex;align-items:baseline;justify-content:space-between"><span class="bri" style="font-size:30px;text-shadow:3px 3px 0 #C6FF4D">' + total(m) + ' STICKERS</span><span class="kal" style="font-size:14px;opacity:0.7">' + STATS[m].range + ' · so far</span></div>'
        + (m === 'week' ? weekView() : monthView()) + tiles(m) + '<span class="kal" style="font-size:14px;opacity:0.75;text-align:center">' + STATS[m].wrap + '</span>');
      $('pf-sheetBody').querySelectorAll('.pf-stab').forEach((b) => b.addEventListener('click', () => { if (b.dataset.m !== m) { buzz(5); $('pf-sheetBody').innerHTML = ''; statsSheet(b.dataset.m); } }));
    };
    $('pf-weekBtn').addEventListener('click', () => statsSheet('week'));
    $('pf-monthBtn').addEventListener('click', () => statsSheet('month'));
    $('pf-wkN').textContent = total('week'); $('pf-moN').textContent = total('month');
    $('pf-favStickerBtn').addEventListener('click', pickSticker);
    $('pf-favPinBtn').addEventListener('click', () => { say('Tap any of your pins below to put it on your plate'); buzz(6); const b = $('pf-board'); if (b.animate && !reduce) b.animate([{ boxShadow: '0 0 0 0 #C6FF4D' }, { boxShadow: '0 0 0 6px #C6FF4D' }, { boxShadow: '0 0 0 0 #C6FF4D' }], { duration: 700 }); });
    root.querySelectorAll('.pf-pin').forEach((b) => b.addEventListener('click', () => showPin(b.dataset.id)));
    root.querySelectorAll('.pf-sw').forEach((b) => b.addEventListener('click', () => { const pl = PLATES.find((x) => x[0] === b.dataset.p);
      if (!open1(pl[0])) { say('Unlocks at level ' + pl[2]); buzz(4); return; } NP.plate = pl[0]; save(); paint(); buzz(6); }));
    paint();

    // ---- first visit: a few taped cards explain each section; "?" brings them back
    const tips = $('pf-tips'), cards = [...tips.querySelectorAll('.pf-tipc')], dots = [...tips.querySelectorAll('.pf-tipdot')], tnext = $('pf-tipNext');
    let ti = 0;
    const showCard = (i, dir) => { cards.forEach((c, k) => { const rot = 'rotate(' + c.dataset.rot + 'deg)';
        if (k === i) { c.style.display = 'flex'; c.style.opacity = 0; c.style.transform = 'translateX(' + (reduce ? 0 : 40 * dir) + 'px) ' + rot; requestAnimationFrame(() => requestAnimationFrame(() => { c.style.opacity = 1; c.style.transform = 'translateX(0) ' + rot; })); }
        else c.style.display = 'none'; });
      dots.forEach((d, k) => { d.style.width = k === i ? '26px' : '10px'; d.style.background = k <= i ? '#FF6FB0' : 'transparent'; });
      tnext.textContent = i === cards.length - 1 ? 'GOT IT' : 'NEXT →'; };
    const openTips = () => { ti = 0; tips.style.display = 'block'; requestAnimationFrame(() => { tips.style.opacity = 1; }); showCard(0, 1); buzz(6); };
    const closeTips = () => { tips.style.opacity = 0; setTimeout(() => { tips.style.display = 'none'; }, 220); try { localStorage.setItem('gsd.seenProfileTips', '1'); } catch (e) {} buzz(6); };
    tnext.addEventListener('click', () => { if (ti < cards.length - 1) { ti++; showCard(ti, 1); buzz(4); } else closeTips(); });
    $('pf-tipSkip').addEventListener('click', closeTips);
    let sx = null; tips.addEventListener('pointerdown', (e) => { sx = e.clientX; });
    tips.addEventListener('pointerup', (e) => { if (sx === null) return; const dx = e.clientX - sx; sx = null; if (dx < -50 && ti < cards.length - 1) { ti++; showCard(ti, 1); } else if (dx > 50 && ti > 0) { ti--; showCard(ti, -1); } });
    $('pf-help').addEventListener('click', openTips);
    if (lsGet('gsd.seenProfileTips', '0') !== '1') setTimeout(openTips, 450);
    root.querySelectorAll('img[data-k]').forEach((im) => { if (!im.src) im.src = IMG[im.dataset.k]; });
    return true;
  }
}
