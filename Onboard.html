<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Get St*ck Done!</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,500..800&amp;family=Kalam:wght@400;700&amp;family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;outline:none;padding:0}
button:focus-visible{box-shadow:0 0 0 3px #FF6FB0}
.title-die{filter:url(#tdie) drop-shadow(0 6px 6px rgba(60,40,20,0.3))}
.bri{font-family:'Bricolage Grotesque',sans-serif;font-stretch:75%;font-weight:800;line-height:0.9}
.kal{font-family:'Kalam',cursive;font-weight:700}
.press{transition:transform 0.09s ease-out}
.press:active{transform:scale(0.92)}
.dot{width:34px;height:34px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:17px;color:#172038;border:3px solid #FFFFFF;box-shadow:0 0 0 2px #172038}
.chip{padding:5px 10px;border-radius:999px;background:#C6FF4D;border:2px solid #172038;font-weight:700;font-size:13px;color:#172038;white-space:nowrap}
.box{width:24px;height:24px;flex-shrink:0;border:2.5px solid #172038;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#172038;font-weight:900}
.tom{position:relative;width:60px;height:54px;border-radius:48% 48% 46% 46%;border:3px solid #FFFFFF;box-shadow:0 0 0 2px #2A1A10;display:flex;align-items:center;justify-content:center}
@keyframes ring{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.ringing{animation:ring 0.4s ease-in-out infinite}
@keyframes peelclip{0%{clip-path:inset(-20px -20px -20px -20px)}100%{clip-path:inset(-20px 100% -20px -20px)}}
@keyframes peelflap{0%{left:146px;opacity:0;transform:scaleX(0.4)}12%{opacity:1}85%{opacity:1}100%{left:-14px;opacity:0;transform:scaleX(1.1)}}
.face{display:block}
.flap{position:absolute;top:-3px;width:22px;height:56px;border-radius:14px 4px 4px 14px;background:linear-gradient(90deg,#FFFFFF,#F1ECE3 55%,#CFC6B6);border:2px solid #111;box-shadow:-5px 4px 6px rgba(0,0,0,0.28);display:none;pointer-events:none}
.peeling .face{animation:peelclip 0.6s cubic-bezier(.4,0,.55,1) forwards}
.peeling .flap{display:block;animation:peelflap 0.6s cubic-bezier(.4,0,.55,1) forwards}
.peeling{pointer-events:none}
@keyframes nextpop{0%{transform:scale(1.7) rotate(-34deg);opacity:0}65%{transform:scale(0.94) rotate(-8deg);opacity:1}100%{transform:scale(1) rotate(-12deg);opacity:1}}
.nextpop{animation:nextpop 0.34s cubic-bezier(.3,1.5,.5,1) both}
@keyframes bob{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-4px) scale(1.02)}}
.nextpop svg{animation:bob 2.2s ease-in-out 0.4s infinite}
.peeling{transform:rotate(-12deg)}

@keyframes slapin{0%{transform:scale(1.7) rotate(-22deg);opacity:0}60%{transform:scale(0.92) rotate(-4deg);opacity:1}100%{transform:scale(1) rotate(-6deg);opacity:1}}
.slap{animation:slapin 0.32s cubic-bezier(.3,1.5,.5,1) both}
.pic svg{height:100%;max-height:100%;width:auto;max-width:100%}
.prepmid>*{flex-shrink:0}
</style>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style data-lm>.lm{font-family:"DM Mono",ui-monospace,monospace !important;font-weight:500;text-transform:uppercase;color:#FFFFFF !important;letter-spacing:3px;background-image:linear-gradient(rgba(255,255,255,0.22),rgba(255,255,255,0) 45%,rgba(0,0,0,0.12)) !important;text-shadow:0 -1px 0 rgba(0,0,0,0.55),0 1px 0 rgba(255,255,255,0.4) !important;box-shadow:inset 0 2px 0 rgba(255,255,255,0.28),inset 0 -3px 0 rgba(0,0,0,0.22),0 3px 5px rgba(60,40,20,0.35) !important;border-radius:3px}[style*="DM Mono"][style*="background: #"]{background-image:linear-gradient(rgba(255,255,255,0.22),rgba(255,255,255,0) 45%,rgba(0,0,0,0.12));text-shadow:0 -1px 0 rgba(0,0,0,0.55),0 1px 0 rgba(255,255,255,0.4) !important;box-shadow:inset 0 2px 0 rgba(255,255,255,0.28),inset 0 -3px 0 rgba(0,0,0,0.22),0 3px 5px rgba(60,40,20,0.35) !important;border-radius:3px}</style>
<style>
.tile{width:58px;height:66px;border-radius:16px;border:3px solid #172038;font-size:34px;color:#172038;display:flex;align-items:center;justify-content:center}
.chipb{height:42px;padding:0 14px;border-radius:999px;border:2.5px solid #172038;font-size:16px;color:#172038}
.dchip{width:44px;height:42px;border-radius:12px;border:2.5px solid #172038;font-size:15px;color:#172038;display:flex;align-items:center;justify-content:center}
.q{font-size:20px;font-weight:700;line-height:1.2}
@keyframes sheetup{from{transform:translateY(100%)}to{transform:none}}
.sheet{animation:sheetup 0.24s cubic-bezier(.2,.9,.3,1) both}
.hint{font-size:15px;opacity:0.75}
@keyframes coverin{0%{transform:scale(1.5) rotate(-14deg);opacity:0}60%{transform:scale(0.95) rotate(-2deg);opacity:1}100%{transform:scale(1) rotate(-3deg)}}
.coverin{animation:coverin 0.4s cubic-bezier(.3,1.5,.5,1) both}
input:focus{outline:none;box-shadow:0 0 0 3px #FF6FB0}
</style>

<style>html,body{margin:0;height:100%;overflow:hidden;background:#0B1022;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}

#dc-stage{position:relative;overflow:hidden}
</style>

<script type="text/x-dc-template" id="dc-tpl">

<svg aria-hidden="true" width="0" height="0" style="position: absolute; width: 0; height: 0; overflow: hidden"><defs><filter id="tdie" x="-30%" y="-60%" width="160%" height="220%" color-interpolation-filters="sRGB"><feMorphology in="SourceAlpha" operator="dilate" radius="5" result="grow"></feMorphology><feGaussianBlur in="grow" stdDeviation="2.5" result="soft"></feGaussianBlur><feComponentTransfer in="soft" result="white-mask"><feFuncA type="linear" slope="10" intercept="-4"></feFuncA></feComponentTransfer><feMorphology in="white-mask" operator="dilate" radius="3" result="key-grow"></feMorphology><feGaussianBlur in="key-grow" stdDeviation="1" result="key-soft"></feGaussianBlur><feComponentTransfer in="key-soft" result="key-mask"><feFuncA type="linear" slope="10" intercept="-4"></feFuncA></feComponentTransfer><feFlood flood-color="#111111"></feFlood><feComposite in2="key-mask" operator="in" result="key"></feComposite><feFlood flood-color="#FFFFFF"></feFlood><feComposite in2="white-mask" operator="in" result="white"></feComposite><feMerge><feMergeNode in="key"></feMergeNode><feMergeNode in="white"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge></filter><filter id="kst" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB"><feMorphology in="SourceAlpha" operator="dilate" radius="7" result="h"></feMorphology><feMorphology in="SourceAlpha" operator="dilate" radius="19" result="c1"></feMorphology><feMorphology in="c1" operator="erode" radius="16" result="c2"></feMorphology><feComposite in="h" in2="c2" operator="over" result="u"></feComposite><feGaussianBlur in="u" stdDeviation="2.4" result="ub"></feGaussianBlur><feComponentTransfer in="ub" result="back"><feFuncA type="linear" slope="6" intercept="-3.00"></feFuncA></feComponentTransfer><feMorphology in="back" operator="dilate" radius="3.2" result="eg"></feMorphology><feComposite in="eg" in2="back" operator="out" result="edge"></feComposite><feFlood flood-color="#2A1A10"></fe   <div style="position: absolute; left: 18px; right: 18px; top: 18px; display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; gap: 6px"><sc-for list="{{dots}}" as="d" hint-placeholder-count="5"><span style="width: {{d.w}}; height: 10px; border-radius: 10px; background: {{d.bg}}; border: 2px solid #172038"></span></sc-for></div>
    <sc-if value="{{canSkip}}" hint-placeholder-val="{{ true }}"><button type="button" class="press kal" onClick="{{skip}}" style="border: none; background: transparent; color: #172038; font-size: 17px; text-decoration: underline">skip</button></sc-if>
  </div>

  <div style="position: absolute; left: 18px; right: 18px; top: 58px; bottom: 104px; display: flex; flex-direction: column; gap: 14px">

      <div class="{{coverCls}}" style="align-self: center; width: 250px; height: 310px; margin: 6px 0 4px; border-radius: 10px 22px 22px 10px; background: #172038; box-shadow: inset 14px 0 0 #0E1528, 6px 8px 0 #FF6FB0, 0 14px 20px rgba(0,0,0,0.25); position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 0 18px 0 30px; box-sizing: border-box; transform: rotate(-3deg)">
        <span class="bri" style="font-size: {{nameSize}}; color: #C6FF4D; text-align: center; line-height: 0.9; text-shadow: 3px 3px 0 #FF6FB0; word-break: break-word">{{coverName}}</span>
        <span class="bri" style="font-size: 26px; color: #FFFFFF; letter-spacing: 1px; text-align: center">STICKER BOOK</span>
        <span class="bri" style="position: absolute; right: -14px; top: -16px; width: 56px; height: 56px; border-radius: 56px; background: #FF6FB0; border: 4px solid #FFFFFF; box-shadow: 0 0 0 2.5px #172038; color: #172038; font-size: 52px; display: flex; align-items: center; justify-content: center; padding-top: 14px; box-sizing: border-box; transform: rotate(12deg)">*</span>
        <span class="kal" style="position: absolute; bottom: 14px; left: 30px; right: 18px; text-align: center; color: #F6EFE1; opacity: 0.7; font-size: 13px">get st*ck done!</span>
      </div>
    </sc-if>

    <sc-if value="{{s0}}" hint-placeholder-val="{{ true }}">
      <span class="title-die bri" style="font-size: 36px; text-shadow: 3px 3px 0 #FF6FB0; transform: rotate(-2deg); transform-origin: left; white-space: nowrap">YOUR NAME?</span>

    </sc-if>

      <span class="q">How many do you usually cook for?</span>

      <span class="hint">{{peopleHint}}</span>
      <span class="q" style="margin-top: 10px">Love leftovers for lunch?</span>
      <div style="display: flex; gap: 10px"><sc-for list="{{lunchOpts}}" as="o" hint-placeholder-count="2"><button type="button" class="chipb bri press" onClick="{{o.tap}}" aria-pressed="{{o.on}}" style="background: {{o.bg}}">{{o.label}}</button></sc-for></div>
      <span class="hint">{{lunchHint}}</span>
      <span class="q" style="margin-top: 10px">Little ones eating with you?</span>
      <div style="display: flex; gap: 10px"><sc-for list="{{kidOpts}}" as="o" hint-placeholder-count="2"><button type="button" class="chipb bri press" onClick="{{o.tap}}" aria-pressed="{{o.on}}" style="background: {{o.bg}}">{{o.label}}</button></sc-for></div>
      <span class="hint">{{kidHint}}</span>
    </sc-if>

    <sc-if value="{{s2}}" hint-placeholder-val="{{ false }}">

      <span class="q">Anything you don’t eat? Tap any that apply and we won’t suggest recipes with them.</span>
      <div style="display: flex; flex-wrap: wrap; gap: 10px"><sc-for list="{{avoids}}" as="a" hint-placeholder-count="6"><button type="button" class="chipb bri press" onClick="{{a.tap}}" aria-pressed="{{a.on}}" style="background: {{a.bg}}; transform: rotate({{a.rot}})">{{a.label}}</button></sc-for></div>

<script type="text/x-dc-logic" id="dc-logic">
class Component extends DCLogic {
  constructor(props) {

    this.FULL = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
    this.MOVE = [['gym', 'GYM', 'gym'], ['walk', 'WALKING', 'walking'], ['run', 'RUNNING', 'running'], ['cycle', 'CYCLING', 'cycling'], ['swim', 'SWIMMING', 'swimming'], ['stretch', 'STRETCHING', 'stretching'], ['other', 'SPORT & CLASSES', 'sport']];
    this.LAD = {"run": 11, "walk": 6, "cycle": 6, "swim": 6, "stretch": 3};
    this.AV = [['vegetarian', 'VEGETARIAN'], ['pork', 'NO PORK'], ['beef', 'NO BEEF'], ['fish', 'NO FISH'], ['nuts', 'NO NUTS'], ['dairy', 'NO DAIRY']];
    this.s = { step: 0, name: '', household: null, lunches: null, avoid: {}, kids: null, hydro: null, every: 2, dayStart: 8, dayEnd: 21, learn: false, landed: false, fit: null, likes: {}, grow: null };
  }
  re() { this.setState({ n: Date.now() }); }
  buzz(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }
  hr(h) { const hh = ((h % 24) + 24) % 24; return (hh % 12 === 0 ? 12 : hh % 12) + (hh < 12 ? 'am' : 'pm'); }
  bookName() {
    const n = this.s.name.trim();
    if (!n) return 'MY';
    return n.toUpperCase() + '’S';
  }
  profile() {
    const s = this.s;
    return { bookName: s.name.trim() ? s.name.trim() + '’s Sticker Book' : 'My Sticker Book', household: s.household || 2, lunches: s.lunches === true, littleOnes: s.kids === true,
      avoid: Object.keys(s.avoid).filter((k) => s.avoid[k]), hydro: s.hydro === true ? { every: s.every, goal: 6, dayStart: s.dayStart, dayEnd: s.dayEnd } : null };
  }
  save() {
    const s = this.s;
    try {
      localStorage.setItem('gsd.profile', JSON.stringify(this.profile()));
      // get moving: level (where plans and ladders start), what they enjoy (first in the gym), GROW for those
      if (s.fit) localStorage.setItem('gsd.fitLevel', s.fit);
      const likes = this.MOVE.map((m) => m[0]).filter((k) => s.likes[k]);
      localStorage.setItem('gsd.fitLikes', JSON.stringify(likes));
      if (s.grow === true && likes.length) {
        const P = JSON.parse(localStorage.getItem('gsd.progress') || '{}'); P.areas = P.areas || {};
        likes.forEach((k) => { if (k === 'other') return; const n = this.LAD[k] || 1, st = s.fit === 'regular' ? Math.floor(n * 0.5) : s.fit === 'back' ? Math.floor(n * 0.3) : 0;
          const A = P.areas[k] || (P.areas[k] = { stage: st, pts: 0, tough: 0 }); A.on = true; });
        localStorage.setItem('gsd.progress', JSON.stringify(P));
      }
    } catch (e) {}
  }
  list(days) {
    const names = days.map((d) => this.FULL[d].slice(0, 3));
    return names.length < 2 ? names.join('') : names.slice(0, -1).join(', ') + ' & ' + names[names.length - 1];
  }
  summary() {
    const p = this.profile(), s = this.s, out = [];
    out.push({ book: true, t: p.bookName });
    out.push({ serve: true, t: 'Recipes serve ' + p.household + (s.household ? '' : ' (the usual)') + (p.lunches ? ' · leftovers add ' + p.household + (p.household === 1 ? ' lunch' : ' lunches') : '') });
    if (p.littleOnes) out.push({ kids: true, t: 'Little-one tips on every recipe' });
    if (p.avoid.length) out.push({ no: true, t: 'No ' + p.avoid.map((a) => a === 'vegetarian' ? 'meat or fish' : a).join(', ').replace(/, ([^,]*)$/, ' or $1') + ' suggestions' });
    const lk = this.MOVE.filter((m) => s.likes[m[0]]).map((m) => m[2]);
    if (s.fit || lk.length) out.push({ move: true, t: (s.fit ? { new: 'Just starting', back: 'Getting back into it', regular: 'Pretty regular' }[s.fit] : 'Workouts') + (lk.length ? ': ' + (lk.length > 2 ? lk.slice(0, 2).join(', ') + ' and more' : lk.join(' and ')) : '') + (s.grow === true ? ', stepping up' : '') });
    if (p.hydro) out.push({ hydro: true, t: 'Hydro Homie on: every 2 hrs, 8am–9pm' });
    return out;
  }
  renderVals() {
    const s = this.s, st = s.step, N = 6;

    const nm = this.bookName();
    return {
      dots: Array.from({ length: N }, (_, n) => ({ w: n === st ? '26px' : '10px', bg: n <= st ? '#FF6FB0' : '#FFFFFF' })),
      canSkip: st < 5, skip: () => go(st + 1),
      canBack: st > 0 && st < 5, back: () => go(st - 1),
      nextText: st === 0 ? (s.name.trim() ? 'THAT’S ME →' : 'NEXT →') : st === 5 ? 'OPEN MY STICKER BOOK →' : 'NEXT →',
      next: () => { if (st < 5) go(st + 1); else { s.landed = true; this.save(); this.re(); } },
      notLast: st < 5, saveNow: () => { this.save(); },
      s0: st === 0, s1: st === 1, s2: st === 2, s3: st === 3, s4: st === 4, s5: st === 5,
      showCover: st === 0 || st === 5, coverCls: st === 5 ? 'coverin' : '',
      coverName: nm, nameSize: nm.length > 10 ? '34px' : nm.length > 7 ? '44px' : '56px',
      name: s.name, setName: (e) => { s.name = String(e && e.target ? e.target.value : '').slice(0, 14); this.re(); },
      kidOpts: [[true, 'YES'], [false, 'NO']].map((o) => ({ label: o[1], on: s.kids === o[0], bg: s.kids === o[0] ? (o[0] ? '#C6FF4D' : '#FF6FB0') : '#FFFFFF', tap: () => { s.kids = o[0]; this.buzz(8); this.re(); } })),
      kidHint: s.kids === true ? 'Every recipe will show when to take their portion out, before the salt or spice, plus any prep tips.' : s.kids === false ? 'You’ll still get the option when you cook for more than usual, like when friends bring their kids.' : 'For toddlers and up. Tips only show if you say yes.',
      people: [1, 2, 3, 4, 5].map((n, i) => ({ label: n === 5 ? '5+' : String(n), on: s.household === n, bg: s.household === n ? '#C6FF4D' : '#FFFFFF', rot: ((i % 2) ? 2 : -2) + 'deg',
        aria: (n === 5 ? '5 or more' : n) + (n === 1 ? ' person' : ' people'), tap: () => { s.household = n; this.buzz(8); this.re(); } })),
      peopleHint: s.household ? 'Every recipe will start at serves ' + s.household + '. You can change it on any recipe.' : 'Skip this and recipes start at serves 2.',
      lunchOpts: [[true, 'YES PLEASE'], [false, 'NOT REALLY']].map((o) => ({ label: o[1], on: s.lunches === o[0], bg: s.lunches === o[0] ? (o[0] ? '#C6FF4D' : '#FF6FB0') : '#FFFFFF', tap: () => { s.lunches = o[0]; this.buzz(8); this.re(); } })),
      lunchHint: s.lunches === true ? 'Choose for me will plan lunches for your workdays, ' + (s.household || 2) + ((s.household || 2) === 1 ? ' portion' : ' portions') + ' each.' : s.lunches === false ? 'No problem, you can still add a lunch to any meal.' : '',
