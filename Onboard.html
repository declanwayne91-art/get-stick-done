<script type="text/x-dc-logic" id="dc-logic">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.DAYS = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
    this.FULL = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
    this.MOVE = [['gym', 'GYM', 'gym'], ['walk', 'WALKING', 'walking'], ['run', 'RUNNING', 'running'], ['cycle', 'CYCLING', 'cycling'], ['swim', 'SWIMMING', 'swimming'], ['stretch', 'STRETCHING', 'stretching'], ['other', 'SPORT & CLASSES', 'sport']];
    this.LAD = {"run": 11, "walk": 6, "cycle": 6, "swim": 6, "stretch": 3};
    this.AV = [['vegetarian', 'VEGETARIAN'], ['pork', 'NO PORK'], ['beef', 'NO BEEF'], ['fish', 'NO FISH']];
    this.AL = [["gluten", "GLUTEN", "gluten"], ["milk", "DAIRY", "dairy"], ["eggs", "EGGS", "eggs"], ["peanuts", "PEANUTS", "peanuts"], ["treenuts", "TREE NUTS", "tree nuts"], ["sesame", "SESAME", "sesame"], ["soya", "SOYA", "soya"], ["crustaceans", "SHELLFISH", "shellfish"], ["molluscs", "MOLLUSCS", "molluscs"], ["mustard", "MUSTARD", "mustard"], ["celery", "CELERY", "celery"], ["sulphites", "SULPHITES", "sulphites"], ["lupin", "LUPIN", "lupin"]];   // the UK's 14 allergens (allergens.py); fish is NO FISH above
    this.AVNAME = Object.assign({ vegetarian: 'meat or fish' }, Object.fromEntries(this.AL.map((a) => [a[0], a[2]])));
    this.s = { step: 0, name: '', household: null, lunches: null, avoid: {}, kids: null, hydro: null, watch: null, notif: '', every: 2, dayStart: 8, dayEnd: 21, learn: false, landed: false, fit: null, likes: {}, grow: null };
  }
  re() { this.setState({ n: Date.now() }); }
  buzz(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }
  hr(h) { const hh = ((h % 24) + 24) % 24; return (hh % 12 === 0 ? 12 : hh % 12) + (hh < 12 ? 'am' : 'pm'); }
  bookName() {
    const n = this.s.name.trim();
    if (!n) return 'MY';
    return n.toUpperCase() + '’S';
  }
  profile() {
    const s = this.s;
    return { bookName: s.name.trim() ? s.name.trim() + '’s Sticker Book' : 'My Sticker Book', household: s.household || 2, lunches: s.lunches === true, littleOnes: s.kids === true,
      avoid: Object.keys(s.avoid).filter((k) => s.avoid[k]), hydro: s.hydro === true ? { every: s.every, goal: 6, dayStart: s.dayStart, dayEnd: s.dayEnd } : null, watch: s.watch === true, hydroPush: s.hydro === true && s.push === 'on' };
  }
  save() {
    const s = this.s;
    try {
      localStorage.setItem('gsd.profile', JSON.stringify(this.profile()));
      // get moving: level (where plans and ladders start), what they enjoy (first in the gym), GROW for those
      if (s.fit) localStorage.setItem('gsd.fitLevel', s.fit);
      const likes = this.MOVE.map((m) => m[0]).filter((k) => s.likes[k]);
      localStorage.setItem('gsd.fitLikes', JSON.stringify(likes));
      if (s.grow === true && likes.length) {
        const P = JSON.parse(localStorage.getItem('gsd.progress') || '{}'); P.areas = P.areas || {};
        likes.forEach((k) => { if (k === 'other') return; const n = this.LAD[k] || 1, st = s.fit === 'regular' ? Math.floor(n * 0.5) : s.fit === 'back' ? Math.floor(n * 0.3) : 0;
          const A = P.areas[k] || (P.areas[k] = { stage: st, pts: 0, tough: 0 }); A.on = true; });
        localStorage.setItem('gsd.progress', JSON.stringify(P));
      }
    } catch (e) {}
  }
  list(days) {
    const names = days.map((d) => this.FULL[d].slice(0, 3));
    return names.length < 2 ? names.join('') : names.slice(0, -1).join(', ') + ' & ' + names[names.length - 1];
  }
  summary() {
    const p = this.profile(), s = this.s, out = [];
    out.push({ book: true, t: p.bookName });
    out.push({ serve: true, t: 'Recipes serve ' + p.household + (s.household ? '' : ' (the usual)') + (p.lunches ? ' · leftovers add ' + p.household + (p.household === 1 ? ' lunch' : ' lunches') : '') });
    if (p.littleOnes) out.push({ kids: true, t: 'Little-one tips on every recipe' });
    if (p.avoid.length) out.push({ no: true, t: 'No ' + p.avoid.map((a) => this.AVNAME[a] || a).join(', ').replace(/, ([^,]*)$/, ' or $1') + ' suggestions' });
    const lk = this.MOVE.filter((m) => s.likes[m[0]]).map((m) => m[2]);
    if (s.fit || lk.length) out.push({ move: true, t: (s.fit ? { new: 'Just starting', back: 'Getting back into it', regular: 'Pretty regular' }[s.fit] : 'Workouts') + (lk.length ? ': ' + (lk.length > 2 ? lk.slice(0, 2).join(', ') + ' and more' : lk.join(' and ')) : '') + (s.grow === true ? ', stepping up' : '') });
    if (p.hydro) out.push({ hydro: true, t: 'Hydro Homie on: every 2 hrs, 8am–9pm' });
    if (p.watch) out.push({ watch: true, t: 'Watch taps on: timers, rest, stickers' });
    return out;
  }
  renderVals() {
    const s = this.s, st = s.step, N = 7;
    const go = (n) => { s.step = n; if (n === 6) { this.save(); this.buzz([10, 50, 20]); } this.re(); };
    const nm = this.bookName();
    return {
      dots: Array.from({ length: N }, (_, n) => ({ w: n === st ? '26px' : '10px', bg: n <= st ? '#FF6FB0' : '#FFFFFF' })),
      canSkip: st < 6, skip: () => go(st + 1),
      canBack: st > 0 && st < 6, back: () => go(st - 1),
      nextText: st === 0 ? (s.name.trim() ? 'THAT’S ME →' : 'NEXT →') : st === 6 ? 'OPEN MY STICKER BOOK →' : 'NEXT →',
      next: () => { if (st < 6) go(st + 1); else { s.landed = true; this.save(); this.re(); } },
      notLast: st < 6, saveNow: () => { this.save(); },
      s0: st === 0, s1: st === 1, s2: st === 2, s3: st === 3, s4: st === 4, sW: st === 5, s5: st === 6,
      showCover: st === 0 || st === 6, coverCls: st === 6 ? 'coverin' : '',
      coverName: nm, nameSize: nm.length > 10 ? '34px' : nm.length > 7 ? '44px' : '56px',
