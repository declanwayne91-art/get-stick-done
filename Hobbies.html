    // ================================================================ render + routing
    const render = () => { const h = load(); if (!h.picked.length && S.v !== 'try') S.v = 'pick';

    // ---------------- actions
    const pinToggle = (id) => { const h = load(), on = h.pins.indexOf(id) >= 0;
      if (on) { h.pins = h.pins.filter((x) => x !== id); save(h); buzz(6); say('Unpinned from Today'); }

    const bookSheet = () => { const h = load(), cur = h.read.cur || {}; let kind = cur.kind || '';

        + '<span class="kal" style="display:block;font-size:15px;margin:14px 0 8px">what kind? (it picks your stamp)</span><div id="hb-kinds">' + KINDS.map((k) => '<button type="button" class="hb-kind kal" data-k="' + k[0] + '" aria-pressed="' + (k[0] === kind) + '">' + esc(k[1]) + '</button>').join('') + '</div>'

    const reveal = (it, line, sub) => { const sh = sheet('<div style="text-align:center;padding-top:6px">'
        + '<span class="bri" style="display:block;font-size:56px;color:#C6FF4D;text-shadow:4px 4px 0 #FF6FB0">STAMPED!</span>'

        + '<span class="kal" style="display:block;font-size:14px;color:rgba(246,239,225,0.75)">' + sub + '</span>'

      sh.querySelector('[data-close]').addEventListener('click', () => { close(); if (it.book) setTimeout(bookSheet, 320); }); buzz([20, 60, 30]); };
    const finishSheet = () => { const h = load(), cur = h.read.cur; if (!cur) return bookSheet();
      const sh = sheet('<span class="bri" style="display:block;font-size:30px;margin-top:6px">FINISHED IT?</span>'
        + '<span class="kal" style="display:block;font-size:17px;line-height:1.2;margin-top:6px">' + esc(cur.t) + ' gets its own stamp in ST*CK POST, postmarked today.</span>'
        + '<button type="button" id="hb-fYes" class="hb-puff bri" style="width:100%;height:56px;margin-top:18px;background:#FF6FB0">YES, I FINISHED IT!</button>'

      sh.querySelector('[data-close]').addEventListener('click', close);
      sh.querySelector('#hb-fYes').addEventListener('click', () => { const r = GSP.hobFinish('read', cur), h2 = load(); h2.read.cur = null; save(h2); render();

    root.addEventListener('click', (e) => { const b = e.target.closest('[data-act]'); if (!b || b.disabled) return; const a = b.dataset.act;
