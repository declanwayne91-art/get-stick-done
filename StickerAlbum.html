    const free = (kind) => { const out = []; PAGES.forEach((p) => p.slots && p.slots.forEach((s) => { if (s.kind === kind && !s.filled && S.queue.indexOf(s) < 0 && S.live !== s) out.push(s); })); return out; };
    const pickCook = () => { // the page closest to complete goes first: the last few spaces pull hardest
      const c = free('cook'); if (!c.length) return null; const left = (s) => s.pg.slots.filter((x) => x.kind === 'cook' && !x.filled).length;
      c.sort((a, b) => left(a) - left(b)); return c[0]; };
    const today = () => slotById['h-29'];
    const E = {
      cook: () => { const s = pickCook(); return s ? [s] : []; },
      gym: () => { const m = free('move'), s = free('session'); return [s[0], m[0]].filter(Boolean); },
      water: () => { const t = today(); return t && !t.filled ? [t] : free('water').slice(0, 1); },
      tasks: () => { let f = free('task');   // a full sheet? the next one joins the bottom of the long everyday page
        while (f.length < 3) { const ep = PAGES.find((p) => p.tpl === 'everyday'); addSheet(ep); ep.fresh = 'Page ' + ep.sheets + ' started. Scroll up to see them all.'; f = free('task'); }
        return f.slice(0, 3); },
      hobby: () => { if (!secOf('hobbies')) { const F = BOOK.future.hobbies; addSection(F.section, F.pages); }   // a whole new section, from data

      win: () => { const h = free('holo').concat(free('level')); return h.slice(0, 1); },
    };
    root.querySelectorAll('[data-earn]').forEach((b) => b.addEventListener('click', () => { const l = E[b.dataset.earn](); if (!l.length) { say('That section’s full in this demo.'); return; } earn(l); }));
    // arriving with new stickers (Today's "to stick" chip links to StickerAlbum.html#new): a mixed batch is waiting, each
    // one headed for its own shaped space in its own section. STICK THEM ALL FOR ME places them one by one.
    if (/#new\b/.test(location.hash)) later(() => { const l = [].concat(E.tasks().slice(0, 1), E.gym().slice(0, 1), E.cook(), E.water(), E.win()); if (l.length) earn(l); }, 700);
    const tog = $('sa-autoTog'); const paintTog = () => { tog.setAttribute('aria-checked', S.auto ? 'true' : 'false'); $('sa-knob').style.transform = S.auto ? 'translateX(20px)' : 'none'; $('sa-track').style.background = S.auto ? '#C6FF4D' : '#E4DED2'; };
    paintTog(); tog.addEventListener('click', () => { S.auto = !S.auto; try { localStorage.setItem('gsd.autoStick', S.auto ? '1' : '0'); } catch (e) {} paintTog(); buzz(6); if (S.auto && S.mode === 'ready') later(autoStick, 300); });
    const hap = $('sa-hapBtn'); const paintHap = () => { hap.textContent = 'haptics ' + (S.haptics ? 'on' : 'off'); hap.style.opacity = S.haptics ? 1 : 0.55; };
    paintHap(); hap.addEventListener('click', () => { S.haptics = !S.haptics; try { localStorage.setItem('gsd.haptics', S.haptics ? '1' : '0'); } catch (e) {} paintHap(); buzz(8); });

    // ---- tabs and contents are drawn from SECTIONS, so they grow with the book
    const holo = 'linear-gradient(135deg, #FF9AD5, #FFE48A 30%, #9BFFD9 55%, #9CC9FF 75%, #D3A6FF)';
    const renderTabs = (fresh) => {

        + '<span class="fillb" id="sa-tabbar-' + x.id + '"></span><span class="t" style="font-size:' + (h < 64 ? 11 : 13) + 'px">' + esc(x.label) + '</span></button>').join('');
      tabsEl.querySelectorAll('.sa-tab').forEach((t) => { t.addEventListener('click', () => { if (S.flipping || S.mode !== 'idle') return; goTo(PAGES.findIndex((p) => p.sec === t.dataset.sec)); });
        if (t.dataset.sec === fresh && !reduce && t.animate) t.animate([{ transform: 'translateX(-44px)' }, { transform: 'translateX(4px)' }, { transform: 'none' }], { duration: 560, easing: 'cubic-bezier(.2,.9,.3,1)' }); });
    };
    const renderContents = () => {
      const box = $('sa-crows');
      box.innerHTML = SECTIONS.map((x) => '<div class="sa-crow" role="button" data-sec="' + x.id + '"><span style="width:14px;height:34px;border-radius:4px;background:' + (x.holo ? holo : x.col) + ';border:2px solid #172038;flex-shrink:0"></span>'
        + '<span style="flex:1;display:flex;flex-direction:column;gap:5px"><span style="display:flex;justify-content:space-between"><span class="bri" style="font-size:17px">' + esc(x.label) + '</span><span id="sa-cnt-' + x.id + '" class="kal" style="font-size:14px;opacity:0.7"></span></span>'
        + '<span style="height:10px;border-radius:10px;border:2px solid #172038;background:#FFFFFF;overflow:hidden"><span id="sa-bar-' + x.id + '" style="display:block;height:100%;width:0;background:' + (x.id === 'everyday' ? '#172038' : x.col) + ';transition:width 0.4s ease"></span></span></span></div>').join('');
      box.querySelectorAll('.sa-crow').forEach((r) => r.addEventListener('click', () => { if (!S.flipping) goTo(PAGES.findIndex((p) => p.sec === r.dataset.sec)); }));
    };
    // ---- growing the book: a page joins the end of its section; a section slots in after the one it names
    function addPage(p) { const last = PAGES.reduce((m, q, i) => q.sec === p.sec ? i : m, -1); insertPage(p, last + 1); paintNav(); prog(); return p; }
    function addSection(sec, pages) {

      const ai = sec.after && secOf(sec.after) ? SECTIONS.findIndex((x) => x.id === sec.after) + 1 : SECTIONS.length; SECTIONS.splice(ai, 0, sec);
      const before = SECTIONS.slice(0, ai).map((x) => x.id); let at = PAGES.reduce((m, q, i) => before.indexOf(q.sec) >= 0 ? i : m, 1) + 1;
      pages.forEach((p0, j) => { const p = JSON.parse(JSON.stringify(p0)); if (j === 0) p.fresh = 'New section unlocked: ' + cap(sec.label) + '!'; insertPage(p, at++); });

    this.addPage = addPage; this.addSection = addSection; this.PAGES = PAGES; this.SECTIONS = SECTIONS;
    renderTabs(); renderContents(); S.ready = true;
    showOnly(0); paintNav(); prog(); trayMode('idle');

  }
}
