  <div style="position: absolute; right: 20px; top: 214px; display: flex; flex-direction: column; gap: 14px">

    <button type="button" class="ctl press" onClick="{{next}}" aria-label="Next step" style="background: #FFFFFF; font-size: 26px; transform: rotate(-3deg)">›</button>
  </div>
