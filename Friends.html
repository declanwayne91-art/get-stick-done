<script type="text/x-dc-logic" id="dc-logic">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.friendsData = [
      { name: 'Maya', initial: 'M', colour: '#C6FF4D', when: '2h ago', badge: 'LEVEL 10', badgeBg: 'conic-gradient(from 30deg, #FFB3E6, #B3F0FF, #D9FFB3, #FFF2B3, #E0B3FF, #FFB3E6)' },
      { name: 'Sam', initial: 'S', colour: '#FF6FB0', when: 'yesterday', badge: 'LEG DAY VARSITY', badgeBg: '#FFE45C' },
      { name: 'Jo', initial: 'J', colour: '#FFE45C', when: 'Monday', badge: 'COMEBACK KID', badgeBg: '#FF8A4C' }
    ];
    this.cheersData = [
      { label: 'NICE ONE!', bg: '#C6FF4D', ink: '#172038', radius: '999px', pad: '8px 14px', rot: '-6deg' },
      { label: 'GAINS!', bg: '#FFE45C', ink: '#172038', radius: '6px', pad: '8px 12px', rot: '5deg' },
      { label: '', ast: true, rot: '12deg', aria: 'an asterisk high five' },
      { label: 'PROUD!', bg: '#FF6FB0', ink: '#172038', radius: '14px', pad: '8px 14px', rot: '4deg' },
      { label: 'YUM!', bg: '#FF8A4C', ink: '#172038', radius: '999px', pad: '8px 14px', rot: '-4deg' },
      { label: 'STICK WITH IT!', bg: '#1F3FB0', ink: '#F6EFE1', radius: '8px', pad: '8px 10px', rot: '-3deg' }
    ];
    this.sent = {};
    this.tray = null;
    this.incoming = true;
    this.gift = false;
    this.toggles = [true];
    this.toast = '';
  }
  rerender() { this.setState({ n: Date.now() }); }
  send(ci) {
    const fi = this.tray;
    if (fi === null) return;
    this.sent[fi] = ci;
    const name = this.friendsData[fi].name;
    this.tray = null;
    this.toast = 'sent to ' + name;
    try { if (navigator.vibrate) navigator.vibrate(12); } catch (e) {}
    this.rerender();
    clearTimeout(this.tt);
    this.tt = setTimeout(() => { this.toast = ''; this.rerender(); }, 1600);
  }
  renderVals() {
    const friends = this.friendsData.map((f, i) => {
      const ci = this.sent[i];
      const c = ci !== undefined ? this.cheersData[ci] : null;
      const isAst = !!(c && c.ast);
      return Object.assign({}, f, {
        top: (212 + i * 116) + 'px',
        canSend: !c,
        sent: !!c,
        aria: 'Send ' + f.name + ' a sticker',
        sentLabel: c ? (isAst ? '✱ HIGH FIVE' : c.label) : '',
        sentBg: c ? (isAst ? '#FF6FB0' : c.bg) : '',
        sentInk: c ? (isAst ? '#172038' : c.ink) : '',
        sentRadius: c ? (isAst ? '999px' : c.radius) : '',
        sentPad: '6px 10px',
        sentRot: c ? c.rot : '0deg',
        open: () => { this.tray = i; this.rerender(); }
      });
    });
    const cheers = this.cheersData.map((c, ci) => ({
      label: c.label, bg: c.bg || '', ink: c.ink || '', radius: c.radius || '', pad: c.pad || '', rot: c.rot,
      isAst: !!c.ast, isText: !c.ast, aria: c.aria || c.label,
      send: () => this.send(ci)
    }));
    const tLabels = [["Friends' big wins", 'holo stickers and pins only']];
    const toggles = tLabels.map((t, i) => ({
      label: t[0], sub: t[1], on: this.toggles[i] ? 'true' : 'false',
      bg: this.toggles[i] ? '#C6FF4D' : '#E4DED2', knob: this.toggles[i] ? '25px' : '3px',
      flip: () => { this.toggles[i] = !this.toggles[i]; this.rerender(); }
    }));
    return {
      friends, cheers, toggles,
      locked: [{ label: 'FLAME ON', level: 12, rot: '4deg' }, { label: 'CHEF\'S KISS', level: 15, rot: '-5deg' }, { label: 'HOLO HYPE', level: 20, rot: '3deg' }].map(l => Object.assign(l, { aria: l.label + ', unlocks at level ' + l.level })),
      trayOpen: this.tray !== null,
      trayName: this.tray !== null ? this.friendsData[this.tray].name : '',
      closeTray: () => { this.tray = null; this.rerender(); },
      showIncoming: this.incoming && !this.gift,
      openIncoming: () => { this.gift = true; this.rerender(); clearTimeout(this.gt); this.gt = setTimeout(() => { this.gift = false; this.incoming = false; this.rerender(); }, 2600); },
      showGift: this.gift,
      keepGift: () => { clearTimeout(this.gt); this.gift = false; this.incoming = false; this.rerender(); },
      showToast: !!this.toast,
      toastText: this.toast
    };
  }
}
