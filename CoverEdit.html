      if (step === 'extra' && !used('hello')) { autoAdd('hello'); buzz(12); afterChange(); return; }
      const left = earned.filter((k) => !used(k)).slice(0, MAX - C.items.length);
      if (!left.length) { say('Everything you’ve earned is on your cover.'); buzz(4); return; }
      left.forEach((k, i) => setTimeout(() => { autoAdd(k); buzz(8); if (i === left.length - 1) { save(); paintTray(); say('Done. Move or turn anything you like.'); } }, reduce ? 0 : i * 140));
    });
    // demo helpers
    $('cv-demoLater').addEventListener('click', () => { earned = ['sticky', 'hello'].concat(EARNED); $('cv-tip').style.display = 'none'; paintTray(); say('A few weeks in: everything you’ve earned can go on.'); buzz(6); });
    $('cv-demoReset').addEventListener('click', () => { try { localStorage.removeItem('gsd.cover'); } catch (e) {} C = { title: false, items: [] }; first = true; earned = ['sticky']; $('cv-tip').style.display = 'none'; drawAll(); setEditing(true); setStep('title'); });

    drawAll(); setEditing(editing); if (!first) setEditing(false);
    this.S = { get C() { return C; }, get step() { return step; }, get editing() { return editing; } };
    return true;
  }
}
