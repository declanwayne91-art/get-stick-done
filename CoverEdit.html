    cover.addEventListener('pointerdown', (e) => { if (e.target === cover || e.target === layer) select(null); });

    // ---- tools (buttons do everything a gesture does)
    const tool = (id, f) => $(id).addEventListener('click', () => { if (!sel) return; f(sel); clampIn(sel); place(sel); save(); buzz(5); });
    tool('cv-left', (it) => { it.r = Math.round((it.r - 15) / 15) * 15; }); tool('cv-right', (it) => { it.r = Math.round((it.r + 15) / 15) * 15; });
    [['cv-up', 0, -12], ['cv-down', 0, 12], ['cv-west', -12, 0], ['cv-east', 12, 0]].forEach(([id, dx, dy]) => tool(id, (it) => { it.x += dx; it.y += dy; }));
    root.querySelectorAll('.cv-sz').forEach((b) => b.addEventListener('click', () => { if (!sel) return; sel.s = b.dataset.s; clampIn(sel); place(sel); slap(sel.el); save(); buzz(6);
      root.querySelectorAll('.cv-sz').forEach((x) => x.setAttribute('aria-pressed', x === b ? 'true' : 'false')); }));
    $('cv-remove').addEventListener('click', () => { if (!sel) return; const it = sel; select(null); it.el.remove(); C.items.splice(C.items.indexOf(it), 1); save(); paintTray(); buzz(8);
      if (it.k === 'sticky' && step === 'free' && !used('sticky')) { /* fine: it's back in the tray */ } });
    $('cv-ok').addEventListener('click', () => { select(null); buzz(4); });
    // one step at a time; the title plate counts as a layer, so a sticker can tuck behind it
    $('cv-fwd').addEventListener('click', () => { if (!sel) return; const i = C.items.indexOf(sel), nx = C.items[i + 1];
      if (sel.b && (!nx || !nx.b)) sel.b = false; else if (nx) { C.items[i] = nx; C.items[i + 1] = sel; } else return;
      restack(); save(); buzz(5); say(sel.b ? 'Moved forward, still behind your title.' : 'Brought forward.'); });
    $('cv-back').addEventListener('click', () => { if (!sel) return; const i = C.items.indexOf(sel), pv = C.items[i - 1];
      if (!sel.b && (!pv || pv.b)) sel.b = true; else if (pv) { C.items[i] = pv; C.items[i - 1] = sel; } else return;
      restack(); save(); buzz(5); say(sel.b ? 'Tucked behind your title.' : 'Sent back.'); });

    // ---- done / edit
    const setEditing = (on) => { editing = on; root.classList.toggle('cv-editing', on); select(null); paintPlate(); paintTray();
      $('cv-doneBtn').style.display = on ? 'block' : 'none'; $('cv-editBtn').style.display = on ? 'none' : 'block'; $('cv-head').textContent = on ? 'DECORATE YOUR COVER' : 'YOUR COVER';
      if (!on) { say(''); $('cv-tip').style.display = 'none'; } else setStep(C.title ? (used('sticky') ? 'free' : 'sticky') : 'title'); };
    $('cv-doneBtn').addEventListener('click', () => { if (!C.title) { say('Title first: drop it into the dashed spot.'); buzz(4); return; } save(); setEditing(false); buzz([8, 30, 12]); });
    $('cv-editBtn').addEventListener('click', () => { setEditing(true); buzz(6); });
    $('cv-tipX').addEventListener('click', () => { $('cv-tip').style.display = 'none'; });
    // ---- do it for me: whatever the current step is, done for you
    const SPOTS = [[168, 168, -6, 'L'], [66, 96, -14, 'M'], [276, 92, 12, 'M'], [58, 470, 10, 'M'], [282, 478, -12, 'M'], [170, 512, 4, 'S'], [168, 52, 6, 'S'],
                   [292, 214, 16, 'S'], [46, 218, -10, 'S'], [110, 438, -4, 'S'], [232, 440, 8, 'S'], [292, 560, -6, 'S'], [44, 556, 14, 'S'], [222, 36, -10, 'S']];
    const free = () => SPOTS.find((sp) => !C.items.some((it) => Math.hypot(it.x - sp[0], it.y - sp[1]) < 40)) || SPOTS[C.items.length % SPOTS.length];
    const autoAdd = (k) => { const [x, y, r, sz] = k === 'sticky' && !used('sticky') ? SPOTS[0] : free(); const it = { k, x, y, r, s: sz }; clampIn(it); C.items.push(it); layer.appendChild(itemEl(it)); slap(it.el); };;
    $('cv-forMe').addEventListener('click', () => {
      if (!editing) return;
      if (!C.title) { addAt('__title', null); return; }
      if (!used('sticky')) { autoAdd('sticky'); buzz(12); afterChange(); return; }
      const left = earned.filter((k) => !used(k)).slice(0, MAX - C.items.length);
      if (!left.length) { say('Everything you’ve earned is on your cover.'); buzz(4); return; }
      left.forEach((k, i) => setTimeout(() => { autoAdd(k); buzz(8); if (i === left.length - 1) { save(); paintTray(); say('Done. Move or turn anything you like.'); } }, reduce ? 0 : i * 140));
    });
    // demo helpers
    $('cv-demoLater').addEventListener('click', () => { earned = ['sticky'].concat(EARNED); $('cv-tip').style.display = 'none'; paintTray(); say('A few weeks in: everything you’ve earned can go on.'); buzz(6); });
    $('cv-demoReset').addEventListener('click', () => { try { localStorage.removeItem('gsd.cover'); } catch (e) {} C = { title: false, items: [] }; earned = ['sticky']; $('cv-tip').style.display = 'none'; drawAll(); setEditing(true); setStep('title'); });

    drawAll(); setEditing(editing); if (!first) setEditing(false);
    this.S = { get C() { return C; }, get step() { return step; }, get editing() { return editing; } };
    return true;
  }
}
