    const IMG = {"gochunoodles": "img/41da8aa05cdec12b.png", "smashtacos": "img/9e58f3cef6f6d821.png", "misosalmon": "img/9593865849332e2f.png", "chillirice": "img/ab9b233d347a5756.png", "holo1": "img/89a4460a0746ee9f.png", "holo2": "img/c36eb072276a4f83.png", "seal-asia": "img/f8b1f1c05892333a.png", "seal-world": "img/229cd4d5c0629c37.png", "drop": "img/09cb6ad40c81c99c.png", "wave": "img/da883ba416ba70be.png", "tick0": "img/64fcc8a6e0ab613f.png", "tick1": "img/00947742c45a2de4.png", "tick2": "img/4e1c134606504a79.png", "lvl2": "img/f09fb2b80aef799d.png", "lvl3": "img/9c8e8fb053fdc3c3.png", "curl": "img/7a5dc7f13526a7e5.png", "squat": "img/da6d9e48f332da36.png", "heart": "img/e3747c4508a68692.png", "day1": "img/00b130e00e0d2318.png", "sticky": "img/889081a3ab3a08ff.png"}, EARNED = ["gochunoodles", "smashtacos", "misosalmon", "chillirice", "holo1", "holo2", "seal-asia", "seal-world", "drop", "wave", "tick0", "tick1", "tick2", "lvl2", "lvl3", "curl", "squat", "heart", "day1"], ZONE = {"x": 30, "y": 254, "w": 284, "h": 150, "r": -3}, CW = 338, CH = 580, BASE = 120, SIZES = { S: 0.7, M: 1, L: 1.35 }, MAX = 14;
    const reduce = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } })();

    let name = 'MY STICKER BOOK'; try { const pf = JSON.parse(ls('gsd.profile', 'null')); if (pf && pf.bookName) name = pf.bookName.toUpperCase(); } catch (e) {}

    root.querySelectorAll('img[data-k]').forEach((im) => { im.src = IMG[im.dataset.k]; });

    // ---- state: {title, items:[{k,x,y,r,s}]}; first open = nothing saved = straight into edit mode, step 1
    let C = null; try { C = JSON.parse(ls('gsd.cover', 'null')); } catch (e) {}

    // ---- draw the cover
    const paintPlate = () => { plate.style.display = C.title ? 'flex' : 'none'; zone.style.display = C.title || !editing ? 'none' : 'flex'; };
    const itemEl = (it) => {

    // ---- layers: C.items is the stacking order, bottom to top; items with b sit behind the title plate (always first in the list)
    const restack = () => { C.items.sort((a, b) => (b.b ? 1 : 0) - (a.b ? 1 : 0)); C.items.forEach((it) => (it.b ? under : layer).appendChild(it.el)); paintLayerBtns(); };
    const paintLayerBtns = () => { if (!sel) return; const i = C.items.indexOf(sel), top = i === C.items.length - 1 && !sel.b, bottom = i === 0 && sel.b;
      $('cv-fwd').disabled = top; $('cv-back').disabled = bottom; $('cv-fwd').style.opacity = top ? 0.4 : 1; $('cv-back').style.opacity = bottom ? 0.4 : 1; };
    const drawAll = () => { layer.innerHTML = ''; under.innerHTML = ''; C.items.forEach((it) => itemEl(it)); restack(); paintPlate(); select(null); };

    // ---- the tray: what you can put on the cover; and the tools for whatever's selected

    const paintTray = () => {
      const list = $('cv-list'); let h = '';
      const titleFirst = editing && !C.title;
      // first time only: point at what to do next ("start here" for the title, then "drag me" for St*cky); tapping still works
      const stickyNext = editing && C.title && step === 'sticky' && !used('sticky');
      $('cv-trayHead').style.display = titleFirst || stickyNext ? 'none' : 'block'; $('cv-start').style.display = titleFirst || stickyNext ? 'flex' : 'none';
      $('cv-startT').textContent = titleFirst ? 'start here' : 'drag me'; $('cv-start').style.left = titleFirst ? '30px' : '24px';
      if (titleFirst) h += '<button type="button" class="cv-ti cv-plateT" data-k="__title" aria-label="Your title plate. Start here: drag it onto your cover, or tap to place it."><span class="mini">' + name + '</span></button>';
      // until the title is on, everything else waits its turn (dimmed, marked "next")
      earned.forEach((k) => { if (!used(k)) h += '<button type="button" class="cv-ti' + (titleFirst ? ' cv-wait' : '') + (stickyNext && k === 'sticky' ? ' cv-bob' : '') + '" data-k="' + k + '" aria-label="' + (titleFirst ? 'Sticker, after your title' : 'Sticker') + '"><img alt="" draggable="false" src="' + IMG[k] + '">' + (titleFirst ? '<span class="nx">next</span>' : '') + '</button>'; });
      if (earned.length <= 1) h += Array.from({ length: 3 }, () => '<span class="cv-ti cv-ghost" aria-hidden="true"></span>').join('');

    };
    const select = (it) => {
      if (sel && sel.el) sel.el.classList.remove('cv-sel'); sel = it;
      if (it) { it.el.classList.add('cv-sel'); paintLayerBtns();
        root.querySelectorAll('.cv-sz').forEach((b) => b.setAttribute('aria-pressed', b.dataset.s === it.s ? 'true' : 'false')); }

      else if (s === 'free') say(editing ? 'Drag stickers on, move them, turn them.' : '');

      if (t && t.animate && !reduce) t.animate([{ transform: 'rotate(0)' }, { transform: 'rotate(-6deg)' }, { transform: 'rotate(5deg)' }, { transform: 'rotate(-3deg)' }, { transform: 'rotate(0)' }], { duration: 420 }); };
    const startGhost = (k) => { ghost.innerHTML = k === '__title' ? '<span class="mini big">' + name + '</span>' : '<img alt="" src="' + IMG[k] + '">'; ghost.className = k === '__title' ? 'plateG' : ''; ghost.style.display = 'block'; };
    const moveGhost = (e) => { const [x, y] = toRoot(e); ghost.style.transform = 'translate(' + (x - 60) + 'px,' + (y - 60) + 'px) rotate(-4deg) scale(1.05)';
      if (step === 'title') { const [cx, cy] = toCover(e); const near = cx > ZONE.x - 40 && cx < ZONE.x + ZONE.w + 40 && cy > ZONE.y - 80 && cy < ZONE.y + ZONE.h + 80; zone.classList.toggle('hot', near); } };
    const endGhost = () => { ghost.style.display = 'none'; zone.classList.remove('hot'); };
    const addAt = (k, pt) => {
      if (k === '__title') {   // the title has one home: it always settles into its spot
        C.title = true; paintPlate(); slap(plate); buzz([10, 40, 14]); afterChange(); return; }
      if (step === 'title') { say('Title first: drop it into the dashed spot.'); buzz(4); return; }
      if (C.items.length >= MAX) { say('Your cover is full. Take one off to add another.'); return; }
      const it = { k, x: pt ? pt[0] : CW / 2, y: pt ? pt[1] : 150, r: Math.round(Math.random() * 16 - 8), s: 'M' }; clampIn(it);

      if (!on) { say(''); $('cv-tip').style.display = 'none'; } else setStep(C.title ? (used('sticky') ? 'free' : 'sticky') : 'title'); };
    $('cv-doneBtn').addEventListener('click', () => { if (!C.title) { say('Title first: drop it into the dashed spot.'); buzz(4); return; } save(); setEditing(false); buzz([8, 30, 12]); });

    $('cv-tipX').addEventListener('click', () => { $('cv-tip').style.display = 'none'; });
    // ---- do it for me: whatever the current step is, done for you

                   [292, 214, 16, 'S'], [46, 218, -10, 'S'], [110, 438, -4, 'S'], [232, 440, 8, 'S'], [292, 560, -6, 'S'], [44, 556, 14, 'S'], [222, 36, -10, 'S']];

  }
