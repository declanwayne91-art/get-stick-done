      const grp = $('ml-dumpT').value.trim().slice(0, 24); xs.forEach((x) => { const t = GST.make(x); if (grp) t.group = grp; L.push(t); }); save(); sheetClose('ml-dump'); buzz([8, 30, 8]); paint(); toast(xs.length + (xs.length === 1 ? ' THING ADDED' : ' THINGS ADDED'), ''); });

    // ---- tap a task: its sheet
    let cur = null;
    const paintSheet = () => { const t = cur; if (!t) return;
      $('ml-sT').textContent = t.t;
      const pb = $('ml-sPin'); pb.innerHTML = pinSvg(t.pin) + '<span>' + (t.pin ? 'PINNED TO TODAY' : 'PIN TO TODAY') + '</span>'; pb.setAttribute('aria-pressed', t.pin ? 'true' : 'false'); pb.classList.toggle('on', !!t.pin);
      root.querySelectorAll('.ml-size').forEach((b) => { const on = (t.size || '') === b.dataset.size; b.classList.toggle('on', on); b.setAttribute('aria-checked', on ? 'true' : 'false'); });
      const hs = [...new Set(L.filter((x) => x.group && !x.done).map((x) => x.group).concat(t.group ? [t.group] : []))], gb = $('ml-sGrp'); gb.innerHTML = ''; $('ml-sGrpW').style.display = hs.length ? 'flex' : 'none';
      [null].concat(hs).forEach((h) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'bri' + ((t.group || null) === h ? ' on' : ''); b.setAttribute('role', 'radio'); b.setAttribute('aria-checked', (t.group || null) === h ? 'true' : 'false');
        b.textContent = h ? h.toUpperCase() : 'UP NEXT'; b.addEventListener('click', () => { if (h) t.group = h; else delete t.group; GST.touch(t); save(); buzz(6); paintSheet(); paint(); }); gb.appendChild(b); });
      const st = t.steps || [], dn = st.filter((x) => x.done).length; $('ml-sStepsN').textContent = st.length ? dn + ' of ' + st.length + ' done' : '';
      const box = $('ml-sSteps'); box.innerHTML = '';
      st.forEach((x, i) => { const r = document.createElement('div'); r.className = 'ml-step' + (x.done ? ' ml-isdone' : '');
        r.innerHTML = '<button type="button" class="ml-tk">' + tickSvg(x.done, true) + '</button><span class="t"></span><button type="button" class="ml-sx">×</button>'; r.querySelector('.t').textContent = x.t;
        r.querySelector('.ml-tk').setAttribute('aria-label', (x.done ? 'Untick ' : 'Tick ') + x.t); r.querySelector('.ml-sx').setAttribute('aria-label', 'Remove step: ' + x.t);
        r.querySelector('.ml-tk').addEventListener('click', () => { x.done = !x.done; GST.touch(t); save(); buzz(x.done ? 8 : 4); paintSheet(); paint(); });
        r.querySelector('.ml-sx').addEventListener('click', () => { st.splice(i, 1); if (!st.length) { t.lib = null; } GST.touch(t); save(); paintSheet(); paint(); });
        box.appendChild(r); });
      const k = t.lib || GST.match(t.t); $('ml-sLib').style.display = !st.length && k && !t.care ? 'flex' : 'none';
      $('ml-sStuck').style.display = t.lib ? 'flex' : 'none';
      if (t.lib) { $('ml-stA').textContent = 'A BIT · ' + GST.libLen(t.lib, false) + ' STEPS'; $('ml-stB').textContent = 'VERY · ' + GST.libLen(t.lib, true) + ' STEPS';
        $('ml-stA').classList.toggle('on', !t.long); $('ml-stB').classList.toggle('on', !!t.long); $('ml-stA').setAttribute('aria-checked', t.long ? 'false' : 'true'); $('ml-stB').setAttribute('aria-checked', t.long ? 'true' : 'false'); }
    };
    const openSheet = (t) => { cur = t; paintSheet(); sheetOpen('ml-task'); buzz(5); };
    $('ml-taskX').addEventListener('click', () => sheetClose('ml-task'));
    $('ml-task').addEventListener('click', (e) => { if (e.target === $('ml-task')) sheetClose('ml-task'); });
    $('ml-dump').addEventListener('click', (e) => { if (e.target === $('ml-dump')) sheetClose('ml-dump'); });
    $('ml-sPin').addEventListener('click', () => { if (togglePin(cur)) paintSheet(); });
    root.querySelectorAll('.ml-size').forEach((b) => b.addEventListener('click', () => { cur.size = cur.size === b.dataset.size ? '' : b.dataset.size; GST.touch(cur); save(); buzz(6); paintSheet(); paint(); }));
    $('ml-sLib').addEventListener('click', () => { GST.useLib(cur, cur.lib || GST.match(cur.t), false); save(); buzz(8); paintSheet(); paint(); });
    $('ml-stA').addEventListener('click', () => { GST.useLib(cur, cur.lib, false); save(); buzz(6); paintSheet(); paint(); });
    $('ml-stB').addEventListener('click', () => { GST.useLib(cur, cur.lib, true); save(); buzz(6); paintSheet(); paint(); });
    $('ml-sAdd').addEventListener('submit', (e) => { e.preventDefault(); const v = $('ml-sAddIn').value.trim(); if (!v) return; (cur.steps = cur.steps || []).push({ t: v.slice(0, 60), done: false, s: 0 }); GST.touch(cur); save(); $('ml-sAddIn').value = ''; buzz(6); paintSheet(); paint(); $('ml-sAddIn').focus(); });
    $('ml-sLater').addEventListener('click', () => { cur.shelf = true; cur.shelfAt = Date.now(); cur.pin = false; save(); sheetClose('ml-task'); buzz(6); paint(); });
    $('ml-sFocus').addEventListener('click', () => { sheetClose('ml-task'); openFocus(cur); });
    $('ml-sDel').addEventListener('click', () => { const i = L.indexOf(cur); if (i >= 0) L.splice(i, 1); save(); sheetClose('ml-task'); buzz([6, 30, 6]); paint(); });

    // ---- focus: one step at a time
    let ft = null, tmr = 0, left = 0;
    const stopT = () => { clearInterval(tmr); tmr = 0; };
    const mmss = (s) => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
    const paintFocus = () => { const t = ft, st = t.steps || [], i = st.findIndex((x) => !x.done), n = st.length;
      $('ml-fTask').textContent = t.t;
      $('ml-fN').textContent = n ? 'STEP ' + (i < 0 ? n : i + 1) + ' OF ' + n : '';
      $('ml-fN').style.display = n ? 'block' : 'none';
      $('ml-fBar').innerHTML = st.map((x, k) => '<span style="background:' + (x.done ? '#C6FF4D' : k === i ? '#FF6FB0' : '#FFFFFF') + '"></span>').join('');
      const now = n ? (i < 0 ? st[n - 1] : st[i]) : { t: t.t };
      $('ml-fStep').textContent = now.t; stopT(); left = now.s || 0;
      $('ml-fTimer').style.display = left ? 'inline-flex' : 'none'; $('ml-fTimer').textContent = '⏱ ' + mmss(left); $('ml-fTimer').setAttribute('aria-label', 'Start a ' + mmss(left) + ' timer');
      $('ml-fTimerL').style.display = left ? 'inline' : 'none';
      const up = n && i >= 0 ? st.slice(i + 1, i + 4) : []; $('ml-fNext').style.display = up.length ? 'flex' : 'none';
      $('ml-fNextL').innerHTML = ''; up.forEach((x, k) => { const s = document.createElement('span'); s.textContent = (i + 2 + k) + ' · ' + x.t; $('ml-fNextL').appendChild(s); });
      $('ml-fStuck').style.display = t.lib ? 'flex' : 'none';
      if (t.lib) { $('ml-fA').textContent = 'A BIT · ' + GST.libLen(t.lib, false) + ' STEPS'; $('ml-fB').textContent = 'VERY · ' + GST.libLen(t.lib, true) + ' STEPS'; $('ml-fA').classList.toggle('on', !t.long); $('ml-fB').classList.toggle('on', !!t.long);
        $('ml-fA').setAttribute('aria-checked', t.long ? 'false' : 'true'); $('ml-fB').setAttribute('aria-checked', t.long ? 'true' : 'false'); }
      const last = !n || i === n - 1 || i < 0; $('ml-fGo').textContent = last ? 'DONE, TICK IT OFF →' : 'DONE, NEXT STEP →';
      $('ml-fSkip').style.display = last ? 'none' : 'inline-block';
      const card = $('ml-fCard'); if (card.animate && !reduce) card.animate([{ transform: 'translateX(30px) rotate(-1.2deg)', opacity: 0 }, { transform: 'rotate(-1.2deg)', opacity: 1 }], { duration: 260, easing: 'cubic-bezier(.2,.9,.3,1)' }); };
    // a shared task you've called (it shows in MINE): BREAK IT DOWN works on the shared item. The steps are yours (saved on this phone by item id), the tick is shared
    const SSK = 'gsd.sharedSteps', sAll = () => { try { return JSON.parse(localStorage.getItem(SSK) || '{}') || {}; } catch (e) { return {}; } };
    const sStep = (x) => { const v = sAll()[x.id]; return v && v.steps && v.steps.length ? v : null; };
    const openShared = (SL, x) => { const v = sStep(x) || {}; openFocus({ id: 's:' + x.id, t: x.t, steps: v.steps, lib: v.lib, long: v.long, done: !!x.done, sharedRef: { SL, x } }); };
    const fsave = () => { if (ft && ft.sharedRef) { const A = sAll(); A[ft.sharedRef.x.id] = { steps: ft.steps || [], lib: ft.lib, long: !!ft.long }; try { localStorage.setItem(SSK, JSON.stringify(A)); } catch (e) {} } else save(); };
    const openFocus = (t) => { ft = t; if ((!t.steps || !t.steps.length) && !t.care) { const k = GST.match(t.t); if (k) { GST.useLib(t, k, false); fsave(); } } $('ml-focus').style.display = 'block'; paintFocus(); buzz(8); };
    const closeFocus = () => { stopT(); $('ml-focus').style.display = 'none'; ft = null; paint(); };
    $('ml-fBack').addEventListener('click', closeFocus);
    $('ml-fTimer').addEventListener('click', () => { if (tmr) { stopT(); $('ml-fTimer').textContent = '⏱ ' + mmss(left); return; } buzz(6);
      tmr = setInterval(() => { left = Math.max(0, left - 1); $('ml-fTimer').textContent = '⏱ ' + mmss(left); if (!left) { stopT(); buzz([20, 60, 20, 60, 20]); pop($('ml-fTimer')); } }, 1000); });
    $('ml-fA').addEventListener('click', () => { GST.useLib(ft, ft.lib, false); fsave(); buzz(6); paintFocus(); });
    $('ml-fB').addEventListener('click', () => { GST.useLib(ft, ft.lib, true); fsave(); buzz(6); paintFocus(); });
    $('ml-fSkip').addEventListener('click', () => { const st = ft.steps || [], i = st.findIndex((x) => !x.done); if (i < 0 || i === st.length - 1) return; st.push(st.splice(i, 1)[0]); GST.touch(ft); fsave(); buzz(4); paintFocus(); });
    $('ml-fGo').addEventListener('click', () => { const st = ft.steps || [], i = st.findIndex((x) => !x.done);
      if (st.length && i >= 0 && i < st.length - 1) { st[i].done = true; GST.touch(ft); fsave(); buzz(10); paintFocus(); return; }
      if (st.length && i >= 0) st[i].done = true;
      if (ft.sharedRef) { fsave(); if (!ft.sharedRef.x.done) sharedTick(ft.sharedRef.SL, ft.sharedRef.x); } else if (!ft.done) tick(ft); else save(); pop($('ml-fGo')); setTimeout(closeFocus, 350); });

    // ---- MAYBE ONE DAY: the weekly tidy. Keep, bin or do, one card at a time (swipe left to bin, right to keep)
    let tq2 = [];
    const paintTidy = () => { const t = tq2[0]; if (!t) { $('ml-tidy').style.display = 'none'; paint(); return; }
      const all = L.filter((x) => x.shelf && !x.done).length + 0, k = tqTotal - tq2.length + 1;
      $('ml-tdN').textContent = k + ' OF ' + tqTotal; $('ml-tdT').textContent = t.t;
      const d = Math.max(1, Math.round((Date.now() - (t.at || Date.now())) / 864e5)); $('ml-tdAge').textContent = 'added ' + d + (d === 1 ? ' day ago' : ' days ago');
      const c = $('ml-tdCard'); c.style.transform = 'rotate(1deg)'; c.style.opacity = 1; };
    let tqTotal = 0;
    const openTidy = () => { tq2 = L.filter((x) => x.shelf && !x.done); tqTotal = tq2.length; if (!tqTotal) return;
      $('ml-tdIntro').textContent = tqTotal + (tqTotal === 1 ? ' thing hasn’t' : ' things haven’t') + ' been touched for a week, so ' + (tqTotal === 1 ? 'it' : 'they') + ' moved off your list. Keep, bin or do: 2 minutes, tops.';
      $('ml-tidy').style.display = 'block'; paintTidy(); buzz(6); };
    const decide = (how) => { const t = tq2[0]; if (!t) return; const c = $('ml-tdCard');
      if (how === 'bin') { L.splice(L.indexOf(t), 1); }
      else { t.shelf = false; GST.touch(t); if (how === 'do') { if (GST.pins(L) < 3) t.pin = true; else { L.splice(L.indexOf(t), 1); L.unshift(t); } } }
      save(); buzz(how === 'bin' ? [6, 30, 6] : 8);
      const dx = how === 'bin' ? -420 : 420;
      if (c.animate && !reduce) c.animate([{ transform: c.style.transform, opacity: 1 }, { transform: 'translateX(' + dx + 'px) rotate(' + (dx > 0 ? 18 : -18) + 'deg)', opacity: 0 }], { duration: 260, easing: 'ease-in' });
      setTimeout(() => { tq2.shift(); if (!tq2.length) { try { localStorage.setItem('gsd.tidyAt', String(Date.now())); } catch (e) {} } paintTidy(); }, reduce ? 0 : 240); };
    $('ml-tdBin').addEventListener('click', () => decide('bin'));
    $('ml-tdKeep').addEventListener('click', () => decide('keep'));
    $('ml-tdDo').addEventListener('click', () => decide('do'));
    $('ml-tdX').addEventListener('click', () => { $('ml-tidy').style.display = 'none'; paint(); });
    (() => { const c = $('ml-tdCard'); let x0 = null; const k = () => root.getBoundingClientRect().width / 390;
      c.addEventListener('pointerdown', (e) => { x0 = e.clientX; c.setPointerCapture(e.pointerId); });
      c.addEventListener('pointermove', (e) => { if (x0 === null) return; const dx = (e.clientX - x0) / k(); c.style.transform = 'translateX(' + dx + 'px) rotate(' + (1 + dx / 20) + 'deg)'; });
      const end = (e) => { if (x0 === null) return; const dx = (e.clientX - x0) / k(); x0 = null; if (dx < -90) decide('bin'); else if (dx > 90) decide('keep'); else c.style.transform = 'rotate(1deg)'; };
      c.addEventListener('pointerup', end); c.addEventListener('pointercancel', end); })();

    // back from Today (or the list changed in another tab)
    const reload = () => { if ($('ml-focus').style.display === 'block' || $('ml-tidy').style.display === 'block') return; L = GST.load(); paint(); };
    addEventListener('pageshow', (e) => { if (e.persisted) reload(); });
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reload(); });
    paint(); sync();
    const h = location.hash; if (/^#focus=s:/.test(h)) { const iid = h.slice(9); const SL = GST.shared().lists.find((z) => z.items.some((y) => y.id === iid)); if (SL) openShared(SL, SL.items.find((y) => y.id === iid)); }
    else if (/^#focus=/.test(h)) { const t = L.find((x) => x.id === h.slice(7)); if (t) openFocus(t); } else if (h === '#tidy') openTidy();
    return true;
  }
}
