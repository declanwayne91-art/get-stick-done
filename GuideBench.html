    <button type="button" class="ctl press" onClick="{{toggle}}" aria-label="{{playAria}}" style="background: #C6FF4D; font-size: 18px; transform: rotate(5deg)">{{playLabel}}</button>
    <button type="button" class="ctl press" onClick="{{next}}" aria-label="Next step" style="background: #FFFFFF; font-size: 26px; transform: rotate(-3deg)">›</button>
  </div>

<script type="text/x-dc-logic" id="dc-logic">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.timers = [];
  }
  later(fn, ms) { this.timers.push(setTimeout(fn, ms)); }
  componentWillUnmount() { clearInterval(this.loop); this.timers.forEach((t) => clearTimeout(t)); }
  tap() { try { if (navigator && navigator.vibrate) navigator.vibrate(12); } catch (e) {} }
  renderVals() {
    const st = this.state || {};
    const i = st.i || 0;
    const playing = !!st.playing;
    const done = st.done || [false, false, false];
    const stage = st.stage || 'none';
    const count = st.count == null ? 7 : st.count;
    const frames = [
      { cue: "lie back, bar over your chest", alt: "St*cky on the bench, bar up" },
      { cue: "lower the bar to mid-chest", alt: "St*cky lowering the bar" },
      { cue: "touch lightly, elbows tucked", alt: "St*cky with the bar at the chest" },
      { cue: "press it back up", alt: "St*cky pressing the bar up" }
    ];
    const f = frames[i];
    const go = (n) => this.setState({ i: (n + 4) % 4 });
    const toggle = () => {
      clearInterval(this.loop);
      if (playing) { this.setState({ playing: false }); return; }
      this.loop = setInterval(() => {
        const cur = (this.state && this.state.i) || 0;
        this.setState({ i: (cur + 1) % 4 });
      }, 1500);
      this.setState({ playing: true });
    };
    const collect = () => {
      const cur = this.state || {};
      if (cur.stage !== 'landed') return;
      this.tap();
      this.setState({ stage: 'fly' });
      this.later(() => this.setState({ stage: 'stored', count: ((this.state && this.state.count) == null ? 7 : this.state.count) + 1, bump: true }), 420);
      this.later(() => this.setState({ bump: false }), 620);
    };
    const toggleSet = (n) => {
      const cur = this.state || {};
      const next = (cur.done || [false, false, false]).slice();
      next[n] = !next[n]; try { localStorage.setItem('gsd.seenSetHint', '1'); } catch (e) {}
      if (next[n]) this.tap();
      this.setState({ done: next });
      if (next.every(Boolean) && (cur.stage || 'none') === 'none') {
        this.later(() => this.setState({ stage: 'drop' }), 380);
        this.later(() => this.setState({ stage: 'landed' }), 420);
      }
    };
    const transforms = { drop: 'scale(1.6) rotate(-22deg)', landed: 'scale(1) rotate(-6deg)', fly: 'translate(157px, -372px) scale(0.12) rotate(30deg)' };
    const transitions = { drop: 'none', landed: 'transform 0.3s cubic-bezier(.3,1.6,.5,1), opacity 0.15s ease', fly: 'transform 0.42s cubic-bezier(.55,0,.75,.35), opacity 0.42s ease-in' };
    const seenHint = (() => { try { return localStorage.getItem('gsd.seenSetHint') === '1'; } catch (e) { return false; } })();
    return {
      wToday: (() => { try { const v = JSON.parse(localStorage.getItem('gsd.weights') || '{}')["BENCH PRESS"]; return v != null ? v + ' kg' : 'your weight'; } catch (e) { return 'your weight'; } })(),
      setHint: !seenHint && !done.some(Boolean),
      count,
      bookTransform: st.bump ? 'scale(1.25)' : 'scale(1)',
      cue: f.cue, f0: i === 0, f1: i === 1, f2: i === 2, f3: i === 3,
      stepNo: i + 1,
      playLabel: playing ? 'PAUSE' : 'PLAY',
      playAria: playing ? 'Pause the flipbook' : 'Play the flipbook',
      toggle,
      prev: () => go(i - 1),
      next: () => go(i + 1),
      sets: [0, 1, 2].map((n) => ({
        toggle: () => toggleSet(n),
        pressed: done[n] ? 'true' : 'false',
        aria: 'Set ' + (n + 1) + (done[n] ? ', done' : ', not done'),
        fill: done[n] ? '#C6FF4D' : '#FFFFFF',
        rot: (n === 1 ? 5 : -6) + 'deg',
        top: 'SET',
        mid: done[n] ? '✓' : String(n + 1),
        bottom: "\u00d7 8"
      })),
      showSlap: stage === 'drop' || stage === 'landed' || stage === 'fly',
      slapTransform: transforms[stage] || 'none',
      slapOpacity: stage === 'drop' ? 0 : stage === 'fly' ? 0.2 : 1,
      slapTransition: transitions[stage] || 'none',
      collect
    };
  }
}
