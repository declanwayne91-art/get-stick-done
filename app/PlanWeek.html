<sc-if value="{{isShop}}" hint-placeholder-val="{{ false }}">
  <div style="position: absolute; left: 16px; right: 16px; top: 18px; bottom: 16px; display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <span class="title-die bri" style="font-size: 34px; text-shadow: 3px 3px 0 #FF6FB0; transform: rotate(-2deg); transform-origin: left; white-space: nowrap">SHOPPING LIST</span>
      <button type="button" class="press kal" onClick="{{toPlan}}" style="padding: 4px 12px; border-radius: 999px; border: 2.5px solid #172038; background: #FFFFFF; color: #172038; font-size: 15px; white-space: nowrap">← plan</button>
    </div>
    <span class="kal" style="font-size: 16px">{{shopSub}}</span>
    <button type="button" class="press bri" onClick="{{pinShop}}" aria-pressed="{{shopPinned}}" style="height: 44px; border-radius: 14px; border: 2.5px solid #172038; background: {{pinBg}}; color: #172038; font-size: 16px; display: {{pinShow}}; align-items: center; justify-content: center; gap: 8px"><svg width="16" height="20" viewBox="0 0 34 40" aria-hidden="true"><g transform="rotate(-22 17 20)"><path d="M17 24 V37" stroke="#172038" stroke-width="3"></path><path d="M12 9 L13.5 17 H20.5 L22 9 Z M7 19.5 a10 3.6 0 1 0 20 0 a10 3.6 0 1 0 -20 0 M9 3 h16 v6 h-16 Z" fill="#FF6FB0" stroke="#172038" stroke-width="2.4" stroke-linejoin="round"></path></g></svg>{{pinText}}</button>
    <div style="flex: 1; min-height: 0; overflow-y: auto; background: #FFFFFF; padding: 0 14px 10px 46px; box-shadow: 0 6px 10px -6px rgba(60,40,20,0.4); background-image: linear-gradient(90deg, transparent 32px, #F4A9A0 32px, #F4A9A0 34px, transparent 34px)">
      <form id="pw-xform" class="xadd" autocomplete="off"><span class="pl" aria-hidden="true">+</span><input id="pw-xin" type="text" maxlength="40" enterkeyhint="done" placeholder="{{xPh}}" aria-label="Add something to the shopping list"><button type="submit" class="bri" aria-label="Add to the shopping list">ADD</button></form>
      <sc-if value="{{hasX}}" hint-placeholder-val="{{ false }}">
        <div class="aisle bri">{{xHead}}</div>
        <sc-for list="{{xitems}}" as="it" hint-placeholder-count="2">
          <div class="xrow">
            <button type="button" class="item" onClick="{{it.toggle}}" role="checkbox" aria-checked="{{it.checked}}">
              <span class="box" style="background: {{it.box}}">{{it.tick}}</span>
              <span class="kal" style="font-size: 17px; color: #172038; text-decoration: {{it.strike}}; opacity: {{it.op}}">{{it.text}}</span>
            </button>
            <button type="button" class="x" onClick="{{it.del}}" aria-label="{{it.delAria}}">×</button>
          </div>
        </sc-for>
      </sc-if>
      <sc-for list="{{groups}}" as="gr" hint-placeholder-count="5">
        <div class="aisle bri">{{gr.label}}</div>
        <sc-for list="{{gr.items}}" as="it" hint-placeholder-count="4">
          <button type="button" class="item" onClick="{{it.toggle}}" role="checkbox" aria-checked="{{it.checked}}">
            <span class="box" style="background: {{it.box}}">{{it.tick}}</span>
            <span class="kal" style="font-size: 17px; color: #172038; text-decoration: {{it.strike}}; opacity: {{it.op}}">{{it.text}}</span>
            <span style="margin-left: auto; font-size: 11px; font-weight: 700; opacity: 0.6; white-space: nowrap">{{it.days}}</span>
          </button>
        </sc-for>
      </sc-for>
      <sc-if value="{{hasCup}}" hint-placeholder-val="{{ true }}">
        <div class="aisle bri">CUPBOARD CHECK</div>
        <span class="kal" style="display: block; font-size: 15px; line-height: 1.3; padding-top: 4px; opacity: 0.85">{{cupText}}</span>
      </sc-if>

      </sc-if>
    </div>
    <sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
      <button type="button" class="bri slap press" onClick="{{sorted}}" aria-label="Shop sorted! Close the shopping list" style="position: absolute; right: 6px; bottom: 30px; padding: 10px 16px; background: #FF6FB0; color: #172038; border: 3px solid #FFFFFF; box-shadow: 0 0 0 2.5px #172038, 4px 5px 0 2px #C6FF4D; border-radius: 16px; font-size: 30px; transform: rotate(-6deg); cursor: pointer">SHOP SORTED!</button>
    </sc-if>
  </div>
</sc-if>
</div>
</script>
