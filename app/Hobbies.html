      pick('hb-pw', () => when, (v) => { when = v; note.textContent = when === 'year' ? 'Read this year, so it counts: a stamp and stickers.' : when ? 'Goes on your shelf. Stickers are for books from this year.' : ''; });
      sv.addEventListener('click', () => { const tt = t.value.trim().replace(/\s+/g, ' ').slice(0, 80), by = a.value.trim().slice(0, 60); if (!tt) { t.focus(); return; } if (!when) { buzz(12); note.textContent = 'Pick roughly when you read it.'; return; }
        if (when === 'year') { const r = GSP.hobFinish('read', { t: tt, by, kind }, { added: 1 }); render(); const st = GSP.hobStamps('read').filter((x) => x.book), it = st[st.length - 1];
          reveal(it, W.youDid + ' <b>' + esc(tt) + '</b>.<br>That’s ' + (r.n === 1 ? W.first : W.nth + r.n + '.'), W.postSub); setTimeout(() => won(r), 1600); return; }
        const h2 = load(); h2.read.past = (h2.read.past || []).concat([{ t: tt, by, kind, when, added: Date.now() }]).slice(-500); save(h2); close(); buzz([10, 30, 16]); render(); say('On your shelf'); });
      setTimeout(() => { try { t.focus(); } catch (e) {} }, 300); };
    root.addEventListener('click', (e) => { if (e.target.closest('[data-libadd]') && S.v === 'shelf') libAdd(); });
    root.addEventListener('click', (e) => { const g = e.target.closest('[data-lib]'); if (!g || S.v !== 'shelf') return; libCard(S.lib, +g.dataset.lib); });

    // ---------------- first-visit tour (gsd.seenHobbyTips): taped cards like Profile's; the (i) replays it
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const tips = document.getElementById('hb-tips'), tcards = [...tips.querySelectorAll('.hb-tipc')], tdots = [...tips.querySelectorAll('.hb-tipdot')], tnext = document.getElementById('hb-tipNext');
    tips.querySelectorAll('img[data-st]').forEach((im) => { im.src = IMG[im.dataset.st]; });
    let ti = 0;
    const showTip = (i, dir) => { tcards.forEach((c, k) => { const rot = 'rotate(' + c.dataset.rot + 'deg)';
        if (k === i) { c.style.display = 'flex'; c.style.opacity = 0; c.style.transform = 'translateX(' + (reduce ? 0 : 40 * dir) + 'px) ' + rot; requestAnimationFrame(() => requestAnimationFrame(() => { c.style.opacity = 1; c.style.transform = 'translateX(0) ' + rot; })); }
        else c.style.display = 'none'; });
      tdots.forEach((d, k) => { d.style.width = k === i ? '26px' : '10px'; d.style.background = k <= i ? '#FF6FB0' : 'transparent'; });
      tnext.textContent = i === tcards.length - 1 ? 'GOT IT' : 'NEXT →'; };
    const openTips = () => { close(); ti = 0; tips.style.display = 'block'; requestAnimationFrame(() => { tips.style.opacity = 1; }); showTip(0, 1); buzz(6); };
    const closeTips = () => { tips.style.opacity = 0; setTimeout(() => { tips.style.display = 'none'; }, 220); try { localStorage.setItem('gsb.seenHobbyTips', '1'); } catch (e) {} buzz(6); };
    tnext.addEventListener('click', () => { if (ti < tcards.length - 1) { ti++; showTip(ti, 1); buzz(4); } else closeTips(); });
    document.getElementById('hb-tipSkip').addEventListener('click', closeTips);
    let tsx = null; tips.addEventListener('pointerdown', (e) => { tsx = e.clientX; });
    tips.addEventListener('pointerup', (e) => { if (tsx === null) return; const dx = e.clientX - tsx; tsx = null; if (dx < -50 && ti < tcards.length - 1) { ti++; showTip(ti, 1); } else if (dx > 50 && ti > 0) { ti--; showTip(ti, -1); } });
    root.addEventListener('click', (e) => { const b = e.target.closest('[data-act]'); if (!b || b.disabled) return; const a = b.dataset.act;
      if (a === 'go') go(b.dataset.v, b.dataset.s);
      else if (a === 'back') { if (document.referrer && history.length > 1 && !load().picked.length) history.back(); else go(load().picked.length ? 'hub' : 'pick'); }
      else if (a === 'pickT') { const id = b.dataset.h, h = load(); if (h.picked.indexOf(id) >= 0 && !(id in S.pick)) S.pick[id] = true; S.pick[id] = !S.pick[id]; buzz(6); render(); }
      else if (a === 'pickGo') { const h = load(); Object.keys(S.pick).forEach((id) => { const i = h.picked.indexOf(id); if (S.pick[id] && i < 0) h.picked.push(id); if (!S.pick[id] && i >= 0) { h.picked.splice(i, 1); h.pins = h.pins.filter((x) => x !== id); } });
        if (!h.picked.length) { say('Pick a hobby first'); return; } save(h); S.pick = {}; buzz([10, 40, 16]); go(h.picked.length === 1 ? h.picked[0] : 'hub'); }
      else if (a === 'open') go(isHob(b.dataset.h) ? b.dataset.h : 'hub');
      else if (a === 'star') pinToggle(b.dataset.h);
      else if (a === 'help') openTips();
      else if (a === 'book') bookSheet();
      else if (a === 'finish') finishSheet();
      else if (a === 'remove') { const hb = S.v, W = HC[hb]; if (!isHob(hb)) return;
        const sh = sheet('<span class="bri" style="display:block;font-size:30px;margin-top:6px">REMOVE ' + W.name + '?</span>'
          + '<span class="kal" style="display:block;font-size:17px;line-height:1.25;margin-top:8px">It comes off your hobbies and off Today. Your stickers and stamps stay in your book, and if you add it back later, everything’s still there.</span>'
          + '<button type="button" id="hb-rmYes" class="hb-puff bri" style="width:100%;height:56px;margin-top:18px;background:#FFFFFF">YES, REMOVE IT</button>'
          + '<button type="button" class="hb-link kal" data-close="1" style="display:block;margin:12px auto 0">keep it</button>');
        sh.querySelector('[data-close]').addEventListener('click', close);
        sh.querySelector('#hb-rmYes').addEventListener('click', () => { const h = load(); h.picked = h.picked.filter((x) => x !== hb); h.pins = h.pins.filter((x) => x !== hb); save(h); close(); buzz(8);
          setTimeout(() => { go(h.picked.length ? 'hub' : 'pick'); say(W.name.charAt(0) + W.name.slice(1).toLowerCase() + ' removed. Add it back any time'); }, 300); }); }
      else if (a === 'readToday') { const hb = isHob(S.v) ? S.v : 'read'; if (GSP.hobToday(hb)) { GSP.hobUnread(hb); buzz(6); say('Unticked for today'); render(); return; }
        const logIt = (x) => { const r = GSP.hobRead(hb, x); buzz([10, 40, 16]); render(); if (r.fresh && r.fresh.length) won(r); else say(GSP.hobWeek(hb).filter(Boolean).length + ' this week. Nice one!'); };
        if (!HC[hb].whoQ) { logIt(); return; }
        const sh = sheet('<span class="bri" style="display:block;font-size:30px;margin-top:6px">' + HC[hb].whoQ + '</span><div style="display:flex;flex-wrap:wrap;margin-top:14px">'
          + WHO.map((w) => '<button type="button" class="hb-kind kal" data-w="' + w[0] + '" style="height:44px;font-size:17px">' + esc(w[1]) + '</button>').join('') + '</div>'
          + '<button type="button" class="hb-link kal" data-close="1" style="display:block;margin:6px auto 0">cancel</button>');
        sh.querySelector('[data-close]').addEventListener('click', close);
        sh.querySelectorAll('[data-w]').forEach((b2) => b2.addEventListener('click', () => { close(); logIt({ who: b2.dataset.w }); })); }
      else if (a === 'night') nightSheet();
      else if (a === 'nightAns') { const n = nLoad().find((x) => x.mid === b.dataset.mid && x.host !== 1); if (n) nightCard(n); }
      else if (a === 'step') { const k = +b.dataset.k; S.steps[k] = !S.steps[k]; buzz(6); render(); }
      else if (a === 'tryAgain') { S.tryId = pickTry(S.tryId); S.steps = {}; buzz([6, 30, 6]); render(); }
      else if (a === 'trySkip') { const h = load(); if (h.skip.indexOf(S.tryId) < 0) h.skip.push(S.tryId); save(h); S.tryId = pickTry(S.tryId); S.steps = {}; say('Fair enough. Here’s another'); render(); }
      else if (a === 'tryPick') { S.tryH = b.dataset.h; S.tryId = b.dataset.id; S.steps = {}; render(); view.scrollTop = 0; }
      else if (a === 'tryDone') { const t = TRIES[S.tryH].find((x) => x[0] === S.tryId), r = GSP.hobTry(S.tryH, S.tryId); if (r.dup) return; S.steps = {}; render();
        const st = GSP.hobStamps(S.tryH).filter((x) => !x.book), it = st[st.length - 1];
        reveal(it, '<b>' + esc(t[1]) + '</b>: tried it!', 'your first-try stamp, postmarked today'); setTimeout(() => won(r), 1600); }
    });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if (tips.style.display === 'block') closeTips(); else close(); } });
    setTimeout(nowSync, 2000);
    const hv = (location.hash || '').slice(1), h0 = load();
    if (hv === 'try') S.scope = mine(h0).length ? mine(h0) : ['read'];
    if (/^shelf-(read|game)$/.test(hv) && h0.picked.indexOf(hv.slice(6)) >= 0) S.lib = hv.slice(6);
    S.v = S.lib && hv === 'shelf-' + S.lib ? 'shelf' : hv === 'try' ? 'try' : isHob(hv) && h0.picked.indexOf(hv) >= 0 ? hv : hv === 'pick' ? 'pick' : h0.picked.length ? 'hub' : 'pick';
    render();
    let seenT = '1'; try { seenT = localStorage.getItem('gsb.seenHobbyTips') || ''; } catch (e) {} if (seenT !== '1') setTimeout(openTips, 450);
    addEventListener('pageshow', (e) => { if (e.persisted) render(); });
  }
