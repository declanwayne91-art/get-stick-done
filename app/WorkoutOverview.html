<script type="text/x-dc-logic" id="dc-logic">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.timers = [];
  }
  later(fn, ms) { this.timers.push(setTimeout(fn, ms)); }
  componentWillUnmount() { clearInterval(this.loop); this.timers.forEach((t) => clearTimeout(t)); }

  stopRest() { clearInterval(this.loop); }
  startRest(secs) {
    this.stopRest();
    this.setState({ rest: secs, restTotal: secs, restOver: false });
    const unit = window.GSD_BETA ? 1000 : 100, end = Date.now() + secs * unit;   // the demo runs rest 10x faster
    if (typeof GSN !== 'undefined') GSN.keepAwake();
    this.loop = setInterval(() => {
      const left = Math.ceil((end - Date.now()) / unit);
      if (left <= 0) {
        this.stopRest();
        this.tap([40, 60, 40]);
        this.setState({ rest: 0, restOver: true });
        if (typeof GSN !== 'undefined') GSN.tap('go', 'GO AGAIN!', 'Rest’s over: next set', 'rest');
      } else if (left !== (this.state || {}).rest) {
        this.setState({ rest: left });
      }
    }, 250);
  }

  openW(e, x) {
    if (x.bw || this._wL) return;
    const SUG = {"GOBLET SQUAT": [8, 12, 16, 2, "one dumbbell, held at your chest"], "ROMANIAN DEADLIFT": [20, 30, 40, 2.5, "the whole bar, plates included"], "WALKING LUNGE": [4, 6, 10, 1, "in each hand"], "LEG PRESS": [30, 50, 80, 5, "on the machine"], "LAT PULLDOWN": [20, 30, 40, 2.5, "on the stack"], "SEATED ROW": [20, 30, 40, 2.5, "on the stack"], "DUMBBELL ROW": [8, 12, 18, 2, "one dumbbell"], "FACE PULL": [7.5, 10, 15, 2.5, "on the cable"], "HAMMER CURL": [4, 6, 10, 1, "in each hand"], "BENCH PRESS": [20, 30, 45, 2.5, "the whole bar: an empty Olympic bar is 20 kg"], "OVERHEAD PRESS": [15, 20, 30, 2.5, "the whole bar"], "BARBELL CURL": [10, 15, 20, 2.5, "the whole bar"], "LATERAL RAISE": [2, 4, 6, 1, "in each hand"]}, PLAN = 'push', sug = SUG[x.name];
    const ls = (k) => { try { return localStorage.getItem(k); } catch (er) { return null; } };
    let WT = {}; try { WT = JSON.parse(ls('gsb.weights') || '{}'); } catch (er) {}
    let P = null; try { P = JSON.parse(ls('gsb.progress') || 'null'); } catch (er) {}
    const tip = !!(x.first && P && P.gym && P.gym[PLAN] && P.gym[PLAN].tip && WT[x.name] != null);
    const lv = ls('gsb.fitLevel') || 'new', LVN = { new: 'just starting', back: 'getting back into it', regular: 'pretty regular' };
    const step = sug ? sug[3] : 2.5;
    const L = document.createElement('div'); L.className = 'wt-layer'; L.setAttribute('role', 'dialog'); L.setAttribute('aria-modal', 'true'); L.setAttribute('aria-label', 'Your weight for ' + x.name.toLowerCase());
    L.innerHTML = '<div class="wt-scrim"></div><div class="wt-card"><span class="wt-tape"></span><span class="wt-t title-die">' + x.name + '</span><span class="wt-s">your working weight · ' + x.reps + '</span>'
      + (tip ? '<button type="button" class="wt-tip">⬆ READY FOR MORE: +2.5 KG</button>' : '')
      + '<div class="wt-row"><button type="button" class="wt-pm" data-d="-1" aria-label="Less">−</button><label class="wt-box"><input class="wt-in" type="text" inputmode="decimal" aria-label="Weight in kilograms" placeholder="?"><span>kg</span></label><button type="button" class="wt-pm" data-d="1" aria-label="More">+</button></div>'
      + (sug ? '<button type="button" class="wt-sug">SUGGEST A WEIGHT</button><span class="wt-why" aria-live="polite"></span>' : '')

    document.body.appendChild(L); this._wL = L;
    const card = L.querySelector('.wt-card'), inp = L.querySelector('.wt-in');
    const stage = document.getElementById('dc-stage') || document.querySelector('[data-dc-root]') || document.body, R = stage.getBoundingClientRect(), k = Math.min(1.4, (R.width || innerWidth) / 390);
    card.style.transform = 'translate(-50%, -50%) scale(' + k + ') rotate(-1deg)';
    const cur = () => { const v = parseFloat(String(inp.value).replace(',', '.')); return isFinite(v) && v >= 0 ? v : null; };
    const set = (v) => { inp.value = v == null ? '' : String(Math.round(v * 10) / 10); };
    set(WT[x.name]);
    const buzz = (p) => { try { if (ls('gsb.haptics') !== '0' && navigator.vibrate) navigator.vibrate(p); } catch (er) {} };
    L.querySelectorAll('.wt-pm').forEach((b) => b.addEventListener('click', () => { const v = cur(); set(Math.max(0, (v == null ? (sug ? sug[{ new: 0, back: 1, regular: 2 }[lv] || 0] : 0) : v + step * +b.dataset.d))); buzz(6); }));
    const sb = L.querySelector('.wt-sug'); if (sb) sb.addEventListener('click', () => {
      const v = sug[{ new: 0, back: 1, regular: 2 }[lv] || 0]; set(v); buzz(10);
      L.querySelector('.wt-why').textContent = 'For someone ' + (LVN[lv] || 'just starting') + ': start around ' + v + ' kg (' + sug[4] + '). Do one test set. If the last 2 reps feel easy, go up ' + step + ' kg. If your form slips, go down. Everyone’s different, so trust how it feels.';
    });
    const tb = L.querySelector('.wt-tip'); if (tb) tb.addEventListener('click', () => { set((cur() || 0) + 2.5); buzz([10, 40, 16]); tb.textContent = 'NICE. SAVE TO KEEP IT'; tb.disabled = true; this._wTip = true; });

    const onKey = (ev) => { if (ev.key === 'Escape') close(); if (ev.key === 'Enter') save(); };
    const save = () => {
      const v = cur(); if (v == null) delete WT[x.name]; else WT[x.name] = v;
