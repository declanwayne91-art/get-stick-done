      + '<span id="sa-gNote" class="kal" style="font-size:14px;opacity:0.7;text-align:center"></span>'
      + '<button type="button" id="sa-gPin" class="press bri" style="width:100%;height:54px;border-radius:16px;border:3px solid #172038;background:#C6FF4D;color:#172038;font-size:20px;box-shadow:4px 4px 0 #172038"></button>'

    const gScrim = $('sa-gScrim'), gBox = $('sa-goal'); let gSlot = null;
    const gClose = () => { gScrim.style.display = 'none'; gBox.style.display = 'none'; gSlot = null; };
    // what to do to earn a sticker you can pin (challenges carry their own words; the rest come from how progress.py hands them out)
    const PINNABLE = ['chal', 'holo', 'season', 'mystery', 'first', 'cook', 'move', 'level', 'seal'];
    const HOWX = { 'f-day1': 'Finish setting up the app', 'f-cook': 'Cook any recipe in cooking mode', 'f-gym': 'Finish any workout',
      'f-water': 'Hit your water goal for a day', 'f-friend': 'Send a spare sticker to a friend',

    const howFor = (s) => s.full || s.how || HOWX[s.id] || (s.kind === 'cook' ? 'Cook ' + (s.label || 'this dish') + ' in cooking mode'

    $('sa-gX').addEventListener('click', gClose); gScrim.addEventListener('click', gClose);

      const s = slotById[el.dataset.slot]; if (s && PINNABLE.indexOf(s.kind) >= 0) openGoal(s); });
