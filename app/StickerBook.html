      for (let i = 0; i < 12; i++) { const s = document.createElement('span'); const a = (i / 12) * Math.PI * 2, r = 110 + Math.random() * 40;

        root.appendChild(s); requestAnimationFrame(() => { s.style.transform = 'translate(' + (Math.cos(a) * r).toFixed(0) + 'px,' + (Math.sin(a) * r).toFixed(0) + 'px) rotate(' + (a * 60).toFixed(0) + 'deg)'; s.style.opacity = 0; });

    // ---- pointer handling
    let down = null;

    const toggleSelect = () => { S.select = !S.select; sel.style.opacity = S.select ? 1 : 0; buzz(6); say(S.select ? 'Now tap your page where it should go.' : 'Peel it from the corner, then stick it on your page.'); if (!S.select) hint.style.opacity = 1; };
    $('sbk-page').addEventListener('pointerdown', (e) => { if (!S.select || S.mode !== 'tray') return; const [fx, fy] = toBoard(e); audio(); autoPeelTo(fx, fy); });
    $('sbk-autoBtn').addEventListener('click', () => { audio(); autoPeelTo(SLOT.x, SLOT.y); });
    const tg = (id, key, label) => { const b = $(id); const paint = () => { b.textContent = label + (S[key] ? ' on' : ' off'); b.style.opacity = S[key] ? 1 : 0.55; b.setAttribute('aria-pressed', S[key] ? 'true' : 'false'); };

    tg('sbk-hapBtn', 'haptics', 'haptics');

    // ---- explainer cards: one idea each, skippable, swipeable, reopen with "?"
    const tips = $('sbk-tips'), cards = [...tips.querySelectorAll('.tipc')], dots = [...tips.querySelectorAll('.tipdot')], tnext = $('sbk-tipNext');
    let ti = 0, tipsSeen = false;
    const showCard = (i, dir) => {
      cards.forEach((c, k) => { const rot = 'rotate(' + c.dataset.rot + 'deg)';
        if (k === i) { c.style.display = 'flex'; c.style.opacity = 0; c.style.transform = 'translateX(' + (reduce ? 0 : 40 * dir) + 'px) ' + rot;
          requestAnimationFrame(() => requestAnimationFrame(() => { c.style.opacity = 1; c.style.transform = 'translateX(0) ' + rot; })); }
        else c.style.display = 'none'; });
      dots.forEach((d, k) => { d.style.width = k === i ? '26px' : '10px'; d.style.background = k <= i ? '#FF6FB0' : 'transparent'; });
      tnext.textContent = i === cards.length - 1 ? (S.doneShown ? 'LET’S GO →' : 'GOT IT') : 'NEXT →';
    };
    const openTips = () => { ti = 0; tips.style.display = 'block'; requestAnimationFrame(() => { tips.style.opacity = 1; }); showCard(0, 1); buzz(6); };
    const closeTips = () => { tips.style.opacity = 0; setTimeout(() => { tips.style.display = 'none'; }, 220); tipsSeen = true; try { localStorage.setItem('gsb.bookTips', '1'); } catch (e) {} buzz(6);
      if (S.doneShown) $('sbk-whatNext').textContent = 'LET’S GO →'; };
    const goToday = () => { const a = $('sbk-toToday'); if (a) a.click(); };   // first run: on to the home screen
    tnext.addEventListener('click', () => { if (ti < cards.length - 1) { ti++; showCard(ti, 1); sfx.tick(); } else { closeTips(); if (S.doneShown) goToday(); } });

      tray.style.transform = 'none'; tray.style.opacity = 1; slot.style.opacity = 1; S.mode = 'tray'; S.x = TRAY.x; S.y = TRAY.y; S.rot = 0; S.scale = 1; place(); setPeel(REST); lifted(false); hint.style.opacity = 1; say('Peel it from the corner, then stick it on your page.'); });
