      h += '<span class="gp-h bri">RECENT</span>' + (recent.length ? '<ul class="gp-recent">' + recent.map((e) => '<li><span class="kal">' + new Date(e.at).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }) + '</span><b>' + esc(e.title) + '</b>' + (FELT[e.felt] ? '<em class="bri" style="background:' + FELT[e.felt][1] + '">' + FELT[e.felt][0] + '</em>' : '') + '</li>').join('') + '</ul>' : '<span class="kal gp-none">Nothing yet. Your workouts will show up here.</span>');
      body.innerHTML = h;
      $('gp-grow').addEventListener('click', () => { GSP.setOn(id, !A.on); buzz(A.on ? 6 : [10, 40, 16]); paint(); open(id); });
      if (!sheet.classList.contains('open')) { sheet.style.display = 'block'; requestAnimationFrame(() => sheet.classList.add('open')); setTimeout(() => $('gp-grow').focus(), 60); }
      const n = body.querySelector('.gp-ladder li.n'); if (n) n.scrollIntoView({ block: 'nearest' });
    };
    const close = () => { sheet.classList.remove('open'); setTimeout(() => { sheet.style.display = 'none'; }, 250); };
    $('gp-areas').addEventListener('click', (e) => { const b = e.target.closest('.gp-area'); if (b) { buzz(6); open(b.dataset.a); } });
    $('gp-close').addEventListener('click', close); $('gp-scrim').addEventListener('click', close);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && sheet.classList.contains('open')) close(); });

    // ---- demo only: a sample month, so there's something to look at
    $('gp-demo').addEventListener('click', () => {
      let ns = null; try { ns = localStorage.getItem('gsb.newStickers'); } catch (e) {}
      const P = GSP.load(); GSP.area(P, 'run').stage = 0; GSP.save(P); GSP.setOn('run', true);
      const now = Date.now(), d = 864e5, wk = GSP.week(now), L = GSP.LAD;
      const at = (w, day) => Math.min(now - 3600e3, wk - w * 7 * d + day * d + 18 * 3600e3);
      [[3, 0, 'run', 0, 'right', 30], [3, 2, 'walk', null, 'right', 30], [3, 4, 'run', 0, 'easy', 30], [2, 0, 'run', 1, 'right', 31], [2, 2, 'swim', null, 'right', 20, 12],
       [2, 4, 'run', 1, 'easy', 31], [2, 5, 'stretch', null, 'easy', 10], [1, 0, 'run', 2, 'tough', 28], [1, 1, 'gym', null, 'right', 45], [1, 3, 'run', 2, 'right', 28],
       [1, 5, 'walk', null, 'easy', 42, 0, 2], [0, 0, 'run', 2, 'easy', 28], [0, 1, 'cycle', null, 'right', 20]]
        .forEach(([w, day, type, stage, felt, mins, len, mi]) => { const tr = stage != null;
          GSP.log({ type, plan: tr ? 'stage' : 'sample', title: tr ? L[type][stage].title : type === 'gym' ? 'LEG DAY' : type === 'swim' ? 'STARTER SWIM' : type === 'walk' ? (mi ? '2-MILE WALK' : 'BRISK 30') : type === 'cycle' ? 'EASY SPIN' : '10-MINUTE STRETCH',
            felt, track: tr, stage: tr ? stage : undefined, mins, len: len || 0, mi: mi || 0, km: 0, at: at(w, day) }); });
      try { if (ns === null) localStorage.removeItem('gsb.newStickers'); else localStorage.setItem('gsb.newStickers', ns); } catch (e) {}
      buzz([10, 40, 16]); paint();
    });
    paint();
    return true;
  }

  gtStart(STEPS, flag) {
    this.gtEnd(false);
    const L = document.createElement('div'); L.className = 'kt-layer'; L.setAttribute('role', 'dialog'); L.setAttribute('aria-modal', 'true'); L.setAttribute('aria-label', 'Quick tour');
    L.innerHTML = '<div class="kt-spot"></div><div class="kt-card"><span class="kt-tape"></span><span class="kt-title title-die bri"></span><span class="kt-text"></span><div class="gt-extra"></div>'
      + '<div class="kt-foot"><span class="kt-dots"></span><button type="button" class="kt-skip">skip</button><button type="button" class="kt-btn bri"></button></div></div>';
    document.body.appendChild(L);
    const spot = L.querySelector('.kt-spot'), card = L.querySelector('.kt-card'), btn = L.querySelector('.kt-btn');
    const g = this._gt = { L, i: 0 };
    const place = () => {
      const st = STEPS[g.i], root = document.querySelector('[data-tour-root]'); if (!root) return;
      const R = root.getBoundingClientRect(), k = R.width / 390, el = st[0] && document.querySelector('[data-gt="' + st[0] + '"]');
      card.style.transform = 'scale(' + k + ') rotate(-1deg)'; card.style.left = (R.left + 18 * k) + 'px';
      let r;
      if (el) { const b = el.getBoundingClientRect(), pad = 6 * k; r = { l: b.left - pad, t: b.top - pad, w: b.width + pad * 2, h: b.height + pad * 2 }; spot.style.borderWidth = 3 * k + 'px'; }
      else { r = { l: R.left + R.width / 2, t: R.top + R.height / 2, w: 0, h: 0 }; spot.style.borderWidth = '0'; }
      Object.assign(spot.style, { left: r.l + 'px', top: r.t + 'px', width: r.w + 'px', height: r.h + 'px', borderRadius: 18 * k + 'px' });
      const ch = card.offsetHeight * k, gap = 16 * k;
      let top = el ? (r.t + r.h + gap + ch < R.bottom - 8 * k ? r.t + r.h + gap : r.t - gap - ch) : R.top + R.height / 2 - ch / 2;
      card.style.top = Math.max(R.top + 8 * k, top) + 'px';
    };
    const show = () => {
      const st = STEPS[g.i], last = g.i === STEPS.length - 1;
      L.querySelector('.kt-title').textContent = st[1]; L.querySelector('.kt-text').textContent = st[2];
      const ex = L.querySelector('.gt-extra'); ex.innerHTML = ''; ex.style.display = st[3] ? 'flex' : 'none'; if (st[3]) st[3](ex);
      btn.textContent = last ? 'GOT IT' : (g.i === 0 ? 'SHOW ME →' : 'NEXT →');
      L.querySelector('.kt-dots').innerHTML = STEPS.map((x, i) => '<span class="' + (i === g.i ? 'on' : i < g.i ? 'done' : '') + '"></span>').join('');
      place(); if (!st[3]) btn.focus();
    };
    btn.addEventListener('click', () => { if (g.i < STEPS.length - 1) { g.i++; this.gtBuzz(6); show(); } else { this.gtBuzz([10, 40, 16]); this.gtEnd(true, flag); } });
    L.querySelector('.kt-skip').addEventListener('click', () => this.gtEnd(true, flag));
    g.onKey = (e) => { if (e.key === 'Escape') this.gtEnd(true, flag); }; document.addEventListener('keydown', g.onKey);
    const track = () => { if (this._gt !== g) return; place(); g.raf = requestAnimationFrame(track); }; g.raf = requestAnimationFrame(track);
    show();
  }
  gtEnd(remember, flag) {
    const g = this._gt; if (!g) return; this._gt = null;
    cancelAnimationFrame(g.raf); document.removeEventListener('keydown', g.onKey); g.L.remove();
    if (remember && flag) try { localStorage.setItem(flag, '1'); } catch (e) {}
  }
  gtBuzz(p) { try { if (localStorage.getItem('gsb.haptics') !== '0' && navigator.vibrate) navigator.vibrate(p); } catch (e) {} }
  componentWillUnmount() { this.gtEnd(false); clearInterval(this._loop); }
}
