<style>

<script>window.GSD_API = 'https://api.getstickdone.app';</script>
<script>/* MOVE TO A NEW PHONE (movephone.py) */
window.GSMove = (function () {
  var P = 'gsb.', SKIP = [P + 'aid', P + 'analyticsOff', P + 'aq', P + 'moveOut', P + 'plateImgs'], ALPHA = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789', LIFE = 600000;
  function api() { return window.GSD_API_TEST || window.GSD_API || ''; }
  function post(path, body) { return fetch(api() + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { j.status = r.status; return j; }); }); }
  function ok() { return !!(api() && window.crypto && crypto.subtle && window.TextEncoder); }
  function newCode() { var out = '', b = new Uint8Array(1); while (out.length < 8) { crypto.getRandomValues(b); if (b[0] < 248) out += ALPHA[b[0] % 31]; } return out; }
  function clean(s) { return String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '').split('').filter(function (c) { return ALPHA.indexOf(c) >= 0; }).join('').slice(0, 8); }
  function show(code) { return code.slice(0, 4) + ' ' + code.slice(4); }
  function hex(u) { return Array.prototype.map.call(u, function (x) { return ('0' + x.toString(16)).slice(-2); }).join(''); }
  function b64(u) { var s = '', i; for (i = 0; i < u.length; i += 32768) s += String.fromCharCode.apply(null, u.subarray(i, i + 32768)); return btoa(s); }
  function unb64(s) { var r = atob(s), u = new Uint8Array(r.length), i; for (i = 0; i < r.length; i++) u[i] = r.charCodeAt(i); return u; }
  // the code -> a key to scramble with, and an id to file it under. Slow on purpose (200,000 rounds), so codes can't be guessed in bulk.
  function derive(code) {
    var enc = new TextEncoder();
    return crypto.subtle.importKey('raw', enc.encode(code), 'PBKDF2', false, ['deriveBits']).then(function (k) {
      return crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: enc.encode('get-stick-done move v1'), iterations: 200000 }, k, 512); }).then(function (bits) {
      var u = new Uint8Array(bits);
      return crypto.subtle.importKey('raw', u.slice(0, 32), 'AES-GCM', false, ['encrypt', 'decrypt']).then(function (key) { return { key: key, id: hex(u.slice(32)) }; }); });
  }
  function pipe(u, T, kind) { return new Response(new Blob([u]).stream().pipeThrough(new T(kind))).arrayBuffer().then(function (b) { return new Uint8Array(b); }); }
  function pack(key, obj) {
    var raw = new TextEncoder().encode(JSON.stringify(obj)), gz = typeof CompressionStream !== 'undefined';
    return (gz ? pipe(raw, CompressionStream, 'gzip') : Promise.resolve(raw)).then(function (body) {
      var iv = crypto.getRandomValues(new Uint8Array(12));
      return crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, body).then(function (ct) { var c = new Uint8Array(ct), all = new Uint8Array(13 + c.length); all[0] = gz ? 1 : 0; all.set(iv, 1); all.set(c, 13); return b64(all); }); });
  }
  function unpack(key, data) {
    var all = unb64(data);
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: all.slice(1, 13) }, key, all.slice(13)).then(function (pt) { var u = new Uint8Array(pt);
      return all[0] === 1 ? pipe(u, DecompressionStream, 'gzip') : u; }).then(function (u) { return JSON.parse(new TextDecoder().decode(u)); });
  }
  function collect() { var o = {}, i, k; for (i = 0; i < localStorage.length; i++) { k = localStorage.key(i); if (k.indexOf(P) === 0 && SKIP.indexOf(k) < 0) o[k.slice(P.length)] = localStorage.getItem(k); } return o; }
  function out() { try { return JSON.parse(localStorage.getItem(P + 'moveOut') || 'null'); } catch (e) { return null; } }
  // ---- old phone
  function begin(sum) {   // -> { code, id, until }
    var code = newCode();
    return derive(code).then(function (d) { return pack(d.key, { v: 1, sum: sum || {}, ls: collect() }).then(function (data) { return post('/m/put', { id: d.id, data: data }); }).then(function (j) {
      if (!j.ok) throw new Error(j.error || 'failed');
      var rec = { id: d.id, at: Date.now() }; localStorage.setItem(P + 'moveOut', JSON.stringify(rec)); return { code: code, id: d.id, until: rec.at + LIFE }; }); });
  }
  function state(id) { return post('/m/state', { id: id }).then(function (j) { return j.state || 'x'; }); }
  function cancel() { var o = out(); try { localStorage.removeItem(P + 'moveOut'); } catch (e) {} if (o) post('/m/drop', { id: o.id }).catch(function () {}); }
  function wipe() {   // the same as START FRESH, without the hold: reminders off for this phone, then everything gone
    var jobs = [];
    try { if (typeof GSN !== 'undefined' && GSN.allOff) jobs.push(Promise.resolve(GSN.allOff()).catch(function () {})); } catch (e) {}
    jobs.push(new Promise(function (done) { try { var r = indexedDB.deleteDatabase('gsd'); r.onsuccess = r.onerror = r.onblocked = function () { done(); }; } catch (e) { done(); } }));
    return Promise.race([Promise.all(jobs), new Promise(function (done) { setTimeout(done, 2500); })]).then(function () {
      try { Object.keys(localStorage).filter(function (k) { return k.indexOf(P) === 0 && [P + 'aid', P + 'analyticsOff'].indexOf(k) < 0; }).forEach(function (k) { localStorage.removeItem(k); }); sessionStorage.clear(); } catch (e) {} });
  }
  function moved() {   // ALL MOVED! over whatever screen is showing
    var d = document.createElement('div'); d.setAttribute('role', 'alertdialog'); d.setAttribute('aria-label', 'All moved');
    d.style.cssText = 'position:fixed;inset:0;z-index:10000;background:#172038;background-image:radial-gradient(rgba(246,239,225,0.10) 1.4px,transparent 1.6px);background-size:24px 24px;color:#F6EFE1;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:0 26px;box-sizing:border-box';
    d.innerHTML = '<div style="max-width:420px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px"><span style="font-family:\'Bricolage Grotesque\',sans-serif;font-weight:800;font-stretch:75%;font-size:44px;line-height:.95;text-shadow:4px 4px 0 #6EC8FF">ALL MOVED!</span>'
      + '<span style="font-family:Kalam,cursive;font-size:19px;line-height:1.3">Everything is on your new phone. This phone has been cleared, so your stickers only live in one place.</span>'
      + '<button type="button" style="height:56px;border-radius:18px;border:3px solid #0B1020;background:#FFD23F;color:#172038;font-family:\'Bricolage Grotesque\',sans-serif;font-weight:800;font-stretch:75%;font-size:20px;box-shadow:4px 4px 0 #0B1020;cursor:pointer">OK</button></div>';
    document.body.appendChild(d); var b = d.querySelector('button'); b.addEventListener('click', function () { location.replace('Splash.html'); }); try { b.focus(); } catch (e) {}
  }
  var finishing = false;
  function finish() { if (finishing) return Promise.resolve(); finishing = true; return wipe().then(moved); }
  // every time Today or Me opens: did a move I started get picked up while I was away?
  function check() { var o = out(); if (!o || !api()) return;
    if (Date.now() - o.at > 7 * 864e5) { try { localStorage.removeItem(P + 'moveOut'); } catch (e) {} return; }
    state(o.id).then(function (s) { if (s === 'd') finish(); else if (s === 'x' && Date.now() - o.at > LIFE) { try { localStorage.removeItem(P + 'moveOut'); } catch (e) {} } }).catch(function () {}); }
  // ---- new phone
  function find(code) {   // -> { id, sum, ls }   (rejects with Error('not found' | 'used' | 'bad'))
    return derive(code).then(function (d) { return post('/m/get', { id: d.id }).then(function (j) {
      if (!j.ok) throw new Error(j.status === 409 ? 'used' : j.status === 404 ? 'not found' : 'failed');
      return unpack(d.key, j.data).then(function (o) { if (!o || o.v !== 1 || !o.ls) throw new Error('bad'); o.id = d.id; return o; }, function () { throw new Error('bad'); }); }); });
  }
  function take(o) {   // save it here, then tell the server (so the old phone clears). Saved first: two copies beat none.
    var ls = o.ls, k, pf, gd;
    try { pf = JSON.parse(ls.profile || 'null'); if (pf) { pf.hydroPush = false; pf.watch = false; delete pf.friendPush; ls.profile = JSON.stringify(pf); } } catch (e) {}   // reminders belong to a phone
    try { gd = JSON.parse(ls.gymDays || 'null'); if (gd && gd.nudge) { gd.nudge = false; ls.gymDays = JSON.stringify(gd); } } catch (e) {}
    var old = {}; Object.keys(localStorage).forEach(function (x) { if (x.indexOf(P) === 0 && SKIP.indexOf(x) < 0) old[x] = localStorage.getItem(x); });
    try { Object.keys(old).forEach(function (x) { localStorage.removeItem(x); }); for (k in ls) localStorage.setItem(P + k, ls[k]); }
    catch (e) { try { Object.keys(ls).forEach(function (x) { localStorage.removeItem(P + x); }); Object.keys(old).forEach(function (x) { localStorage.setItem(x, old[x]); }); } catch (e2) {} return Promise.reject(new Error('full')); }
    var tries = 0; function done() { return post('/m/done', { id: o.id }).then(function (j) { if (!j.ok) throw new Error('x'); return true; }).catch(function () { return ++tries < 4 ? new Promise(function (r) { setTimeout(r, 1200); }).then(done) : false; }); }
    return done();   // -> true (old phone will clear) | false (couldn't say so: the old phone keeps its copy)
  }
  return { ok: ok, begin: begin, state: state, cancel: cancel, finish: finish, check: check, find: find, take: take, clean: clean, show: show, out: out, LIFE: LIFE };
})();
</script>

</head><body><main id="mv" aria-live="polite"></main>
<script>
(function () {
  var $ = document.getElementById('mv'), P = 'gsb.';
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function has() { try { return !!localStorage.getItem(P + 'profile'); } catch (e) { return false; } }
  function home() { location.replace(has() ? 'Today.html' : 'Splash.html'); }
  function back() { var same = false; try { same = !!document.referrer && new URL(document.referrer).origin === location.origin; } catch (e) {} if (same && history.length > 1) history.back(); else home(); }   // from setup: back to where you were
  function ask(msg) {
    $.innerHTML = '<h1 class="bri" style="text-shadow:4px 4px 0 #6EC8FF">MOVING FROM ANOTHER PHONE?</h1>'
      + (msg ? '<div class="warn" role="alert">' + msg + '</div>' : '')
      + '<p>On your old phone, open Me, tap the settings cog, then MOVE TO A NEW PHONE. Type the code it shows:</p>'
      + '<input id="mv-code" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="9" placeholder="XXXX XXXX" aria-label="The code from your old phone">'
      + '<button type="button" id="mv-go" class="btn bri" style="background:#C6FF4D;box-shadow:4px 4px 0 #FF6FB0" disabled>FIND MY ST*CK</button>'
      + '<button type="button" id="mv-no" class="link">Back</button>';
    var inp = document.getElementById('mv-code'), go = document.getElementById('mv-go');
    inp.addEventListener('input', function () { var c = GSMove.clean(inp.value); inp.value = c.length > 4 ? GSMove.show(c) : c; go.disabled = c.length !== 8; });
    inp.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !go.disabled) go.click(); });
    go.addEventListener('click', function () { look(GSMove.clean(inp.value)); });
    document.getElementById('mv-no').addEventListener('click', back);
  }
  function look(code) {
    $.innerHTML = '<h1 class="bri" style="text-shadow:4px 4px 0 #6EC8FF">LOOKING FOR YOUR ST*CK…</h1><p>Keep your old phone open on its code.</p>';
    if (!GSMove.ok()) return ask('This browser can’t move things across. Try opening this page in Chrome.');
    var t0 = Date.now();
    (function again() { GSMove.find(code).then(found, function (e) {
      if (e.message === 'not found' && Date.now() - t0 < 6000) return setTimeout(again, 1500);   // the old phone may still be sending
      ask(e.message === 'used' ? 'That code has already been used. Make a new one on your old phone.' : e.message === 'not found' || e.message === 'bad' ? 'That code didn’t work. It may have run out. Make a new one on your old phone and try again.' : 'Couldn’t reach the server. Check you’re online and try again.'); }); })();
  }
  function found(o) {
    var s = o.sum || {}, n = +s.n || 0, p = +s.p || 0, f = +s.f || 0, name = String(s.name || 'Your book').slice(0, 20);
    var bits = [n + (n === 1 ? ' sticker' : ' stickers')]; if (p) bits.push(p + (p === 1 ? ' pin badge' : ' pin badges')); if (f) bits.push(f + (f === 1 ? ' friend' : ' friends'));
    $.innerHTML = '<h1 class="bri" style="text-shadow:4px 4px 0 #FF6FB0">FOUND YOUR ST*CK!</h1><p>Ready to bring everything across from your other phone?</p>'
      + '<div class="plate"><span class="ini bri">' + esc(name.charAt(0).toUpperCase()) + '</span><span style="display:flex;flex-direction:column;min-width:0"><span class="bri" style="font-size:22px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(name.toUpperCase()) + ' · LEVEL ' + (+s.lv || 1) + '</span><span style="font-size:16px">' + bits.join(' · ') + '</span></span></div>'
      + (has() ? '<div class="warn">This phone already has a sticker book on it. Bringing everything across replaces it.</div>' : '')
      + '<button type="button" id="mv-yes" class="btn bri" style="background:#C6FF4D;box-shadow:4px 4px 0 #FF6FB0">BRING IT ALL ACROSS</button>'
      + '<span class="small" style="text-align:center">Reminders will need switching on again on this phone.</span>'
      + '<button type="button" id="mv-no" class="link">' + (has() ? 'No thanks, keep this phone as it is' : 'No thanks, start new') + '</button>';
    document.getElementById('mv-no').addEventListener('click', home);
    var yes = document.getElementById('mv-yes');
    yes.addEventListener('click', function () { yes.disabled = true; yes.textContent = 'BRINGING IT ACROSS…';
      GSMove.take(o).then(function (told) {
        if (told) return location.replace('Today.html');
        $.innerHTML = '<h1 class="bri" style="text-shadow:4px 4px 0 #C6FF4D">IT’S ALL HERE!</h1><p>Everything is on this phone now. We couldn’t tell your old phone, so it still has its copy. Use START FRESH in its settings to clear it.</p><button type="button" id="mv-ok" class="btn bri" style="background:#FFD23F;box-shadow:4px 4px 0 #0B1020">OK</button>';
        document.getElementById('mv-ok').addEventListener('click', function () { location.replace('Today.html'); });
      }, function () { ask('There isn’t enough room on this phone to bring everything across. Nothing was changed.'); }); });
  }
  function start() {
    var code = GSMove.clean(decodeURIComponent((location.hash || '').replace(/^#/, '')));
    try { history.replaceState(null, '', location.pathname); } catch (e) {}   // the code doesn't stay in the address bar
    if (code.length === 8) look(code); else ask('');
  }
  addEventListener('hashchange', function () { if ((location.hash || '').length > 1) start(); });   // scanned again with this page already open
  start();
})();
</script>
