      let F = JSON.parse(localStorage.getItem('gsb.favs') || '[]'); if (!Array.isArray(F)) F = []; F = F.filter((x) => x !== "spicy-tuna-crispy-rice"); if (v === 'love') F.push("spicy-tuna-crispy-rice"); else if (v === 'fine' && (JSON.parse(localStorage.getItem('gsb.favs') || '[]') || []).indexOf("spicy-tuna-crispy-rice") >= 0) F.push("spicy-tuna-crispy-rice");
