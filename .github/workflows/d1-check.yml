# One-off check that the Cloudflare token can use D1 (the database the friends features will use). Read-only: lists databases.
name: Check D1 access
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: List D1 databases
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          code=$(curl -s -o r.json -w '%{http_code}' -H "Authorization: Bearer $T" "https://api.cloudflare.com/client/v4/accounts/$A/d1/database")
          ok=$(jq -r '.success' r.json); n=$(jq -r '.result | length' r.json 2>/dev/null); err=$(jq -r '[.errors[]?.message] | join("; ")' r.json)
          if [ "$ok" = "true" ]; then echo "::notice::D1 OK (HTTP $code), $n database(s)"; else echo "::error::D1 not allowed (HTTP $code): $err"; exit 1; fi
